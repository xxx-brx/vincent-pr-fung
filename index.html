{t:"kup",q:"Wie berechnet man die Reibungskraft?",a:["F_R = µ · F_N","F_R = F_N / µ","F_R = m · a","F_R = µ + F_N"],e:"µ = Reibungszahl, F_N = Anpresskraft."},
{t:"kup",q:"Welche Eigenschaften soll ein Kupplungsbelag haben?",a:["Hohe gleichbleibende Reibungszahl, verschleißfest, temperaturbeständig","Möglichst glatt","Weich wie Gummi","Leitend für Strom"],e:"Belagarten: organisch oder Sinter/Metall (Rennsport)."},
{t:"kup",q:"Welche Bauteile gehören zur hydraulischen Kupplungsbetätigung?",a:["Geberzylinder, Leitung, Nehmerzylinder, Ausgleichsbehälter","Seilzug und Feder","Unterdruckdose","Elektromotor und Relais"],e:"Am Ende wirkt der Nehmerzylinder auf Ausrückhebel und Ausrücklager."},
{t:"kup",q:"Warum rutscht eine Kupplung?",a:["Verschlissener oder verölter Belag, nachlassende Anpresskraft","Zu viel Kupplungsspiel","Zu kalter Motor","Neue Reifen"],e:"Erkennbar: Drehzahl steigt, das Auto beschleunigt kaum."},
{t:"kup",q:"Warum klemmt eine Kupplung (trennt nicht)?",a:["Verbogene Scheibe, Nabe auf der Welle festgerostet oder Luft in der Hydraulik","Verschlissener Belag","Zu hohe Anpresskraft","Zu wenig Motoröl"],e:"Folge: Gänge lassen sich schlecht einlegen, Krachen beim Schalten."},
{t:"kup",q:"Was gehört zur Kupplungsscheibe?",a:["Nabe, Dämpferfedern, Belagfedersegmente, Mitnehmerscheibe, Reibbeläge","Membranfeder und Kupplungsdeckel","Schwungrad und Anlasserzahnkranz","Geber- und Nehmerzylinder"],e:"Membranfeder und Deckel gehören zur Druckplatte."},
{t:"kup",q:"Welche Teile gehören zur Membranfederkupplung (Druckplatte)?",a:["Kupplungsdeckel, Membranfeder, Kippringe, Distanzbolzen, Tangentialblattfedern","Nur die Kupplungsscheibe","Pumpenrad und Turbinenrad","Synchronring und Schaltmuffe"],e:"Die Tangentialblattfedern heben die Druckplatte beim Auskuppeln ab."},
{t:"kup",q:"Wie verhält sich die Anpresskraft einer Membranfeder bei Belagverschleiß?",a:["Sie bleibt nahezu gleich (Kennlinie mit Maximum)","Sie fällt sofort auf null","Sie verdoppelt sich","Sie schwankt stark"],e:"Darum ist die Membranfeder besser als einzelne Schraubenfedern."},
{t:"kup",q:"Welche Aufgaben hat die Kupplung insgesamt?",a:["Kraftfluss trennen und verbinden, weich anfahren, Schwingungen dämpfen, Überlastschutz","Nur den Motor starten","Nur das Getriebe kühlen","Nur bremsen"],e:"Torsionsdämpfer in der Scheibe dämpft die Drehschwingungen."},
// ================= Motormanagement Otto (Fotos 0001, 0144, 0171–0184) =================
{t:"otto",q:"Welche Aufgaben hat die Benzineinspritzung?",a:["Genau dosierte Kraftstoffmenge für jeden Betriebszustand, gute Gemischbildung","Nur den Motor kühlen","Nur den Kraftstoff vorwärmen","Den Ölstand regeln"],e:"Ziel: wenig Verbrauch und Schadstoffe, hohe Leistung."},
{t:"otto",q:"Welches dieser Bauteile ist bei der ME-Motronic ein Aktor?",a:["Tankentlüftungsventil","Klopfsensor","Luftmassenmesser","Kühlmitteltemperaturfühler"],e:"Aktoren: Einspritzventil, Tankentlüftungsventil, Drosselklappensteller, Zündspule. Die anderen sind Sensoren."},
{t:"otto",q:"Wie regelt die ME-Motronic den Leerlauf?",a:["Über den Drosselklappensteller (E-Gas), ohne eigenen Leerlaufsteller","Über ein Leerlaufstellventil","Über den Vergaser","Gar nicht"],e:"Leerlauffüllungsregelung über die elektronisch betätigte Drosselklappe."},
{t:"otto",q:"Was passiert beim E-Gas, wenn der Fahrer gleichzeitig Gas gibt und bremst?",a:["Das Gas wird zurückgenommen (Brake-Override)","Der Motor dreht hoch","Die Bremse wird abgeschaltet","Der Motor geht aus"],e:"Sicherheitsfunktion gegen klemmendes Gaspedal."},
{t:"otto",q:"Welche Warnleuchte zeigt bei VW einen Fehler im E-Gas-System?",a:["EPC","ABS","SRS","DPF"],e:"Dazu Notlauf mit eingeschränkter Leistung und Fehlerspeichereintrag."},
{t:"otto",q:"Was kennzeichnet den Homogenbetrieb beim Direkteinspritzer?",a:["Gemisch ca. λ = 1, Einspritzung im Ansaugtakt","Sehr mageres Gemisch, Einspritzung kurz vor der Zündung","Kein Kraftstoff","λ = 3 überall"],e:"Schichtbetrieb dagegen: Einspritzung spät im Verdichtungstakt, gesamt sehr mager."},
{t:"otto",q:"Wie wird beim wandgeführten Verfahren das Gemisch zur Zündkerze gebracht?",a:["Über gezielte Luftführung mit Drallkanälen, Zylinderwand und Kolbenmulde","Durch einen zweiten Injektor","Durch die Zündkerze selbst","Durch den Turbolader"],e:"Beim strahlgeführten Verfahren spritzt der Injektor direkt neben die Zündkerze."},
{t:"otto",q:"Mit welchem Druck fördert die Elektrokraftstoffpumpe beim Direkteinspritzer vor?",a:["Ca. 4–6 bar, die Hochdruckpumpe verdichtet dann auf 200 bar und mehr","Ca. 200 bar","Ca. 0,5 bar","Ca. 2000 bar"],e:"Der Kraftstoff wird im Rail gespeichert und an die Injektoren verteilt."},
{t:"otto",q:"Wie wird die Last im Schichtladebetrieb geregelt?",a:["Über die Kraftstoffmenge (Qualitätsregelung), die Drosselklappe ist weit offen","Über die Drosselklappe (Quantitätsregelung)","Über den Zündzeitpunkt allein","Über die Kühlmitteltemperatur"],e:"Weniger Drosselverluste = weniger Verbrauch."},
{t:"otto",q:"Welche Bauteile hat ein Direkteinspritzer zusätzlich im Abgasstrang?",a:["NOx-Speicherkat und NOx-Sensor","Einen zweiten Auspuff","Einen Rußfilter mit AdBlue","Einen Schalldämpfer aus Keramik"],e:"Im Magerbetrieb kann der Drei-Wege-Kat kein NOx reduzieren."},
{t:"otto",q:"Was siehst du im Spannungsbild eines masseseitig angesteuerten Einspritzventils beim Schließen?",a:["Eine Induktionsspitze, danach Bordnetzspannung","Eine Spannung von 0 V","Eine Sinuswelle","Gar nichts"],e:"Spannung fällt auf 0 V = Ventil öffnet. Beim Abschalten induziert die Spule eine Spannungsspitze."},
{t:"otto",q:"Warum werden Diesel-Injektoren beim Common-Rail mit Boostspannung angesteuert?",a:["Für einen schnellen Stromanstieg und schnelles Öffnen, danach getaktete Haltephase","Damit sie länger halten","Damit sie leiser sind","Weil die Batterie zu schwach ist"],e:"Boostspannung ca. 50 V und mehr, danach Haltestrom mit Bordnetzspannung getaktet."},
{t:"otto",q:"Warum fettet die Motorsteuerung bei sehr hoher Last an (Turbolader ca. 1000 °C)?",a:["Zum Bauteilschutz – der zusätzliche Kraftstoff kühlt","Um mehr NOx zu erzeugen","Damit der Kat kalt bleibt","Um Öl zu sparen"],e:"Kat ca. 950 °C, Turbolader ca. 1000 °C – das Gemisch wird dann fetter."},
{t:"otto",q:"Wann entsteht der größte Teil der Abgase eines Ottomotors?",a:["In der ersten Minute nach dem Kaltstart, solange der Kat noch kalt ist","Bei Autobahnfahrt","Im Leerlauf nach 1 Stunde","Beim Bremsen"],e:"Darum Kat-Heizen und Sekundärluft beim Kaltstart."},
// ================= Abgas Otto (Fotos 0160–0170, 0185–0196) =================
{t:"abg",q:"Woraus besteht das Abgas eines Ottomotors hauptsächlich?",a:["Ca. 71 % Stickstoff, 14 % CO2, 13 % Wasserdampf, ca. 1 % Schadstoffe","Zu 50 % aus CO","Zu 90 % aus Ruß","Hauptsächlich aus Sauerstoff"],e:"Schadstoffe: CO, HC, NOx und Partikel."},
{t:"abg",q:"Was ist ein Katalysator?",a:["Ein Stoff, der eine chemische Reaktion beschleunigt, ohne sich selbst zu verändern","Ein Schalldämpfer","Ein Filter, der Ruß sammelt","Ein Sensor für Sauerstoff"],e:"Im Kat sind das die Edelmetalle Platin, Rhodium und Palladium."},
{t:"abg",q:"Wie ist ein Drei-Wege-Kat aufgebaut?",a:["Stahlgehäuse, Drahtgestrick, Keramik-Wabenkörper (Monolith), Wash-Coat, Edelmetallschicht","Nur ein leeres Rohr","Ein Papierfilter","Eine Wasserkammer"],e:"Der Wash-Coat vergrößert die Oberfläche enorm."},
{t:"abg",q:"Welcher Schadstoff ist bei λ = 0,8 besonders hoch?",a:["CO (Kohlenmonoxid)","NOx","O2","N2"],e:"Fett = Luftmangel = viel CO. Über λ = 1,2 steigt HC stark (Zündaussetzer an der Magerlaufgrenze)."},
{t:"abg",q:"Welche Betriebstemperatur braucht eine Breitband-Lambdasonde?",a:["Ca. 650–850 °C","Ca. 200–350 °C","Ca. 50 °C","Ca. 1200 °C"],e:"Sie misst λ stufenlos von ca. 0,7 bis reine Luft und hat meist 6 Anschlüsse."},
{t:"abg",q:"Was bedeutet beim Readinesscode eine 0 in der Zeile gesetzt?",a:["Die Diagnose dieses Systems wurde durchgeführt","Das System ist defekt","Das System ist nicht verbaut","Der Fehlerspeicher ist voll"],e:"Unterstützt 1 = System ist verbaut und wird überwacht. Nicht alle Systeme werden bei jeder Fahrt geprüft."},
{t:"abg",q:"Wann leuchtet die MIL dauerhaft?",a:["Bei abgasrelevantem Fehler, z. B. Grenzwert 1,5-fach überschritten oder Kat-Wirkungsgrad zu gering","Bei leerem Tank","Bei zu niedrigem Reifendruck","Beim Tanken"],e:"Auch bei Fehlern in Sensoren, Aktoren oder der Tankentlüftung."},
{t:"abg",q:"Wie sieht das Gutbild einer Vorkat-Sprungsonde aus?",a:["Pendelt etwa zwischen 100 und 900 mV mit ca. 1 Hz","Liegt konstant bei 0 V","Liegt konstant bei 5 V","Pendelt zwischen 10 und 12 V"],e:"Über 450 mV = fett, darunter = mager."},
{t:"abg",q:"Die Vorkatsonde zeigt ein träges, flaches Signal. Was ist die Ursache?",a:["Sonde gealtert oder verschmutzt (Ölasche, Silikon, Blei) oder Sondenheizung defekt","Der Kat ist neu","Der Tank ist voll","Die Zündkerzen sind neu"],e:"Prüfen: Heizung, Leitungen, dann Sonde tauschen."},
{t:"abg",q:"Wie sieht das Signal einer Nachkatsonde bei intaktem Kat aus?",a:["Ruhig, etwa 0,6 V","Es schwingt wie die Vorkatsonde","Konstant 0 V","Konstant 12 V"],e:"Der Kat speichert Sauerstoff und glättet die Schwankungen."},
{t:"abg",q:"Was bewirkt die Sekundärluft NICHT?",a:["Sie mindert kein NOx und schützt den Kat nicht vor Überhitzung","Sie verbrennt HC und CO nach","Sie heizt den Kat schneller auf","Sie bläst Frischluft hinter die Auslassventile"],e:"Sie arbeitet nur in der Kalt- und Warmlaufphase."},
{t:"abg",q:"Welche Pins am EOBD-Stecker sind die K- und L-Leitung?",a:["Pin 7 und 15","Pin 6 und 14","Pin 4 und 5","Pin 2 und 10"],e:"6/14 = CAN, 4 = Fahrzeugmasse, 5 = Signalmasse, 16 = Plus, 2/10 = SAE J1850."},
{t:"abg",q:"Wie reagiert die Lambdaregelung auf eine Sondenspannung von 0,8 V?",a:["Sie verkürzt die Einspritzzeit, das Gemisch wird magerer","Sie verlängert die Einspritzzeit","Sie schaltet den Motor ab","Sie ändert nichts"],e:"0,8 V = wenig Sauerstoff = fett. Danach fällt die Spannung auf ca. 0,2 V und es wird wieder angefettet."},
// ================= Abgas Diesel (Fotos 0145–0159) =================
{t:"dsl",q:"Welche Kraftstoffeigenschaft ist beim Diesel besonders wichtig?",a:["Die Zündwilligkeit (Cetanzahl)","Die Klopffestigkeit (Oktanzahl)","Die Farbe","Der Geruch"],e:"Diesel ist ein Selbstzünder mit innerer Gemischbildung."},
{t:"dsl",q:"Was gehört zu den innermotorischen Maßnahmen gegen Ruß?",a:["Common-Rail mit Hochdruck und Mehrfacheinspritzung, Brennraumform, AGR-Kühlung","Oxi-Kat und DPF","SCR-Kat","Größerer Auspuff"],e:"Außermotorisch = Abgasnachbehandlung: Oxi-Kat, DPF, SCR."},
{t:"dsl",q:"Was passiert, wenn der DPF zu stark beladen ist?",a:["Leistungsverlust (Notlauf), Mehrverbrauch, höherer Abgasgegendruck, Gefahr eines unkontrollierten Abbrands","Der Motor wird stärker","Der Verbrauch sinkt","Nichts"],e:"Ein unkontrollierter Abbrand kann den Filter durch Überhitzung zerstören."},
{t:"dsl",q:"Was musst du nach einem DPF-Tausch tun?",a:["Lernwerte und Asche-/Rußmasse mit dem Tester zurücksetzen","Nichts","Den Motor neu lackieren","AdBlue ablassen"],e:"Kunde: regelmäßig längere Strecken fahren, nur Diesel nach EN 590, Low-SAPS-Öl."},
{t:"dsl",q:"Welche Prinzipien nutzt ein Schalldämpfer?",a:["Absorption, Interferenz, Reflexion und Resonanz","Nur Verbrennung","Nur Kühlung","Nur Filterung"],e:"Absorption: Dämmwolle. Interferenz: Wellen löschen sich aus. Reflexion: Querschnittssprünge. Resonanz: Helmholtz-Kammer."},
{t:"dsl",q:"Warum muss die Abgasanlage dicht sein?",a:["Sonst falsche Sensorwerte, Lärm und Abgase (CO) im Innenraum","Damit sie glänzt","Damit der Tank voll bleibt","Nur wegen der Optik"],e:"Lambda-, NOx- und Differenzdrucksensor würden falsch messen."},
{t:"dsl",q:"Was passiert bei der SCR-Warnung Kein Motorstart mehr möglich?",a:["Nach dem Abstellen springt der Motor erst nach dem Auffüllen von AdBlue wieder an","Der Motor geht sofort aus","Es passiert nichts","Das Auto fährt nur rückwärts"],e:"Vorher kommen Hinweise: Restreichweite 2400 km, dann Kein Motorstart in 1000 km."},
{t:"dsl",q:"Was passiert mit dem AdBlue nach dem Abstellen des Motors?",a:["Es wird über das Umkehrventil zurück in den Tank gesaugt (ca. 60 s) – Batterie nicht sofort abklemmen","Es bleibt in der Leitung","Es wird verbrannt","Es läuft auf die Straße"],e:"So kann die Leitung im Winter nicht einfrieren. Dazu Heizungen in Tank, Pumpe und Leitung."},
{t:"dsl",q:"Wie wird die AdBlue-Menge dosiert?",a:["Über ein PWM-angesteuertes Dosiermodul, abhängig von Luftmasse, Abgastemperatur und NOx-Werten","Mit einer Handpumpe","Immer gleich viel","Nur beim Bremsen"],e:"Der NOx-Sensor nach dem Kat überwacht den Wirkungsgrad."},
{t:"dsl",q:"Wie prüfst du das AdBlue-System auf Dichtheit?",a:["Ca. 500 kPa aufbauen, 120 s halten, Druck darf nicht unter 450 kPa fallen","Mit Seifenwasser im Tank","Mit dem Multimeter","Durch Anschauen"],e:"Fällt der Druck darunter, ist das System undicht."},
{t:"dsl",q:"Ab welcher Temperatur zersetzt sich AdBlue?",a:["Ab ca. 60 °C","Ab ca. 0 °C","Ab ca. 200 °C","Gar nicht"],e:"Es zerfällt zu Ammoniak und CO2. Darum kühl lagern."},
{t:"dsl",q:"Was verbrennt die Werkstatt-Service-Regeneration und wann ist sie nötig?",a:["Ruß – wenn passive und aktive Regeneration nicht reichen, z. B. bei viel Kurzstrecke","Asche – bei jeder Inspektion","AdBlue – im Winter","Motoröl – beim Ölwechsel"],e:"Wird sie über den Tester gestartet, bleibst du die ganze Zeit beim Fahrzeug."},
{t:"dsl",type:"f",q:"Ein AdBlue-Tank hat 16,8 l. Wie weit kommt das Auto bei 0,08 l/100 km und wie weit bei 0,1 l/100 km?",k:["16,8 / 0,08 = 210 → 210 · 100 km = 21.000 km","16,8 / 0,1 = 168 → 16.800 km","Mehr Last (Autobahn) = mehr NOx = mehr AdBlue-Verbrauch"]},
{t:"dsl",type:"f",q:"Eine Kraft von 1,2 N wirkt auf 0,92 cm². Berechne den Druck in bar.",k:["p = F / A = 1,2 N / 0,92 cm² ≈ 1,30 N/cm²","1 bar = 10 N/cm²","p ≈ 0,13 bar"]},
// ================= Bremse, ABS & ESP (Hessen GP2 2017/18 – Fotos 0024–0040, 0083) =================
{t:"brm",q:"Warum prüfst du die Bremse auf dem Rollenprüfstand, bevor du den Fehlerspeicher liest?",a:["Um mechanische und hydraulische Fehler (Bremskraftdifferenz, Ovalität) auszuschließen – Sicherheit","Weil der Tester sonst nicht funktioniert","Um Bremsflüssigkeit zu sparen","Weil es Vorschrift für jede Inspektion ist"],e:"Ein Fehler kann mechanisch sein, z. B. am Radlager oder an der Bremse."},
{t:"brm",q:"Was zeigt die Dreieck-Aufteilung (HI bzw. LL) der Bremskreise?",a:["Beide Kreise wirken auf die Vorderachse, zusätzlich auf die Hinterräder","Ein Kreis nur hinten, einer nur vorne","Diagonal VL mit HR","Nur die Hinterachse wird gebremst"],e:"II = vorne/hinten getrennt, X = diagonal."},
{t:"brm",q:"Was machen die Magnetventile im ABS-Hydroaggregat?",a:["Sie wandeln elektrische Signale des Steuergeräts in hydraulische Druckänderungen um","Sie messen die Raddrehzahl","Sie erzeugen den Bremsdruck","Sie kühlen die Bremsflüssigkeit"],e:"Einlass- und Auslassventil je Rad."},
{t:"brm",q:"Welche Räder haben laut Bremsschlupfdiagramm die größte Seitenführungskraft?",a:["Nicht gebremste Räder","Blockierte Räder","Räder mit 50 % Schlupf","Durchdrehende Räder"],e:"Je mehr Schlupf, desto weniger Seitenführung. Darum verhindert ABS das Blockieren."},
{t:"brm",q:"Welche Störgrößen beeinflussen den ABS-Regelkreis?",a:["Zustand der Bremse, Reifen, Fahrbahn, Beladung","Die Radiolautstärke","Die Innenraumtemperatur","Die Farbe des Fahrzeugs"],e:"Regelgröße = Raddrehzahl bzw. Verzögerung, Stellgröße = Bremsdruck im Radbremszylinder."},
{t:"brm",q:"Was ist beim ABS die Stellgröße?",a:["Der Bremsdruck im Radbremszylinder","Die Raddrehzahl","Die Fahrzeuggeschwindigkeit","Der Lenkwinkel"],e:"Die Regelgröße ist die Raddrehzahl bzw. deren Änderung."},
{t:"brm",q:"Welche Sensoren braucht eine elektrische Feststellbremse mit Hill-Holder?",a:["EPB-Taster, Neigungs- bzw. Längsbeschleunigungssensor, Raddrehzahl","Nur den Bremslichtschalter","Lambdasonde und LMM","Klopfsensor"],e:"Sie erkennt die Steigung und hält das Auto beim Anfahren am Berg."},
{t:"brm",q:"Worauf achtest du bei der Sichtprüfung eines ABS-Sensors?",a:["Verschmutzung, Beschädigung, Sitz, Leitungen, Stecker, Impulsring und Radlagerspiel","Nur auf die Farbe","Nur auf den Reifendruck","Auf den Ölstand"],e:"Ein beschädigter Impulsring liefert ein lückenhaftes Signal."},
{t:"brm",q:"Wie erzeugt ein aktiver Raddrehzahlsensor sein Signal?",a:["Ein Multipolring mit Nord- und Südpolen dreht am Hall-IC vorbei, der ein Rechtecksignal bildet","Über eine Spule mit Sinussignal","Über einen Schleifkontakt","Über eine Lichtschranke"],e:"Vorteile: Messung ab ca. 0,1 km/h, Drehrichtung, Amplitude unabhängig von der Drehzahl."},
{t:"brm",q:"Das Sensorsignal liegt nach kurzem Beginn dauerhaft auf 0 V. Was ist die Ursache?",a:["Unterbrechung der Spannungsversorgung oder der Leitung","Der Sensor ist in Ordnung","Das Rad dreht zu schnell","Zu viel Bremsflüssigkeit"],e:"Weiter messen: Versorgungsspannung, Spannungsfall, Widerstand der Leitungen."},
// ================= Vernetzung CAN & LIN (Prüfung 6.1 – Fotos 0054–0064, 0109–0111) =================
{t:"can",q:"Welches Bussystem arbeitet mit Lichtwellenleitern im Ring?",a:["MOST (Infotainment)","Antriebs-CAN","LIN","Komfort-CAN"],e:"MOST ca. 22,5 MBit/s. Neuere Fahrzeuge nutzen auch Infotainment-CAN."},
{t:"can",q:"Was gibt die Einheit Baud an?",a:["Die Übertragungsgeschwindigkeit in Bit pro Sekunde","Die Spannung auf dem Bus","Die Anzahl der Steuergeräte","Die Leitungslänge"],e:"Antriebs-CAN 500 kBaud, Komfort-CAN 100 kBaud, LIN bis 20 kBaud."},
{t:"can",q:"Was legt ein Protokoll im Bussystem fest?",a:["Aufbau und Regeln der Botschaften – Reihenfolge, Priorität, Fehlerprüfung","Die Farbe der Leitungen","Die Spannung der Batterie","Die Uhrzeit"],e:"Damit verstehen sich alle Steuergeräte."},
{t:"can",q:"Wie viele Bit hat das Datenfeld einer CAN-Botschaft höchstens?",a:["64 Bit (8 Byte)","11 Bit","16 Bit","1 Bit"],e:"Der Identifier hat 11 Bit, die CRC-Prüfsumme 16 Bit."},
{t:"can",q:"Wozu dient das Sicherungsfeld (CRC) der CAN-Botschaft?",a:["Prüfsumme zur Fehlererkennung","Es legt die Priorität fest","Es enthält die Daten","Es weckt den Bus auf"],e:"Im Bestätigungsfeld (Acknowledge) melden die Empfänger den korrekten Empfang."},
{t:"can",q:"Beim Komfort-CAN ist CAN-Low nach Masse kurzgeschlossen. Was passiert?",a:["Alle Steuergeräte dieses Busses gehen in den Eindrahtbetrieb","Nur ein Steuergerät ist betroffen","Der Bus fällt komplett aus","Nichts"],e:"Eine Unterbrechung betrifft dagegen nur das Steuergerät an dieser Leitung."},
{t:"can",q:"Welche Pegel hat der Komfort-CAN (CAN-B) im dominanten Zustand?",a:["CAN-High ca. 4 V, CAN-Low ca. 1 V","Beide 2,5 V","High 0 V, Low 5 V","Beide 12 V"],e:"Rezessiv: High 0 V, Low 5 V. Die Signale sind spiegelbildlich."},
{t:"can",q:"Wie werden Daten auf dem CAN-Bus übertragen?",a:["Durch Spannungsänderungen auf der Leitung","Durch Licht","Durch Funk","Durch Druckluft"],e:"Ausgewertet wird die Differenz zwischen CAN-High und CAN-Low."},
{t:"can",q:"Was ist ein passiver Stern?",a:["Eine Sternstruktur, deren zentraler Knoten kein Steuergerät ist","Ein Ring aus Lichtleitern","Ein Bus mit nur einem Steuergerät","Eine Sternstruktur mit Gateway in der Mitte"],e:"Beim aktiven Stern ist die Zentrale ein Steuergerät bzw. Gateway."},
{t:"can",q:"Welche Farben hat bei VW die CAN-Low-Leitung?",a:["Orange/braun – bei allen CAN-Systemen","Orange/schwarz","Rot/blau","Grün/gelb"],e:"CAN-High: Antrieb orange/schwarz, Komfort orange/grün, Infotainment orange/violett."},
{t:"can",q:"Welcher Leitungsquerschnitt ist für CAN-Leitungen üblich?",a:["0,35 bzw. 0,5 mm², ungeschirmt, beide gleich lang","10 mm² geschirmt","2,5 mm² einzeln","Lichtwellenleiter"],e:"Verdrillung mit 20 mm Schlaglänge."},
{t:"can",q:"Wie viele Slaves kann ein LIN-Master höchstens ansteuern?",a:["Bis zu 16","Nur 1","Bis zu 100","Unbegrenzt"],e:"Typisch: Spiegel, Regensensor, Fensterheber, Klima-Bedienteil."},
{t:"can",q:"Woraus besteht der Header einer LIN-Botschaft?",a:["Sync-Break, Sync-Feld und Identifier – gesendet vom Master","Nur aus Daten","Aus der Prüfsumme","Aus der Antwort des Slaves"],e:"Die Response mit Datenbytes und Checksumme kommt vom Slave (oder Master)."},
{t:"can",q:"Das LIN-Signal liegt dauerhaft auf 12 V. Was ist die Ursache?",a:["Keine Kommunikation: Master sendet nicht, Unterbrechung oder Kurzschluss nach Plus","Kurzschluss nach Masse","Alles in Ordnung","Der Slave antwortet zu schnell"],e:"Dauerhaft 0 V = Kurzschluss nach Masse."},
{t:"can",q:"Warum muss der LIN-Sensor beim Messen mit dem Y-Adapter angesteckt bleiben?",a:["Die Kommunikation zwischen Master und Slave ist nur im Verbund messbar","Damit er nicht kaputtgeht","Weil sonst der Airbag auslöst","Das muss er nicht"],e:"Im Stromlaufplan erst Strompfad, Farbe und Querschnitt der Leitung bestimmen."},
{t:"can",q:"Der Komfort-CAN meldet Eindrahtbetrieb nur an der Fahrertür. Wie bestätigst du die Diagnose?",a:["CAN-Low testweise auf Masse legen: alle Geräte gehen in Eindrahtbetrieb, also reagiert der Bus richtig","Batterie abklemmen","Alle Sicherungen ziehen","Türsteuergerät tauschen"],e:"Danach mit dem Oszilloskop am Türstecker messen: fehlt CAN-High, ist diese Leitung unterbrochen."},
// ================= Airbag & Sicherheit (Prüfung 7.2 – Fotos 0045–0052) =================
{t:"air",q:"Welche Systeme sind pyrotechnisch?",a:["Fahrer-, Beifahrer-, Seiten- und Kopfairbags sowie Gurtstraffer","Nur das ABS","Die Zentralverriegelung","Die Klimaanlage"],e:"Manchmal auch die Batterietrennung."},
{t:"air",q:"Wozu dient die Wickelfeder im Lenkrad?",a:["Sie verbindet den Airbag im drehenden Lenkrad elektrisch mit dem Steuergerät","Sie dämpft das Lenkrad","Sie stellt die Lenkung zurück","Sie ist ein Crashsensor"],e:"Eine defekte Wickelfeder ist eine häufige Ursache für die Airbagleuchte."},
{t:"air",q:"Was ist ein Hybridgasgenerator?",a:["Druckgasflasche (200–500 bar) mit zusätzlicher Brennkammer mit Festtreibstoff, z. B. für Seiten- und Kopfairbags","Ein Generator im Hybridauto","Ein Gasgenerator für den Motor","Eine Lichtmaschine"],e:"Der Frontairbag hat meist einen Feststoff-Treibsatz."},
{t:"air",q:"Welche Aufgabe hat der Frontairbag zusammen mit dem Gurt?",a:["Er verhindert bei höherer Geschwindigkeit den Kopfaufschlag auf Lenkrad oder Armaturenbrett","Er schützt auch ohne Gurt vollständig","Er löst schon bei 5 km/h aus","Er drückt den Fahrer in den Sitz"],e:"Der Airbag ist ein Zusatz-Rückhaltesystem (SRS) – nur mit Gurt wirksam."},
{t:"air",q:"Wie stark verringert ein Gurtstraffer die Vorverlagerung bei 50 km/h ungefähr?",a:["Von ca. 90 cm auf ca. 30 cm","Von 10 cm auf 5 cm","Gar nicht","Von 2 m auf 1,5 m"],e:"Der Straffer zieht den Gurt in Millisekunden straff."},
{t:"air",q:"Welche Bauarten von Gurtstraffern gibt es?",a:["Kugel-, Rotor- (Wankel-) und Kolbenstraffer","Nur Federstraffer","Hydraulikstraffer mit Pumpe","Magnetstraffer"],e:"Alle sind pyrotechnisch – nach Auslösung tauschen."},
{t:"air",q:"Was gehört nur zur aktiven Sicherheit?",a:["Heizbare Scheiben, ergonomische Sitze, ASR","Airbag und Gurtstraffer","Knautschzone","Sicherheitslenkung"],e:"Aktiv = Unfall vermeiden. Passiv = Folgen mindern."},
{t:"air",q:"Warum wartest du nach dem Abklemmen der Batterie, bevor du am Airbag arbeitest?",a:["Der Energiereserve-Kondensator im Steuergerät muss sich entladen","Damit die Batterie abkühlt","Damit das Radio den Code vergisst","Das ist nicht nötig"],e:"Der Kondensator könnte sonst noch eine Zündung auslösen."},
{t:"air",q:"Wie prüfst du einen Zündkreis auf Unterbrechung richtig?",a:["Durchgangsprüfung der Leitungen mit Adapter bei abgezogenem Steuergerät – nie an der Zündpille","Widerstand an der Zündpille messen","Mit einer Prüflampe an der Zündpille","Mit 12 V an den Stecker gehen"],e:"Danach Kabel noch einmal prüfen: Liegt der Fehler wirklich im Kabel und nicht im Stecker?"},
{t:"air",q:"Was tust du nach der Reparatur eines Airbag-Fehlers?",a:["Fehlerspeicher löschen und neu lesen, Selbsttest der Kontrollleuchte prüfen, Probefahrt, Dokumentation","Nur die Leuchte abkleben","Den Airbag öffnen und prüfen","Gar nichts"],e:"Die Leuchte muss nach dem Start kurz an- und dann ausgehen."},
{t:"air",q:"Was erkennt der Out-of-Position-Sensor?",a:["Die Sitzposition des Insassen","Das Gewicht des Insassen","Die Außentemperatur","Die Geschwindigkeit"],e:"Bei falscher Sitzposition kann der Airbag angepasst oder abgeschaltet werden."},
// ================= Elektrik & Diagnose (Fotos 0033–0039, 0239–0240) =================
{t:"ele",q:"Wie groß ist der Strom bei 230 V und einem Körperwiderstand Hand–Füße von 750 Ω?",a:["Ca. 307 mA – lebensgefährlich","Ca. 3 mA","Ca. 30 A","Ca. 0,3 mA"],e:"I = U / R = 230 / 750 ≈ 0,307 A."},
{t:"ele",q:"Wie lange sollte man nach einem Stromunfall mindestens im Krankenhaus bleiben?",a:["24 Stunden","10 Minuten","1 Woche","Gar nicht, wenn man sich gut fühlt"],e:"Herzrhythmusstörungen können noch Stunden später auftreten."},
{t:"ele",q:"Warum ist Strom bei nasser Haut gefährlicher?",a:["Der Hautübergangswiderstand sinkt stark, es fließt mehr Strom","Wasser isoliert","Die Spannung sinkt","Es macht keinen Unterschied"],e:"I = U / R: kleinerer Widerstand = größerer Strom."},
{t:"ele",q:"Warum schützt eine 16-A-Sicherung keine Personen?",a:["Sie löst erst über 16 A aus, Personen sind schon ab ca. 30 mA gefährdet","Sie löst bei 1 mA aus","Sie ist nur für Licht","Sie schützt immer"],e:"Personenschutz bietet der RCD (FI) mit 30 mA Auslösestrom."},
{t:"ele",q:"Das 230-V-Kabel deines Batterieladegeräts ist beschädigt. Was tust du?",a:["Das Ladegerät nicht benutzen und instand setzen lassen","Mit Isolierband umwickeln und weiter benutzen","Nur mit Handschuhen benutzen","Egal, es sind nur 230 V"],e:"Berührungsgefahr – Stromschlag."},

{t:"ele",q:"Wie setzt du eine unterbrochene Leitung fachgerecht instand?",a:["Reparaturleitung mit Crimpverbinder und Schrumpfschlauch nach Herstellervorgabe oder Leitung ersetzen","Verdrillen und mit Klebeband umwickeln","Löten ohne Isolation","Gar nicht"],e:"Danach Fehlerspeicher löschen, Probefahrt, erneut auslesen, Funktionsprüfung, dokumentieren."}
);

</script>
<script>
(function(){
const K = window.KFZ;
const TOP = Object.fromEntries(K.topics.map(t=>[t.id,t]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
K.q.forEach(q=>{q.id=hash(q.t+'|'+q.q)});
const BYID = Object.fromEntries(K.q.map(q=>[q.id,q]));

// ---------- Speicher: claude db (geräteübergreifend) + localStorage als Reserve ----------
const LS='kfz-gp2-v1';
let S = {p:{}, upd:0, sessions:0, exams:[]};
let dbRef=null, saveT=null, syncState='auf diesem Gerät gespeichert (Browser-Daten nicht löschen)';
function lsRead(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');return v&&v.p?v:null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const loc=lsRead(); if(loc) S=loc;
function save(){
  S.upd=Date.now(); lsWrite();
  if(!dbRef) return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{dbRef.set({state:JSON.stringify(S),upd:S.upd}).then(()=>{syncState='synchron';paintSync()}).catch(()=>{syncState='nur auf diesem Gerät';paintSync()})},800);
}
(async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.collection('data/users/'+id).doc('progress');
    const snap=await dbRef.get(); const d=snap&&snap.data&&snap.data();
    if(d&&d.state){const remote=JSON.parse(d.state); if(remote&&remote.upd>(S.upd||0)){S=remote;lsWrite();render()}}
    syncState='synchron'; paintSync();
    if(!d||!d.state||S.upd>(d.upd||0)) save();
  }catch(e){syncState='nur auf diesem Gerät';paintSync()}
})();
function paintSync(){const el=document.getElementById('sync'); if(el) el.textContent='Fortschritt: '+syncState}

// ---------- Lernlogik (Lernkartei mit 5 Fächern) ----------
function st(id){return S.p[id]||{b:0,n:0,w:0,l:0}}
function grade(id,r){ // r: 1 richtig, .5 teilweise, 0 falsch
  const x=Object.assign({},st(id)); x.n++; x.l=Date.now();
  if(r===1){x.b=Math.min(5,x.b+1); x.c=(x.c===undefined?Math.max(0,x.n-1-x.w):x.c)+1} else if(r===0){x.b=0;x.w++}
  S.p[id]=x; save();
}
function level(id){const x=S.p[id]; if(!x||!x.n) return 'new'; if(x.b>=3) return 'g'; if(x.b>=1) return 'y'; return 'r'}
const INTERVAL=[0,1,3,8,24,72].map(h=>h*3600e3);
function priority(q){
  const x=S.p[q.id], tp=TOP[q.t].prio||1;
  if(!x||!x.n) return 50 + tp*6 + Math.random()*20;          // neu
  const due = Date.now()-x.l - INTERVAL[x.b];
  let s = (5-x.b)*14 + tp*6 + Math.min(x.w,3)*6 + Math.random()*12;
  if(due<0) s -= 60;                                          // noch nicht fällig
  return s;
}
function pick(pool,n){return pool.map(q=>[priority(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]).sort(()=>Math.random()-.5)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function topicStats(tid){
  const qs=K.q.filter(q=>!tid||q.t===tid); const c={g:0,y:0,r:0,new:0};
  qs.forEach(q=>c[level(q.id)]++); return {n:qs.length,...c,pct:Math.round(c.g/qs.length*100)};
}
// ---------- Leaderboard (nur GitHub-Pages-Version, window.kfzBoard kommt aus Firebase-Modul) ----------
function myStats(){
  let answered=0,correct=0,sure=0;
  K.q.forEach(q=>{const x=S.p[q.id]; if(!x||!x.n) return; answered+=x.n; correct+=(x.c!==undefined?x.c:Math.max(0,x.n-x.w)); if(x.b>=3) sure++});
  return {name:S.nick||'',answered,correct:Math.min(correct,answered),sure};
}
async function resetStats(){
  if(!confirm('Wirklich die komplette Statistik löschen?\n\nAlle beantworteten Fragen, Fehler, Prüfungsergebnisse, dein Spitzname und dein Leaderboard-Eintrag werden gelöscht. Das kann nicht rückgängig gemacht werden.')) return;
  if(window.kfzBoard&&window.kfzBoard.remove){ try{await window.kfzBoard.remove()}catch(e){console.warn('board remove',e)} }
  S={p:{},upd:Date.now(),sessions:0,exams:[],orig:[]}; save(); go({name:'home'});
}
function pushBoard(){ if(window.kfzBoard&&S.nick) window.kfzBoard.push(myStats()).catch(e=>console.warn('board',e)) }
window.addEventListener('kfzboard',()=>{ if(view.name==='home') renderHome(); pushBoard() });
function daysLeft(){const d=new Date(K.exam+'T08:00:00');return Math.max(0,Math.ceil((d-Date.now())/864e5))}

// ---------- Ansichten ----------
const app=document.getElementById('app'), dock=document.getElementById('dock'), dockIn=document.getElementById('dockIn');
let view={name:'home'}, run=null;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setDock(html){if(!html){dock.hidden=true;dockIn.innerHTML='';return}dock.hidden=false;dockIn.innerHTML=html}
function go(v){view=v;render();window.scrollTo(0,0)}
function bar(s){const t=s.n;return `<span class="bar"><i class="g" style="width:${s.g/t*100}%"></i><i class="y" style="width:${s.y/t*100}%"></i><i class="r" style="width:${s.r/t*100}%"></i></span>`}

function renderHome(){
  const all=topicStats(), d=daysLeft(), wrong=K.q.filter(q=>level(q.id)==='r').length;
  const perDay=d?Math.ceil((all.n-all.g)/Math.max(1,Math.ceil(d*0.6))):0;
  const topics=K.topics.slice().sort((a,b)=>(b.prio||1)-(a.prio||1));
  app.innerHTML=`
  <div class="head">
    <div><div class="eyebrow">Gesellenprüfung Teil 2 · Kfz-Mechatroniker</div><h1>Prüfungs&shy;trainer</h1></div>
    <div class="count"><b class="mono">${d}</b><span>Tage bis 5.12.</span></div>
  </div>
  <div class="stripe" aria-hidden="true"></div>
  <div class="stats">
    <div class="stat"><b>${all.pct}%</b><span>sicher gelernt</span></div>
    <div class="stat"><b>${all.g+all.y+all.r}</b><span>von ${all.n} geübt</span></div>
    <div class="stat"><b>${wrong}</b><span>offene Fehler</span></div>
  </div>
  <p class="muted">${d>0?`Schaffst du etwa <b class="mono">${perDay}</b> Fragen pro Lerntag (bei jedem zweiten Tag), sitzt bis zur Prüfung alles.`:'Viel Erfolg in der Prüfung!'}</p>
  <div class="actions">
    <button class="btn btn-main" id="b-quick">10-Minuten-Runde starten</button>
    <button class="btn btn-sec" id="b-rand">Zufallsfragen (20 aus allen Themen)</button>
    <div class="row2">
      <button class="btn btn-sec" id="b-wrong" ${wrong?'':'disabled'}>Fehler wiederholen (${wrong})</button>
      <button class="btn btn-sec" id="b-exam">Prüfung simulieren</button>
    </div>
    ${window.kfzBoard?'<button class="btn btn-sec" id="b-board">🏆 Leaderboard</button>':''}
    <button class="btn btn-orig" id="b-orig">Echte WiSo-Prüfung Hessen Sommer 2024<small>47 Originalfragen · 60 Minuten · 100 Punkte</small></button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap"><h2>Themen</h2>
    <div class="legend"><span><i style="background:var(--ok)"></i>sicher</span><span><i style="background:var(--warn)"></i>wackelt</span><span><i style="background:var(--bad)"></i>falsch</span></div></div>
  <div class="topics">${topics.map(t=>{const s=topicStats(t.id);return `<button class="topic" data-t="${t.id}"><span class="nm">${esc(t.name)}<br><span class="muted" style="font-weight:400;font-size:.85rem">${s.n} Fragen${t.videos?' · '+t.videos.length+' Video'+(t.videos.length>1?'s':''):''}</span></span><span class="pc">${s.pct}%</span>${bar(s)}</button>`}).join('')}</div>
  <p class="sync" id="sync">Fortschritt: ${syncState}</p>
  <button class="btn-ghost" id="b-reset" style="align-self:center;color:var(--bad)">Statistik löschen</button>
  <p class="muted" style="font-size:.82rem">Alle Fragen sind aus deinen Unterrichtsblättern erstellt. Prüfungsfragen sind nicht wörtlich übernommen, sondern neu formuliert.</p>`;
  setDock('');
  app.querySelector('#b-quick').onclick=()=>startRun('quick');
  app.querySelector('#b-rand').onclick=()=>startRun('rand');
  const bb=app.querySelector('#b-board'); if(bb) bb.onclick=()=>go({name:'board'});
  app.querySelector('#b-reset').onclick=resetStats;
  app.querySelector('#b-exam').onclick=()=>go({name:'examInfo'});
  app.querySelector('#b-orig').onclick=()=>go({name:'origInfo'});
  const bw=app.querySelector('#b-wrong'); if(wrong) bw.onclick=()=>startRun('wrong');
  app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>go({name:'topic',t:b.dataset.t}));
}

function renderTopic(){
  const t=TOP[view.t], s=topicStats(t.id);
  app.innerHTML=`
  <button class="btn-ghost" id="back">← Übersicht</button>
  <div><div class="eyebrow">${t.hint?esc(t.hint):'Thema'}</div><h1>${esc(t.name)}</h1></div>
  <div class="stats">
    <div class="stat"><b>${s.pct}%</b><span>sicher</span></div>
    <div class="stat"><b>${s.y+s.r}</b><span>wackelt / falsch</span></div>
    <div class="stat"><b>${s.new}</b><span>noch neu</span></div>
  </div>
  ${t.videos?`<div class="card"><h3>Videos aus deinen Blättern</h3><div class="vids">${t.videos.map(v=>`<a class="vid" href="${v[1]}" target="_blank" rel="noopener">${esc(v[0])}</a>`).join('')}</div></div>`:''}
  <div class="card"><h3>Kurz erklärt</h3><ul class="sheet">${t.sheet.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul></div>`;
  setDock(`<button class="btn btn-main" id="go">${s.n-s.g} Fragen üben</button>`);
  app.querySelector('#back').onclick=()=>go({name:'home'});
  dockIn.querySelector('#go').onclick=()=>startRun('topic',t.id);
}

function renderExamInfo(){
  app.innerHTML=`<button class="btn-ghost" id="back">← Übersicht</button>
  <div><div class="eyebrow">Probeprüfung</div><h1>Prüfung simulieren</h1></div>
  <div class="card"><ul class="sheet">
   <li><span>30 Ankreuzfragen aus allen Themen, dazu 3 Fragen zum Selberschreiben.</span></li>
   <li><span>60 Minuten Zeit. Du siehst erst am Ende, was richtig war.</span></li>
   <li><span>Ankreuzfragen zählen je 3 Punkte, Schreibfragen je bis zu 3,3 Punkte. Insgesamt 100 Punkte.</span></li>
   <li><span>Noten nach Kammer-Schlüssel: ab 92 sehr gut, ab 81 gut, ab 67 befriedigend, ab 50 ausreichend.</span></li>
  </ul></div>
  ${S.exams&&S.exams.length?`<div class="card"><h3>Deine letzten Probeprüfungen</h3>${S.exams.slice(-5).reverse().map(e=>`<div style="display:flex;justify-content:space-between"><span>${new Date(e.d).toLocaleDateString('de-DE')}</span><b class="mono">${e.p} Punkte</b></div>`).join('')}</div>`:''}`;
  setDock(`<button class="btn btn-main" id="go">Prüfung starten</button>`);
  app.querySelector('#back').onclick=()=>go({name:'home'});
  dockIn.querySelector('#go').onclick=()=>startRun('exam');
}

function renderOrigInfo(){
  const last=(S.orig||[]).slice(-5).reverse();
  app.innerHTML=`<button class="btn-ghost" id="back">← Übersicht</button>
  <div><div class="eyebrow">Original · GP2 Hessen · 21.06.2024</div><h1>WiSo-Prüfung Sommer 2024</h1></div>
  <div class="card"><ul class="sheet">
   <li><span>Alle 47 Fragen der echten Prüfung in der Originalreihenfolge, mit den Originalpunkten (1, 2 oder 4).</span></li>
   <li><span>Vier Formate wie am Prüfungscomputer: <span class="fmt">Ankreuzen</span> <span class="fmt">Richtig/Falsch</span> <span class="fmt">Lückentext</span> <span class="fmt">Zuordnen</span></span></li>
   <li><span>60 Minuten. Die Auswertung kommt erst am Ende.</span></li>
   <li><span>Bei Richtig/Falsch, Lückentext und Zuordnen bekommst du Teilpunkte für jeden richtigen Teil.</span></li>
  </ul></div>
  ${last.length?`<div class="card"><h3>Deine Versuche</h3>${last.map(e=>`<div style="display:flex;justify-content:space-between"><span>${new Date(e.d).toLocaleDateString('de-DE')}</span><b class="mono">${e.p} / 100 · ${note(e.p)}</b></div>`).join('')}</div>`:''}
  <p class="muted">Einzelne Fragen dieser Prüfung kannst du auch ohne Zeitdruck im Thema „WiSo-Prüfung Sommer 2024“ üben.</p>`;
  setDock(`<button class="btn btn-main" id="go">Prüfung starten</button>`);
  app.querySelector('#back').onclick=()=>go({name:'home'});
  dockIn.querySelector('#go').onclick=()=>startRun('orig');
}

// ---------- Runden ----------
function newItem(q){
  const it={id:q.id,ans:null,txt:'',rate:null,sel:{},checked:false};
  if(!q.type) it.order=shuffle([0,1,2,3]);
  if(q.type==='gap') it.opts=q.gaps.map(g=>shuffle(g));
  if(q.type==='grp'){ it.list=shuffle(q.cats.flatMap((c,ci)=>c[1].map(x=>[x,ci]))) }
  return it;
}
function partsOf(q,it){ // [richtige Teile, alle Teile]
  if(q.type==='rf') return [q.items.filter((x,i)=>it.sel[i]===x[1]).length, q.items.length];
  if(q.type==='gap') return [q.gaps.filter((g,i)=>it.sel[i]===g[0]).length, q.gaps.length];
  if(q.type==='grp') return [it.list.filter((x,i)=>it.sel[i]===x[1]).length, it.list.length];
  return [0,1];
}
function filled(q,it){
  if(!q.type) return it.ans!==null;
  if(q.type==='f') return it.rate!==null;
  const n = q.type==='rf'?q.items.length : q.type==='gap'?q.gaps.length : it.list.length;
  for(let i=0;i<n;i++) if(it.sel[i]===undefined||it.sel[i]==='') return false;
  return true;
}
function scoreOf(q,it){
  if(!q.type) return it.ans===0?1:0;
  if(q.type==='f') return it.rate||0;
  if(!filled(q,it)&&!Object.keys(it.sel).length) return 0;
  const [r,n]=partsOf(q,it); return r/n;
}
function gradeFrac(f){return f>=1?1:f>=.5?.5:0}
function solutionText(q){
  if(!q.type) return 'Richtig: '+q.a[0];
  if(q.type==='f') return 'Musterlösung: '+q.k.join(' · ');
  if(q.type==='rf') return q.items.map(x=>(x[1]?'R':'F')+': '+x[0]).join(' · ');
  if(q.type==='gap') return 'Lösung: '+q.gaps.map((g,i)=>(i+1)+') '+g[0]).join(' · ');
  if(q.type==='grp') return q.cats.map(c=>c[0]+': '+c[1].join(' / ')).join(' · ');
}
function startRun(mode,tid){
  let qs;
  const nonF=K.q.filter(q=>q.type!=='f'&&q.t!=='w24'), ft=K.q.filter(q=>q.type==='f');
  if(mode==='quick'){qs=pick(nonF.concat(K.q.filter(q=>q.t==='w24')),10).concat(pick(ft,2))}
  else if(mode==='rand'){qs=shuffle(K.q).slice(0,20)}
  else if(mode==='wrong'){qs=shuffle(K.q.filter(q=>level(q.id)==='r')).slice(0,15)}
  else if(mode==='topic'){const p=K.q.filter(q=>q.t===tid);qs=pick(p,Math.min(15,p.length))}
  else if(mode==='orig'){qs=K.q.filter(q=>q.t==='w24').sort((a,b)=>a.n-b.n)}
  else if(mode==='exam'){
    const byT={};nonF.forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
    let sel=[]; Object.keys(byT).forEach(t=>sel.push(...shuffle(byT[t]).slice(0,2)));
    sel=shuffle(sel).slice(0,30); qs=sel.concat(shuffle(ft).slice(0,3));
  }
  if(!qs.length) return;
  run={mode,tid,qs:qs.map(newItem),i:0,start:Date.now(),done:false};
  run.exam = mode==='exam'||mode==='orig';
  if(run.exam) run.end=Date.now()+60*60e3;
  S.sessions=(S.sessions||0)+1;
  go({name:'quiz'});
}
const FMT={rf:'Richtig / Falsch',gap:'Lückentext',grp:'Zuordnen',f:'selbst schreiben'};
let timerI=null;
function renderQuiz(){
  clearInterval(timerI);
  const it=run.qs[run.i], q=BYID[it.id], t=TOP[q.t], exam=run.exam;
  const n=run.qs.length, L='ABCD';
  const locked = !exam && it.checked;           // Lösung wird angezeigt
  let body='';
  if(!q.type){
    body=`<div class="opts">${it.order.map((oi,k)=>{
      let cls=''; if(it.ans!==null){ if(exam){ if(it.ans===oi) cls='sel' } else { if(oi===0) cls='ok'; else if(it.ans===oi) cls='no' } }
      return `<button class="opt ${cls}" data-o="${oi}" ${(it.ans!==null&&!exam)?'disabled':''}><span class="k">${L[k]}</span><span class="t">${esc(q.a[oi])}</span></button>`}).join('')}</div>`;
    if(it.ans!==null && !exam){
      const ok=it.ans===0;
      body+=`<div class="verdict ${ok?'ok':'no'}">${ok?'Richtig':'Leider falsch'}</div>${q.e?`<div class="expl">${esc(q.e)}</div>`:''}`;
    }
  } else if(q.type==='f'){
    body=`<textarea id="ta" placeholder="Schreib deine Antwort in Stichpunkten …" ${it.shown?'readonly':''}>${esc(it.txt)}</textarea>`;
    if(it.shown){
      body+=`<div><div class="eyebrow" style="margin-bottom:8px">Musterlösung – das sollte drinstehen</div><ul class="keys">${q.k.map(k=>`<li><span>${esc(k)}</span></li>`).join('')}</ul></div>`;
      if(it.rate===null || !exam) body+=`<div class="eyebrow">Wie gut war deine Antwort?</div><div class="rate">
        <button class="btn r-ok" data-r="1">Gewusst<small>alles drin</small></button>
        <button class="btn r-mid" data-r="0.5">Teilweise<small>Lücken</small></button>
        <button class="btn r-no" data-r="0">Nicht<small>gewusst</small></button></div>`;
    }
  } else if(q.type==='rf'){
    body=`<div class="rf">${q.items.map((x,i)=>{
      const v=it.sel[i]; let cls=''; if(locked) cls = v===x[1]?'ok':'no';
      return `<div class="rfrow ${cls}"><div class="t">${esc(x[0])}${locked&&v!==x[1]?`<div class="fix">Richtig wäre: ${x[1]?'Richtig':'Falsch'}</div>`:''}</div>
        <div class="seg"><button data-i="${i}" data-v="1" class="${v===true?'on':''}" ${locked?'disabled':''} aria-label="richtig">R</button><button data-i="${i}" data-v="0" class="${v===false?'on':''}" ${locked?'disabled':''} aria-label="falsch">F</button></div></div>`}).join('')}</div>`;
  } else if(q.type==='gap'){
    let k=0;
    const txt=esc(q.q).replace(/\{(\d)\}/g,()=>{const i=k++, v=it.sel[i]||'', cls=locked?(v===q.gaps[i][0]?'ok':'no'):'';
      return `<select data-i="${i}" class="${cls}" ${locked?'disabled':''} aria-label="Lücke ${i+1}"><option value="">(${i+1}) wählen …</option>${it.opts[i].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`});
    body=`<div class="gaptext">${txt}</div>`;
    if(locked && partsOf(q,it)[0]<q.gaps.length) body+=`<div class="gapfix">${q.gaps.map((g,i)=>`<div>${i+1}) <b>${esc(g[0])}</b>${it.sel[i]!==g[0]?' – du hattest: '+esc(it.sel[i]||'nichts'):' ✓'}</div>`).join('')}</div>`;
  } else if(q.type==='grp'){
    body=`<div class="rf">${it.list.map((x,i)=>{
      const v=it.sel[i]; let cls=''; if(locked) cls=v===x[1]?'ok':'no';
      return `<div class="grow ${cls}"><div>${esc(x[0])}${locked&&v!==x[1]?`<div class="fix">Richtig: ${esc(q.cats[x[1]][0])}</div>`:''}</div>
        <div class="seg">${q.cats.map((c,ci)=>`<button data-i="${i}" data-c="${ci}" class="${v===ci?'on':''}" ${locked?'disabled':''}>${esc(c[0])}</button>`).join('')}</div></div>`}).join('')}</div>`;
  }
  if(locked && q.type && q.type!=='f'){
    const [r,nn]=partsOf(q,it), ok=r===nn;
    body+=`<div class="verdict ${ok?'ok':'no'}">${ok?'Alles richtig':r+' von '+nn+' richtig'}</div>${q.e?`<div class="expl">${esc(q.e)}</div>`:''}`;
  }
  const head = q.n ? `Frage ${q.n} · ${q.pts} Punkt${q.pts>1?'e':''}` : esc(t.name);
  app.innerHTML=`
  <div class="qtop"><button class="btn-ghost" id="quit">✕ Beenden</button>
    <span class="mono muted">${run.i+1} / ${n}</span>${exam?`<span class="timer mono" id="timer"></span>`:''}</div>
  <div class="prog"><i style="width:${run.i/n*100}%"></i></div>
  <div class="card">
    <div class="eyebrow">${head}${q.type?' · '+FMT[q.type]:''}</div>
    <div class="qtext">${q.type==='gap'?'Ergänze die Lücken.':esc(q.q)}</div>
    ${body}
  </div>`;
  app.querySelector('#quit').onclick=()=>{ if(run.qs.some(x=>filled(BYID[x.id],x)||x.checked)) finish(); else go({name:'home'}) };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(!exam && it.ans!==null) return;
    it.ans=+b.dataset.o;
    if(!exam) grade(q.id,it.ans===0?1:0);
    renderQuiz();
  });
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; it.sel[i] = b.dataset.c!==undefined ? +b.dataset.c : b.dataset.v==='1';
    const y=window.scrollY; renderQuiz(); window.scrollTo(0,y);
  });
  app.querySelectorAll('.gaptext select').forEach(s=>s.onchange=()=>{it.sel[+s.dataset.i]=s.value; paintDock()});
  const ta=app.querySelector('#ta'); if(ta) ta.oninput=()=>{it.txt=ta.value};
  app.querySelectorAll('.rate .btn').forEach(b=>b.onclick=()=>{
    it.rate=+b.dataset.r;
    if(!exam) grade(q.id,it.rate);
    next();
  });
  paintDock();
  if(exam){const tick=()=>{const left=run.end-Date.now(),el=document.getElementById('timer');if(left<=0){finish();return}if(el){const m=Math.floor(left/60e3),s=Math.floor(left%60e3/1e3);el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('low',left<5*60e3)}};tick();timerI=setInterval(tick,1000)}
}
function paintDock(){
  const it=run.qs[run.i], q=BYID[it.id], exam=run.exam, n=run.qs.length, last=run.i>=n-1;
  let h='';
  if(q.type==='f'){
    if(!it.shown) h=`<button class="btn btn-main" id="show">Lösung zeigen</button>`;
    else if(exam && it.rate!==null) h=`${run.i>0?'<button class="btn btn-sec" id="prev">Zurück</button>':''}<button class="btn btn-main" id="next">${last?'Abgeben':'Weiter'}</button>`;
  } else if(exam){
    h=`${run.i>0?'<button class="btn btn-sec" id="prev">Zurück</button>':''}<button class="btn btn-main" id="next">${last?'Abgeben':'Weiter'}</button>`;
  } else if(!q.type){
    if(it.ans!==null) h=`<button class="btn btn-main" id="next">${last?'Auswertung':'Weiter'}</button>`;
  } else {
    h = it.checked ? `<button class="btn btn-main" id="next">${last?'Auswertung':'Weiter'}</button>`
                   : `<button class="btn btn-main" id="check" ${filled(q,it)?'':'disabled'}>Prüfen</button>`;
  }
  setDock(h);
  const sh=dockIn.querySelector('#show'); if(sh) sh.onclick=()=>{it.shown=true; renderQuiz(); const k=app.querySelector('.keys'); if(k) k.scrollIntoView({behavior:'smooth',block:'start'})};
  const ck=dockIn.querySelector('#check'); if(ck) ck.onclick=()=>{it.checked=true; grade(q.id,gradeFrac(scoreOf(q,it))); renderQuiz()};
  const nx=dockIn.querySelector('#next'); if(nx) nx.onclick=next;
  const pv=dockIn.querySelector('#prev'); if(pv) pv.onclick=()=>{run.i--;renderQuiz();window.scrollTo(0,0)};
}
function next(){ if(run.i<run.qs.length-1){run.i++;renderQuiz();window.scrollTo(0,0)} else finish() }
function finish(){
  clearInterval(timerI);
  const exam=run.exam;
  let pts=0,max=0;
  const fts=run.qs.filter(it=>BYID[it.id].type==='f');
  run.qs.forEach(it=>{
    const q=BYID[it.id], s=scoreOf(q,it);
    if(exam && (filled(q,it)||Object.keys(it.sel).length)) grade(q.id, q.type==='f'?it.rate:gradeFrac(s));
    let w=1;
    if(run.mode==='orig') w=q.pts;
    else if(run.mode==='exam') w = q.type==='f' ? (10/fts.length) : 3;
    max+=w; pts+=w*s;
    it.score=s;
  });
  const pct=max?Math.round(pts/max*100):0;
  if(run.mode==='exam'){S.exams=(S.exams||[]).concat([{d:Date.now(),p:pct}]);save()}
  if(run.mode==='orig'){S.orig=(S.orig||[]).concat([{d:Date.now(),p:pct}]);save()}
  run.result={pct,pts:Math.round(pts*10)/10,max:Math.round(max)};
  pushBoard();
  go({name:'result'});
}
function note(p){return p>=92?'sehr gut':p>=81?'gut':p>=67?'befriedigend':p>=50?'ausreichend':p>=30?'mangelhaft':'ungenügend'}
function renderResult(){
  const r=run.result, exam=run.exam;
  const wrong=run.qs.filter(it=>it.score<1);
  app.innerHTML=`
  <div><div class="eyebrow">${run.mode==='orig'?'WiSo Sommer 2024':exam?'Probeprüfung':run.mode==='rand'?'Zufallsrunde fertig':'Runde fertig'}</div><h1>Auswertung</h1></div>
  <div class="card" style="align-items:flex-start">
    <div class="big">${r.pct}%</div>
    ${exam?`<div class="grade">${r.pts} von ${r.max} Punkten · ${note(r.pct)}</div>`:`<p>${r.pts} von ${r.max} richtig</p>`}
    <p class="muted">${r.pct>=81?'Stark. Das sitzt.':r.pct>=50?'Bestanden-Niveau. Die Fehler unten nochmal anschauen.':'Noch nicht sicher. Wiederhol die Fehler und lies die Kurz-erklärt-Seiten.'}</p>
  </div>
  ${wrong.length?`<h2>Nicht ganz richtig</h2><div class="list">${wrong.map(it=>{const q=BYID[it.id];return `<div class="mini"><b>${q.n?'Frage '+q.n+': ':''}${esc(q.type==='gap'?q.q.replace(/\{\d\}/g,'___'):q.q)}</b>${esc(solutionText(q))}${q.e?`<div class="muted" style="margin-top:4px">${esc(q.e)}</div>`:''}</div>`}).join('')}</div>`:''}`;
  setDock(`<button class="btn btn-sec" id="home">Übersicht</button><button class="btn btn-main" id="again">Nächste Runde</button>`);
  dockIn.querySelector('#home').onclick=()=>go({name:'home'});
  dockIn.querySelector('#again').onclick=()=>startRun(exam?'quick':run.mode,run.tid);
}
function renderBoard(){
  const me=myStats();
  app.innerHTML=`<button class="btn-ghost" id="back">← Übersicht</button>
  <div><div class="eyebrow">Alle Lernenden</div><h1>Leaderboard</h1></div>
  <div class="card">
    <h3>${S.nick?'Dein Name: '+esc(S.nick):'Wähle einen Spitznamen'}</h3>
    <div style="display:flex;gap:8px"><input id="nick" maxlength="20" placeholder="Spitzname" value="${esc(S.nick||'')}" style="flex:1;min-width:0;font:inherit;padding:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);color:var(--fg)">
    <button class="btn btn-sec" id="saveNick">Speichern</button></div>
    <p class="muted" style="font-size:.85rem">Sichtbar für alle mit dem Link. Kein echter Name nötig.</p>
  </div>
  <div class="stats"><div class="stat"><b>${me.answered}</b><span>beantwortet</span></div><div class="stat"><b>${me.correct}</b><span>richtig</span></div><div class="stat"><b>${me.sure}</b><span>sicher gelernt</span></div></div>
  <div class="card" id="boardList"><p class="muted">Lade Rangliste …</p></div>`;
  setDock('');
  app.querySelector('#back').onclick=()=>go({name:'home'});
  app.querySelector('#saveNick').onclick=()=>{const v=app.querySelector('#nick').value.trim().slice(0,20); if(!v) return; S.nick=v; save(); pushBoard(); setTimeout(renderBoard,600)};
  const el=app.querySelector('#boardList');
  if(!window.kfzBoard){el.innerHTML='<p class="muted">Leaderboard gerade nicht erreichbar.</p>';return}
  const t=setTimeout(()=>{el.innerHTML='<p class="muted">Keine Verbindung. Später nochmal öffnen.</p>'},10000);
  Promise.all([window.kfzBoard.list(),window.kfzBoard.me()]).then(([rows,uid])=>{
    clearTimeout(t);
    if(!rows.length){el.innerHTML='<p class="muted">Noch niemand drin. Spitzname speichern und eine Runde spielen!</p>';return}
    el.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:.95rem"><thead><tr style="text-align:left;color:var(--muted);font-size:.8rem"><th>#</th><th>Name</th><th style="text-align:right">richtig</th><th style="text-align:right">beantw.</th><th style="text-align:right">Quote</th></tr></thead><tbody>${rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.id===uid?'font-weight:700;color:var(--accent)':''}"><td style="padding:8px 4px" class="mono">${i+1}</td><td style="padding:8px 4px;word-break:break-word">${esc(r.name||'?')}${r.id===uid?' (du)':''}</td><td class="mono" style="text-align:right">${r.correct|0}</td><td class="mono" style="text-align:right">${r.answered|0}</td><td class="mono" style="text-align:right">${r.answered?Math.round(r.correct/r.answered*100):0}%</td></tr>`).join('')}</tbody></table>`;
  }).catch(e=>{clearTimeout(t);el.innerHTML='<p class="muted">Rangliste konnte nicht geladen werden.</p>';console.warn(e)});
}
function render(){
  if(view.name==='home') renderHome();
  else if(view.name==='board') renderBoard();
  else if(view.name==='topic') renderTopic();
  else if(view.name==='examInfo') renderExamInfo();
  else if(view.name==='origInfo') renderOrigInfo();
  else if(view.name==='quiz') renderQuiz();
  else if(view.name==='result') renderResult();
}
render();
})();
</script>

<script type="module">
// Firebase-Leaderboard (wird von build.py in pages/index.html eingesetzt)
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, signInAnonymously, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, doc, setDoc, deleteDoc, collection, query, orderBy, limit, getDocs, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({apiKey:"AIzaSyDh38mbxrn0qaLcEpDtMXiIq9n5qkuUaZI",authDomain:"vincent-pruefung.firebaseapp.com",projectId:"vincent-pruefung",storageBucket:"vincent-pruefung.firebasestorage.app",messagingSenderId:"140842688264",appId:"1:140842688264:web:a3204c46fd971d0a3916bd"});
const auth = getAuth(app);
const db = getFirestore(app);
const uidP = new Promise(res => onAuthStateChanged(auth, u => { if (u) res(u.uid); }));
signInAnonymously(auth).catch(e => console.warn("auth", e));

let last = "";
window.kfzBoard = {
  async push(s) {
    const k = JSON.stringify(s);
    if (k === last) return;
    const uid = await uidP;
    await setDoc(doc(db, "board", uid), {name: s.name, answered: s.answered, correct: s.correct, sure: s.sure, upd: serverTimestamp()});
    last = k;
  },
  async list() {
    const r = await getDocs(query(collection(db, "board"), orderBy("correct", "desc"), limit(100)));
    return r.docs.map(d => ({id: d.id, ...d.data()}));
  },
  async remove() {
    const uid = await uidP;
    await deleteDoc(doc(db, "board", uid));
    last = "";
  },
  me() { return uidP; }
};
window.dispatchEvent(new Event("kfzboard"));

</script>
