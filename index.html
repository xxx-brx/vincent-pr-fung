<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine Spalte wie ein Werkstatt-Prüfprotokoll, max. 640px, Bedienung mit dem Daumen unten */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#e3e6ea; --line:#cfd4da;
  --fg:#14181d; --muted:#5b6570;
  --accent:#d9530b; --accent-ink:#ffffff; --accent-soft:#fbe3d4;
  --ok:#1f7a45; --ok-soft:#dbf0e2; --bad:#b42318; --bad-soft:#fbe0dd; --warn:#a15c00;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181d23; --sunk:#0c0f12; --line:#2a3139;
  --fg:#e7ebef; --muted:#93a0ad;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --ok:#4cc27d; --ok-soft:#13301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0a43a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181d23; --sunk:#0c0f12; --line:#2a3139;
  --fg:#e7ebef; --muted:#93a0ad;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --ok:#4cc27d; --ok-soft:#13301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0a43a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;font-weight:800;text-transform:uppercase}
h2{font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:var(--r);padding:14px 18px;font-weight:600;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn-main{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.btn-sec{background:var(--surface);border:1.5px solid var(--line)}
.btn-ghost{background:transparent;border:0;color:var(--muted);padding:8px 4px;min-height:40px;align-self:flex-start}
.btn:disabled{opacity:.45;cursor:default}

/* Kopf mit Countdown */
.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:3px solid var(--fg);padding-bottom:12px}
.count{text-align:right}
.count b{display:block;font:700 2.6rem/1 var(--f-mono);color:var(--accent)}
.count span{font-size:.8rem;color:var(--muted)}
.stripe{height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--fg) 10px 20px);opacity:.9}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:700 1.5rem/1.1 var(--f-mono)}
.stat span{font-size:.78rem;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.topics{display:flex;flex-direction:column;gap:2px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:0;text-align:left;padding:12px 14px;width:100%}
.topic .nm{font-weight:600;min-width:0}
.topic .pc{font:700 .95rem var(--f-mono)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .y{background:var(--warn)} .bar .r{background:var(--bad)}
.tag{display:inline-block;font:600 .68rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:4px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:1.15rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;min-height:52px}
.opt .k{font:700 .95rem/34px var(--f-mono);text-align:center;width:34px;height:34px;border-radius:6px;background:var(--sunk)}
.opt .t{min-width:0;padding-top:5px}
.opt.sel{border-color:var(--accent)} .opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--fg)}
.expl{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.97rem}
.verdict{font:700 1.2rem var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit;padding:12px;resize:vertical}
.keys{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.keys li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.keys li::before{content:"";width:14px;height:14px;margin-top:5px;border:2px solid var(--accent);border-radius:3px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:10px 6px;font-size:.95rem;min-height:56px;flex-direction:column;gap:0}
.r-ok{background:var(--ok-soft);color:var(--ok);border:1.5px solid var(--ok)}
.r-mid{background:var(--accent-soft);color:var(--warn);border:1.5px solid var(--warn)}
.r-no{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.dock>div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.sheet{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sheet li{display:grid;grid-template-columns:8px 1fr;gap:10px;line-height:1.45}
.sheet li::before{content:"";width:8px;height:8px;margin-top:8px;background:var(--accent);border-radius:1px}
.vids{display:flex;flex-wrap:wrap;gap:8px}
.vid{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--fg);text-decoration:none;font-weight:600;font-size:.92rem}
.vid::before{content:"";width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent}
.big{font:800 4rem/1 var(--f-mono);color:var(--accent)}
.grade{font:700 1.6rem var(--f-display);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;font-size:.95rem}
.mini b{display:block;margin-bottom:4px}
.sync{font-size:.78rem;color:var(--muted);text-align:center}
.timer{font:700 1rem var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
/* Prüfungsformate: Richtig/Falsch, Lückentext, Zuordnen */
.rf{display:flex;flex-direction:column;gap:8px}
.rfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 12px}
.rfrow .t{min-width:0}
.seg{display:flex;gap:6px}
.seg button{min-width:48px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;padding:6px 8px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rfrow.ok,.grow.ok{border-color:var(--ok);background:var(--ok-soft)}
.rfrow.no,.grow.no{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.85rem;font-weight:600;margin-top:4px}
.rfrow.no .fix,.grow.no .fix{color:var(--bad)}
.gaptext{font-size:1.08rem;line-height:2.3}
.gaptext select{font:inherit;font-size:.95rem;max-width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--fg);margin:0 2px}
.gaptext select.ok{border-color:var(--ok);background:var(--ok-soft)}
.gaptext select.no{border-color:var(--bad);background:var(--bad-soft)}
.gapfix{font-size:.9rem}
.grow{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.grow .seg{flex-wrap:wrap}
.fmt{display:inline-block;font:600 .7rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:4px 6px;color:var(--muted)}
.btn-orig{background:var(--fg);color:var(--bg);flex-direction:column;gap:2px}
.btn-orig small{font-weight:400;opacity:.8;font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){h1{font-size:1.7rem}.count b{font-size:2.1rem}}
</style>

<script>
/* Fragenkatalog GP2 Kfz-Mechatroniker – erstellt aus den Unterrichtsfotos.
   MC: a[0] ist immer die richtige Antwort (wird in der App gemischt).
   Freitext: type "f", k = Stichpunkte der Musterlösung. */
window.KFZ = {
exam: "2026-12-05",
topics: [
 {id:"hv", name:"Hochvolt-Sicherheit", hint:"Hochvolt", prio:3,
  sheet:[
   "Hochvolt im Kfz: über 30 V AC bzw. über 60 V DC (bis 1000 V AC / 1500 V DC).",
   "HV-Leitungen sind immer orange. Warnaufkleber: gelbes Dreieck mit Blitz.",
   "Qualifizierung nach DGUV 209-093: S (sensibilisiert), 1S (fachkundig unterwiesen, nicht-elektrische Arbeiten), 2S (FHV: Freischalten, Arbeiten spannungsfrei), 3S (Arbeiten unter Spannung).",
   "5 Sicherheitsregeln: 1 Freischalten, 2 gegen Wiedereinschalten sichern, 3 Spannungsfreiheit feststellen, 4 Erden und Kurzschließen, 5 benachbarte aktive Teile abdecken.",
   "Spannungsfreiheit allpolig messen (HV+ gegen HV−, HV+ gegen Masse, HV− gegen Masse) mit zweipoligem Spannungsprüfer CAT III. Prüfer vorher und nachher an bekannter Quelle testen.",
   "Gegen Wiedereinschalten: Service-Stecker ziehen und wegschließen, Schlüssel weit weg sicher verwahren, 12-V-Batterie abklemmen, Ladekabel trennen, Schild.",
   "Rotes Schild = nicht spannungsfrei, weißes = spannungsfrei. Immer nur ein Schild.",
   "Ab ca. 50 mA Herzkammerflimmern möglich. Körperwiderstand Hand–Hand ca. 1000 Ω."
  ]},
 {id:"hvt", name:"Hochvolt-Technik & Laden", hint:"Isolation + Potenzialausgleich", prio:3,
  sheet:[
   "IT-Netz: HV+ und HV− haben keine Verbindung zur Karosserie. Ein einzelner Isolationsfehler ist noch ungefährlich.",
   "Potenzialausgleich: verbindet die Gehäuse aller HV-Komponenten niederohmig mit der Karosserie. Grenzwert nach ECE R100: max. 0,1 Ω bei mind. 0,2 A Prüfstrom. Messung mit Milliohmmeter (4-Leiter).",
   "Isolationsprüfung: HV-Leiter gegen Masse mit 500 V Prüfspannung, Ergebnis in MΩ. Mindestwert nach ECE R100: 500 Ω/V für AC-Kreise, 100 Ω/V für DC-Kreise (z. B. 232 V · 500 Ω/V = 116 kΩ).",
   "Pilotlinie (Interlock/Sicherheitslinie): Ringleitung durch alle HV-Stecker. Unterbrechung → BMS öffnet Schütze sofort.",
   "Vorladung: Vorladeschütz mit Widerstand lädt den Zwischenkreiskondensator langsam, dann schließt das Hauptschütz.",
   "Inverter: DC → 3-Phasen-AC (IGBTs). OBC: 230 V AC → HV DC. DC/DC-Wandler: HV → 12 V.",
   "Laden: Mode 3 (AC, Typ-2-Stecker, bis 63 A), Mode 4 (DC, CCS). CP = Kommunikation (PWM), PP = Kabelerkennung über Codierwiderstand.",
   "PP-Codierung: 1,5 kΩ = 13 A, 680 Ω = 20 A, 220 Ω = 32 A, 100 Ω = 63 A."
  ]},
 {id:"hyb", name:"Hybrid & E-Antrieb", prio:2,
  sheet:[
   "BEV = reines E-Auto, HEV = Hybrid, PHEV = Plug-in-Hybrid, FCEV = Brennstoffzelle, REEV = Range Extender.",
   "Hybrid: mind. 2 Energiewandler und 2 Energiespeicher.",
   "Micro: Start-Stopp. Mild (48 V, RSG): Start-Stopp, Rekuperation, Boost. Voll: zusätzlich elektrisch fahren.",
   "Seriell: Verbrenner treibt nur Generator. Parallel: beide treiben mechanisch. Leistungsverzweigt: Planetengetriebe (Toyota).",
   "Synchronmaschine: Rotor dreht so schnell wie das Drehfeld, Permanentmagnete, braucht Resolver. Asynchron: Rotor langsamer (Schlupf), Käfigläufer, robust und günstig.",
   "Rekuperation: E-Maschine arbeitet als Generator und lädt beim Bremsen die Batterie.",
   "Starthilfe nur an den 12-V-Stützpunkten. Abschleppen nur nach Herstellervorgabe (meist Antriebsachse angehoben)."
  ]},
 {id:"otto", name:"Motormanagement Otto", prio:2,
  sheet:[
   "λ = 1: 14,7 kg Luft auf 1 kg Kraftstoff. λ < 1 fett, λ > 1 mager.",
   "Grundeinspritzmenge aus: Fahrerwunsch (Fahrpedalmodul), Luftmasse (Heißfilm-LMM), Drehzahl (KW-Geber).",
   "Sequentielle Einspritzung: jedes Ventil einzeln in Zündfolge, vor dem Ansaugtakt.",
   "Kaltstart: längere Einspritzzeit, weil Kraftstoff an kalten Wänden kondensiert.",
   "Schubabschaltung: Gas weg, Drehzahl über Leerlauf → keine Einspritzung.",
   "E-Gas: doppelte Potis/Hallsensoren in Fahrpedal und Drosselklappe. Fällt einer aus → Notlauf.",
   "Benzin-Direkteinspritzung: Hochdruckpumpe, Rail, Hochdruckinjektoren. Schichtladung: um die Zündkerze λ ≈ 1, außen sehr mager. Braucht NOx-Speicherkat.",
   "LMM-Signal im Leerlauf ca. 1,3–1,9 V."
  ]},
 {id:"abg", name:"Abgas Otto", prio:2,
  sheet:[
   "Schadstoffe: CO, HC (unvollständige Verbrennung), NOx (hohe Temperatur).",
   "Drei-Wege-Kat wandelt CO, HC, NOx in CO2, H2O, N2. Optimal im Lambdafenster λ = 0,995–1,005, Umwandlung bis ca. 98 %.",
   "Kat-Betrieb ca. 400–800 °C, springt ab ca. 300 °C an. Über ca. 1000 °C wird er zerstört (z. B. durch Zündaussetzer).",
   "Sprungsonde: mager ca. 100 mV, fett ca. 800–900 mV, Sollwert ca. 450 mV. Arbeitet ab ca. 300 °C, darum beheizt.",
   "Vorkatsonde regelt, Nachkatsonde überwacht den Kat. Schwingt die Nachkatsonde wie die Vorkatsonde, ist der Kat verbraucht.",
   "Breitbandsonde: misst λ stufenlos, Nernstzelle + Pumpzelle.",
   "AGR senkt die Verbrennungsspitzentemperatur → weniger NOx. Sekundärluft: HC/CO-Nachverbrennung beim Kaltstart.",
   "MIL leuchtet: abgasrelevanter Fehler. MIL blinkt: Aussetzer, die den Kat schädigen."
  ]},
 {id:"dsl", name:"Abgas Diesel (DPF & SCR)", prio:2,
  sheet:[
   "Oxi-Kat: CO und HC → CO2 und H2O, NO → NO2.",
   "DPF filtert Ruß. Passive Regeneration bei 350–500 °C mit NO2. Aktive: Motorsteuerung heizt auf ca. 600 °C (Nacheinspritzung).",
   "Rußbeladung über Differenzdrucksensor, Abgastemperatur und Luftmasse.",
   "Asche (aus Motoröl) verbrennt nicht → DPF irgendwann tauschen. Low-SAPS-Öl verwenden.",
   "SCR: AdBlue (32,5 % Harnstoff) → Ammoniak, reduziert NOx zu N2 und H2O.",
   "AdBlue gefriert bei −11 °C, greift Metalle an, kristallisiert. Verbrauch: Arbeitsblatt (Passat) 0,08–0,1 l/100 km, moderne Diesel oft 1–1,5 l pro 1000 km.",
   "DPF-Leuchte: ca. 15 min mit mind. 60 km/h im 4./5. Gang fahren."
  ]},
 {id:"get", name:"Schaltgetriebe & Übersetzung", prio:2, videos:[["Dreiwellengetriebe","https://www.youtube.com/watch?v=b1XWKR36K8c"]],
  sheet:[
   "Aufgaben Wechselgetriebe: Drehmoment und Drehzahl wandeln, Leerlauf, Drehrichtung umkehren.",
   "i = z2/z1 = n1/n2. i > 1 ins Langsame (mehr Moment), i < 1 ins Schnelle. i_ges = i1 · i2.",
   "Zwischenrad ändert nur die Drehrichtung, nicht die Übersetzung.",
   "Zweiwellengetriebe (ungleichachsig): ein Zahnradpaar pro Gang, für Quermotor. Dreiwellengetriebe (gleichachsig): zwei Paare pro Gang, direkter Gang i = 1.",
   "Synchronisierung: gleicht Drehzahl zwischen Schaltrad und Welle an, bevor die Schaltmuffe einrastet.",
   "Synchronring verschlissen → Kratzen beim Schalten. Spaltmaß mit Fühlerlehre messen.",
   "Schrägverzahnung: leiser, belastbarer, erzeugt aber Axialkräfte.",
   "Elastischer Bereich: zwischen Drehzahl bei max. Drehmoment und bei max. Leistung.",
   "Formeln: i_G = n_M / n_G, n_G = n_M / i_G, M_G = M_M · η_K · i_G · η_G, i_G = M_G / (M_M · η_K · η_G).",
   "Gleichachsig: i_G = i1 · i2 = (z2/z1) · (Gangrad getrieben / Gangrad treibend). Direkter Gang i = 1."
  ]},
 {id:"aut", name:"Automatik, DSG & Wandler", prio:2, videos:[["Planetenradgetriebe","https://www.youtube.com/watch?v=oTRBybrN0pI"],["ZF 8HP","https://www.youtube.com/watch?v=myVFhis505M"],["Drehmomentwandler","https://www.youtube.com/watch?v=97EKbN1ZXrs"]],
  sheet:[
   "Planetensatz: Sonnenrad, Planetenräder mit Planetenträger, Hohlrad.",
   "Größte Untersetzung: An Sonne, Hohlrad fest, Ab Planetenträger. Zwei Teile verblockt → i = 1. Planetenträger fest → Rückwärts.",
   "DSG: zwei Kupplungen. K1 auf Vollwelle: Gänge 1, 3, 5, R. K2 auf Hohlwelle: 2, 4, 6. Nächster Gang ist vorgewählt, Wechsel ohne Zugkraftunterbrechung.",
   "Wandler: Pumpenrad (Motor) → Turbinenrad (Getriebewelle) → Leitrad auf Freilauf. Momentverstärkung bis ca. 2–2,5-fach beim Anfahren.",
   "Wandlerüberbrückungskupplung: verbindet Pumpe und Turbine mechanisch → kein Schlupf, weniger Verbrauch.",
   "ZF 8HP: 4 Planetensätze, 5 Schaltelemente, je Gang 3 geschlossen.",
   "Vorteil Planetengetriebe: Schalten unter Last, kompakt, koaxial."
  ]},
 {id:"kup", name:"Kupplung", prio:1,
  sheet:[
   "Hauptteile: Schwungrad, Kupplungsscheibe, Druckplatte mit Membranfeder.",
   "Membranfeder erzeugt die Anpresskraft. Ausrücker hebt die Druckplatte ab = Auskuppeln.",
   "Kupplungsscheibe sitzt drehfest und axial verschiebbar auf der Getriebeeingangswelle.",
   "Übertragbares Moment: M = F · µ · r_m · z (Anpresskraft, Reibungszahl, mittlerer Radius, Reibflächen).",
   "Beim Anfahren Gleitreibung, danach Haftreibung.",
   "Torsionsdämpfer dämpft Drehschwingungen, Belagfederung sorgt für weiches Einkuppeln.",
   "Geberzylinder: Pedalkraft → Druck. Nehmerzylinder: Druck → Kraft auf Ausrückgabel.",
   "Störungen: Rutschen, Rupfen, Trennt nicht (Klemmen), Geräusche. SAC = selbstnachstellend."
  ]},
 {id:"brm", name:"Bremse, ABS & ESP", prio:2,
  sheet:[
   "Bremskreise: II (vorn/hinten), X (diagonal, mit negativem Lenkrollhalbmesser).",
   "ABS: Druck aufbauen, halten, abbauen über Einlass- und Auslassventil, Rückförderpumpe. Regelbereich ca. 8–35 % Schlupf.",
   "ABS verhindert Blockieren → Lenkbarkeit bleibt. ASR verhindert Durchdrehen. ESP verhindert Schleudern durch Abbremsen einzelner Räder.",
   "ESP: Untersteuern → kurveninneres Hinterrad bremsen. Übersteuern → kurvenäußeres Vorderrad bremsen.",
   "Aktiver Raddrehzahlsensor (Hall/MR): Rechtecksignal, misst ab ca. 0,1 km/h, erkennt Drehrichtung. Passiv/induktiv: Sinus, Amplitude steigt mit Drehzahl.",
   "Fading: Bremskraft lässt durch Hitze nach.",
   "Max. Bremskraftdifferenz einer Achse: 25 % (Betriebsbremse, Lehrbuch-Richtwert). Über 30 % = erheblicher Mangel bei der HU."
  ]},
 {id:"fw", name:"Fahrwerk & Lenkung", prio:2,
  sheet:[
   "Sturz: Neigung des Rades zur Senkrechten (oben außen = positiv). Spreizung: Neigung der Lenkachse quer. Nachlauf: Lenkachse längs, Lenkpunkt vor Radaufstand.",
   "Rückstellkräfte durch Nachlauf und Spreizung.",
   "Vorspur: vorn enger als hinten (l2 − l1 > 0). 1° = 60 Winkelminuten.",
   "Lenkrollhalbmesser negativ: stabilisiert bei einseitigem Bremsen.",
   "Lenktrapez: kurveninneres Rad schlägt stärker ein (Spurdifferenzwinkel, Messung bei 20°).",
   "Vierrad-Vermessung: Hinterachse bestimmt die geometrische Fahrachse.",
   "Achsen: McPherson (Federbein + Querlenker), Verbundlenkerachse (Hinterachse Fronttriebler), Mehrlenkerachse.",
   "Stabilisator: weniger Wanken in Kurven. Einrohrdämpfer: bessere Kühlung, Einbau beliebig."
  ]},
 {id:"can", name:"Vernetzung CAN & LIN", prio:2,
  sheet:[
   "Antriebs-CAN 500 kBit/s (High-Speed). Komfort-CAN 100 kBit/s, eindrahtfähig. LIN bis 20 kBit/s, Eindraht, Master-Slave.",
   "Abschlusswiderstände je 120 Ω, parallel gemessen 60 Ω. Verhindern Reflexionen.",
   "Leitungen verdrillt (Schlaglänge 20 mm), max. 50 mm unverdrillt bei Reparatur.",
   "Dominant = logisch 0. CAN-C: rezessiv beide 2,5 V, dominant High 3,5 V / Low 1,5 V.",
   "Gateway verbindet Busse mit verschiedenen Geschwindigkeiten und ist die Diagnoseschnittstelle.",
   "Arbitrierung: niedriger Identifier = höhere Priorität.",
   "LIN: rezessiv ca. 12 V, dominant 0 V. Header vom Master, Response vom Slave.",
   "OBD-Stecker: Pin 16 Plus, Pin 4/5 Masse, Pin 6/14 CAN, Pin 7/15 K-Leitung."
  ]},
 {id:"air", name:"Airbag & Sicherheit", prio:1,
  sheet:[
   "Aktive Sicherheit verhindert Unfälle (ABS, ESP, gute Sitze). Passive mindert Unfallfolgen (Airbag, Gurt, Knautschzone).",
   "Arbeiten an Pyrotechnik nur mit Sachkundenachweis.",
   "Vor Arbeiten: Zündung aus, Batterie ab, Pol isolieren, Wartezeit, sich elektrostatisch entladen.",
   "NIE Widerstand an der Zündpille messen – der Messstrom kann zünden.",
   "Kurzschlussbrücke im Stecker verhindert ungewollte Auslösung.",
   "Airbag-Einheit mit Polster nach oben lagern.",
   "Batterie wieder anklemmen: Zündung ein, niemand im Innenraum.",
   "Fahrgastzelle steif, Knautschzone weich."
  ]},
 {id:"ele", name:"Elektrik & Diagnose", prio:2,
  sheet:[
   "Spannungsfall über intakter Leitung ca. 0 V. Volle Spannung über einer Leitung = Unterbrechung.",
   "Widerstand nur stromlos messen. O.L. = offen = Unterbrechung.",
   "Vor Diagnose: Schoner, Herstellerinfo, Batterie mit Ladegerät stützen.",
   "Abschluss: Fehlerspeicher löschen, Probefahrt, erneut auslesen, dokumentieren.",
   "Einspritzventil-Strombild: Anzugsphase (hoher Strom), dann Haltephase (getaktet).",
   "Reihenschaltung: Spannungen addieren. Parallelschaltung: Kapazität steigt, Spannung gleich.",
   "P = U · I. Höhere Spannung → weniger Strom → dünnere Kabel.",
   "Gefährlich ab ca. 50 V AC / 120 V DC Berührungsspannung. RCD löst bei 30 mA aus."
  ]},
 {id:"wiso", name:"WiSo", hint:"Wirtschafts- und Sozialkunde", prio:2,
  sheet:[
   "Sozialversicherungen: Kranken-, Pflege-, Renten-, Arbeitslosen- (je halb AN/AG) und Unfallversicherung (nur AG, Berufsgenossenschaft).",
   "Ausbildung: BBiG. Probezeit 1–4 Monate. Abschlussprüfung 2× wiederholbar. Vertrag vor Beginn unterschreiben.",
   "Krank: Arbeitgeber zahlt 6 Wochen weiter. Unverzüglich melden, Krankheit muss nicht genannt werden.",
   "Tarifautonomie: Gewerkschaften und Arbeitgeberverbände verhandeln ohne Staat. Friedenspflicht während der Laufzeit.",
   "Ablauf: Verhandlungen → Schlichtung → Urabstimmung (75 %) → Streik → neuer Vertrag. Im Streik ruhen alle Pflichten.",
   "Vertrag = zwei übereinstimmende Willenserklärungen. Eigentumsvorbehalt: Eigentum erst nach Bezahlung.",
   "Mangel: zuerst Nacherfüllung, dann Rücktritt/Minderung. Gewährleistung 2 Jahre.",
   "GmbH: 25.000 € Stammkapital, haftet mit Gesellschaftsvermögen. Prokura = größte Vollmacht.",
   "Magisches Viereck: Preisstabilität, hoher Beschäftigungsstand, stetiges Wachstum, außenwirtschaftliches Gleichgewicht.",
   "Netto = Brutto − Steuern − Sozialabgaben. Reallohn = Kaufkraft (Lohnplus minus Inflation)."
  ]}
],
q: [
// ---------- HV-Sicherheit ----------
{t:"hv",q:"Ab welcher Spannung spricht man im Kfz von Hochvolt?",a:["Über 30 V AC bzw. über 60 V DC","Über 12 V DC","Über 48 V AC bzw. über 120 V DC","Über 230 V AC"],e:"Nach UNECE R100 gilt im Kfz: Wechselspannung über 30 V und Gleichspannung über 60 V ist Hochvolt."},
{t:"hv",q:"Welche Farbe haben Hochvolt-Leitungen im Fahrzeug?",a:["Orange","Rot","Gelb","Blau"],e:"HV-Leitungen sind immer orange. So erkennt man sie sofort."},
{t:"hv",q:"Welche Qualifizierungsstufe brauchst du mindestens, um ein HV-Fahrzeug freizuschalten?",a:["Stufe 2S (Fachkundige Person HV)","Stufe S (sensibilisierte Person)","Stufe 1S (fachkundig unterwiesene Person)","Keine, jeder Mechatroniker darf das"],e:"Freischalten und Arbeiten im spannungsfreien Zustand darf nur die FHV, also Stufe 2S."},
{t:"hv",q:"Was darf eine Person mit Stufe 1S (fachkundig unterwiesen) an einem HV-Fahrzeug machen?",a:["Allgemeine, nicht-elektrische Arbeiten wie Öl- oder Radwechsel","Das HV-System freischalten","Messungen am aktiven HV-System","Zellen in der HV-Batterie tauschen"],e:"1S darf nur Arbeiten, die das HV-System nicht unmittelbar betreffen: Karosserie, Öl, Räder, Bremsen."},
{t:"hv",q:"Was darf nur Stufe 3S?",a:["Arbeiten an unter Spannung stehenden HV-Komponenten","Fahrzeug fahren und bedienen","Räderwechsel","Freischalten nach Herstellervorgabe"],e:"3S = Arbeiten unter Spannung, z. B. Fehlersuche an aktiven Teilen, wenn nicht freigeschaltet werden kann."},
{t:"hv",q:"Wie lautet die richtige Reihenfolge der ersten drei Sicherheitsregeln?",a:["Freischalten – gegen Wiedereinschalten sichern – Spannungsfreiheit feststellen","Spannungsfreiheit feststellen – freischalten – sichern","Erden – freischalten – abdecken","Freischalten – erden – Spannungsfreiheit feststellen"],e:"1 Freischalten, 2 Sichern, 3 Spannungsfreiheit feststellen, 4 Erden und Kurzschließen, 5 Abdecken."},
{t:"hv",q:"Wie stellst du die Spannungsfreiheit am HV-System richtig fest?",a:["Allpolig mit zweipoligem Spannungsprüfer, vorher und nachher an bekannter Quelle testen","Mit einem Multimeter nur HV+ gegen Masse","Über die Ready-Anzeige im Kombiinstrument","Mit einem einpoligen Phasenprüfer"],e:"Drei Messungen: HV+ gegen HV−, HV+ gegen Masse, HV− gegen Masse. Das Prüfgerät vorher und nachher testen."},
{t:"hv",q:"Warum benutzt man zum Feststellen der Spannungsfreiheit einen Spannungsprüfer statt eines Multimeters?",a:["Er zeigt eindeutig an und man kann keinen falschen Messbereich wählen","Er ist genauer im mV-Bereich","Er misst auch den Isolationswiderstand","Er ist billiger"],e:"Beim Multimeter kann man den falschen Bereich einstellen. Der zweipolige Spannungsprüfer (CAT III) zeigt eindeutig an."},
{t:"hv",q:"Warum muss nach dem Ziehen des Service-Steckers eine Wartezeit eingehalten werden?",a:["Die Zwischenkreiskondensatoren im Inverter müssen sich entladen","Die HV-Batterie muss abkühlen","Das BMS muss sich neu starten","Damit sich die Schütze schließen"],e:"Im Inverter sitzen Kondensatoren, die noch Spannung halten. Sie entladen sich über Widerstände."},
{t:"hv",q:"Wie sicherst du ein freigeschaltetes HV-Fahrzeug gegen Wiedereinschalten?",a:["Service-Stecker wegschließen, Schlüssel sicher verwahren, 12-V-Batterie abklemmen","Nur die Zündung ausschalten","Ladeklappe schließen","Motorhaube offen lassen"],e:"Service-Stecker in Box mit Schloss, Schlüssel weit weg (mind. 3 m) und sicher verwahren, 12-V-Minuspol ab, Ladekabel trennen."},
{t:"hv",q:"Welches Schild hängt an einem Fahrzeug, bei dem die Spannungsfreiheit festgestellt wurde?",a:["Das weiße Schild (spannungsfrei)","Das rote Schild (nicht spannungsfrei)","Beide Schilder","Gar kein Schild"],e:"Rot = nicht spannungsfrei, weiß = spannungsfrei. Auf der Scheibe hängt immer nur eins."},
{t:"hv",q:"Ab welcher Stromstärke durch den Körper droht Herzkammerflimmern?",a:["Ab ca. 50–80 mA","Ab ca. 1 mA","Ab ca. 5 mA","Erst ab 3 A"],e:"Unter 5 mA Kribbeln, ab 15 mA kann man nicht mehr loslassen, ab ca. 50–80 mA Herzkammerflimmern."},
{t:"hv",q:"Wie groß ist der Strom bei 230 V und einem Körperwiderstand von 1000 Ω?",a:["230 mA","23 mA","2,3 A","2,3 mA"],e:"I = U / R = 230 V / 1000 Ω = 0,23 A = 230 mA. Das ist lebensgefährlich."},
{t:"hv",q:"Welche Handschuhe trägst du beim Freischalten?",a:["Isolierhandschuhe Klasse 0 (bis 1000 V), vorher auf Dichtheit prüfen","Normale Nitrilhandschuhe","Lederhandschuhe","Schnittschutzhandschuhe"],e:"HV-Handschuhe Klasse 0, gekennzeichnet mit Doppeldreieck. Vor jeder Benutzung aufblasen und auf Löcher prüfen."},
{t:"hv",q:"Welches Regelwerk legt die Qualifizierung für Arbeiten an HV-Fahrzeugen fest?",a:["DGUV Information 209-093","StVZO § 29","ECE R13","BBiG"],e:"Die DGUV 209-093 regelt Stufen S, 1S, 2S, 3S und die Verantwortung."},
{t:"hv",q:"Warum dürfen Personen mit Herzschrittmacher nicht an E-Maschinen arbeiten?",a:["Starke Magnetfelder der Permanentmagnete können den Schrittmacher stören","Weil die E-Maschine sehr heiß wird","Wegen giftiger Gase","Wegen der Lautstärke"],e:"Der Rotor hat starke Permanentmagnete. Deshalb auch das Verbotsschild mit Herz."},
{t:"hv",q:"Warum wird der Rotor einer E-Maschine nur mit Spezialwerkzeug aus- und eingebaut?",a:["Der Magnet zieht den Rotor ruckartig an den Stator – Quetschgefahr","Weil er sehr schwer ist","Weil er unter Hochspannung steht","Damit die Lager nicht verkratzen"],e:"Die Permanentmagnete ziehen den Rotor plötzlich an. Hände können eingeklemmt werden."},
{t:"hv",q:"Was gilt bei einem HV-eigensicheren Fahrzeug?",a:["Berührungs- und Lichtbogenschutz sind konstruktiv sichergestellt","Es hat keine HV-Batterie","Man muss nie freischalten","Es darf nur von 3S repariert werden"],e:"Eigensicher heißt: Isolation, Potenzialausgleich, Pilotlinie und automatische Abschaltung/Entladung schützen. Unfall- und Prototypfahrzeuge sind nicht eigensicher."},
{t:"hv",q:"Welche Arbeit darf ein Azubi im 1. Lehrjahr nach HV-Unterweisung NICHT machen?",a:["Das HV-System spannungsfrei schalten","Räder wechseln","Zündkerzen wechseln","Inspektion nach Herstellervorgabe"],e:"Freischalten und Messungen an der HV-Batterie sind 2S-Arbeit."},
{t:"hv",type:"f",q:"Nenne die fünf Sicherheitsregeln in der richtigen Reihenfolge.",k:["Freischalten","Gegen Wiedereinschalten sichern","Spannungsfreiheit feststellen","Erden und kurzschließen","Benachbarte unter Spannung stehende Teile abdecken"]},
{t:"hv",type:"f",q:"Beschreibe den Ablauf beim Freischalten eines HV-Fahrzeugs.",k:["Fehlerspeicher auslesen (HV-System)","Zündung aus, Schlüssel sicher wegschließen","Ladekabel trennen, 12-V-Batterie abklemmen","Handschuhe prüfen und anziehen, Schutzbrille","Service-Stecker ziehen und sichern","Wartezeit einhalten","Spannungsfreiheit allpolig messen, Prüfer vorher und nachher testen","Weißes Schild anbringen"]},
{t:"hv",type:"f",q:"Nenne drei mögliche Gründe, warum ein HV-System nach dem Freischalten trotzdem nicht spannungsfrei sein könnte.",k:["Kondensatoren noch nicht entladen (Wartezeit)","Schütz verklebt","Fremdeinspeisung (Ladekabel steckt, 12-V-Batterie)","Messgerät defekt / falsch gemessen"]},
// ---------- HV-Technik & Laden ----------
{t:"hvt",q:"Was bedeutet IT-Netz (Isolated Terra) im HV-Fahrzeug?",a:["HV+ und HV− haben keine leitende Verbindung zur Karosserie","Das HV-Netz ist mit der Karosserie verbunden","HV- und 12-V-Netz haben eine gemeinsame Masse","Das Netz ist über einen FI-Schalter geschützt"],e:"Das HV-Netz ist komplett isoliert. Berührt man nur einen Pol, fließt kein Strom."},
{t:"hvt",q:"Warum ist ein einzelner Isolationsfehler im IT-Netz noch nicht gefährlich?",a:["Es fehlt der Rückweg – erst ein zweiter Fehler schließt den Stromkreis","Weil die Sicherung sofort auslöst","Weil die Spannung dann auf 12 V sinkt","Weil das BMS die Batterie abschaltet"],e:"Gefährlich wird es erst, wenn beide Pole Kontakt zur Masse bekommen oder man HV+ und HV− berührt. Deshalb Isolationsüberwachung."},
{t:"hvt",q:"Wozu dient die Potenzialausgleichsleitung?",a:["Sie legt alle HV-Gehäuse auf das gleiche Potenzial wie die Karosserie","Sie verbindet HV+ mit HV−","Sie lädt den Zwischenkreis vor","Sie führt den Ladestrom"],e:"So entsteht zwischen zwei Gehäusen keine Berührungsspannung, und die Isolationsüberwachung funktioniert."},
{t:"hvt",q:"Welcher Widerstand ist nach ECE R100 für den Potenzialausgleich höchstens erlaubt?",a:["0,1 Ω","1 Ω","10 Ω","1 MΩ"],e:"Max. 0,1 Ω (100 mΩ) bei einem Prüfstrom von mindestens 0,2 A."},
{t:"hvt",q:"Warum misst man den Potenzialausgleich mit einem Milliohmmeter in 4-Leiter-Technik?",a:["Die Widerstände der Messleitungen verfälschen sonst das Ergebnis","Weil ein Ohmmeter zu hohe Spannung erzeugt","Weil die Leitung unter Spannung steht","Weil 4 Leitungen schneller messen"],e:"Zwei Leitungen bringen den Prüfstrom, zwei messen den Spannungsfall direkt am Prüfling. Leitungswiderstände fallen raus."},
{t:"hvt",q:"Mit welcher Prüfspannung wird die Isolationsprüfung meist durchgeführt?",a:["500 V","12 V","50 V","5 V"],e:"Isolationsmessgerät mit 500 V (nach Herstellervorgabe bis 1000 V). Ergebnis in MΩ."},
{t:"hvt",q:"Wie groß muss der Isolationswiderstand bei 232 V mindestens sein (500 Ω/V)?",a:["116 kΩ","23,2 kΩ","1,16 MΩ","464 Ω"],e:"500 Ω/V · 232 V = 116.000 Ω = 116 kΩ."},
{t:"hvt",q:"Der Isolationswert steigt von 96 kΩ auf 2,8 MΩ, nachdem der PTC-Zuheizer abgesteckt wurde. Was folgt daraus?",a:["Der Fehler liegt im PTC-Zuheizer oder seiner Leitung","Der Fehler liegt in der HV-Batterie","Das Messgerät ist defekt","Alles ist in Ordnung"],e:"Ausschlussprinzip: Springt der Wert nach dem Abtrennen hoch, steckt der Fehler im abgetrennten Teil."},
{t:"hvt",q:"Was passiert, wenn die Pilotlinie (Interlock) unterbrochen wird?",a:["Das BMS öffnet sofort die Hauptschütze","Das Fahrzeug fährt im Notlauf weiter","Der DC/DC-Wandler schaltet auf 48 V","Nichts, sie dient nur der Diagnose"],e:"Die Pilotlinie läuft durch alle HV-Stecker und Deckel. Wird ein Stecker gezogen, wird das System sofort spannungslos."},
{t:"hvt",q:"Wozu dient der Vorladeschütz mit Vorladewiderstand?",a:["Er lädt den Zwischenkreiskondensator langsam auf und begrenzt den Einschaltstrom","Er entlädt die HV-Batterie beim Abstellen","Er misst die Zellspannungen","Er schützt vor Überladung beim AC-Laden"],e:"Ohne Vorladung gäbe es eine Stromspitze, die die Kontakte abbrennt. Erst danach schließt das Hauptschütz."},
{t:"hvt",q:"Welche Aufgabe hat der Inverter?",a:["Er wandelt Gleichspannung der Batterie in 3-Phasen-Wechselspannung für die E-Maschine","Er wandelt 230 V AC in HV DC","Er versorgt das 12-V-Netz","Er überwacht die Isolation"],e:"Inverter mit IGBTs: DC → AC zum Fahren, beim Rekuperieren AC → DC."},
{t:"hvt",q:"Was macht der On-Board-Lader (OBC)?",a:["Er wandelt die Wechselspannung der Ladestation in Gleichspannung für die HV-Batterie","Er wandelt HV in 12 V","Er steuert den E-Motor","Er misst den Ladezustand"],e:"Beim AC-Laden richtet der OBC im Auto gleich. Beim DC-Laden wird er umgangen."},
{t:"hvt",q:"Was macht der DC/DC-Wandler?",a:["Er versorgt das 12-V-Bordnetz aus der HV-Batterie","Er lädt die HV-Batterie an der Steckdose","Er steuert die E-Maschine","Er wandelt AC in DC beim Rekuperieren"],e:"Er ersetzt praktisch die Lichtmaschine. Galvanisch getrennt über einen Transformator."},
{t:"hvt",q:"Welches Bauteil wandelt im Inverter Gleichspannung in Wechselspannung?",a:["IGBT (Leistungstransistor)","Relais","Diode allein","Kondensator"],e:"IGBTs schalten sehr schnell und verschleißfrei. Sechs davon bilden die B6-Brücke."},
{t:"hvt",q:"Welche Aufgabe hat der Service-Disconnect (Wartungsstecker)?",a:["Er trennt die HV-Batterie in der Mitte und unterbricht die Sicherheitslinie","Er misst den Isolationswiderstand","Er schaltet das 12-V-Netz ab","Er ist nur ein Diagnoseanschluss"],e:"Damit wird die Batteriespannung halbiert und die Schütze öffnen über die Pilotlinie."},
{t:"hvt",q:"Mit welcher Ladebetriebsart lädt ein Fahrzeug an einer AC-Wallbox mit bis zu 63 A?",a:["Mode 3","Mode 1","Mode 2","Mode 4"],e:"Mode 3 = AC an Ladestation mit Kommunikation. Mode 4 = DC-Schnellladen."},
{t:"hvt",q:"Wozu dient der CP-Kontakt (Control Pilot) am Ladestecker?",a:["Kommunikation zwischen Ladestation und Fahrzeug über ein PWM-Signal","Erkennung der Strombelastbarkeit des Kabels","Schutzleiter","Er führt den Ladestrom"],e:"Über das Tastverhältnis teilt die Station den max. Ladestrom mit. PP erkennt das Kabel."},
{t:"hvt",q:"Der Codierwiderstand zwischen PP und PE beträgt 220 Ω. Wie viel Strom verträgt das Kabel?",a:["32 A","13 A","20 A","63 A"],e:"1,5 kΩ = 13 A, 680 Ω = 20 A, 220 Ω = 32 A, 100 Ω = 63 A."},
{t:"hvt",q:"Welche Spannung liegt an CP, wenn das Fahrzeug ladebereit ist?",a:["+6 V","+12 V","+9 V","0 V"],e:"+12 V: kein Fahrzeug. +9 V: Fahrzeug erkannt. +6 V: Fahrzeug bereit, Laden läuft. Bleibt es bei 9 V, schaltet das Auto nicht durch."},
{t:"hvt",q:"Wie viel Ladeleistung bringt ein Drehstromanschluss mit 400 V und 16 A?",a:["Ca. 11 kW","Ca. 3,7 kW","Ca. 22 kW","Ca. 6,4 kW"],e:"P = √3 · 400 V · 16 A ≈ 11.085 W."},
{t:"hvt",q:"Wie ist der DC-Schnellladestecker in Europa bezeichnet?",a:["CCS (Combo 2)","Typ 1","Schuko","Typ 3"],e:"CCS = Typ-2-Stecker mit zwei zusätzlichen DC-Kontakten."},
{t:"hvt",q:"Welche Aufgaben hat das Batteriemanagementsystem (BMS)?",a:["Zellen überwachen, Schütze steuern, Laden regeln, SoC berechnen","Nur die Temperatur anzeigen","Den Inverter takten","Die Ladesäule bezahlen"],e:"BMS: Zellspannung und Temperatur, Balancing, SoC (Ladezustand), SoH (Alterung), Schütze."},
{t:"hvt",q:"Was passiert mit der Spannung, wenn Batteriezellen in Reihe geschaltet werden?",a:["Die Spannungen addieren sich","Die Kapazität verdoppelt sich, Spannung bleibt","Die Spannung halbiert sich","Nichts"],e:"Reihe: U addiert sich. Parallel: Kapazität steigt. Die schwächste Zelle bestimmt die Reihe."},
{t:"hvt",q:"Welche Nennspannung hat eine Lithium-Ionen-Zelle ungefähr?",a:["3,6–3,7 V","1,2 V","2,0 V","12 V"],e:"NiMH 1,2 V, Blei 2 V, Li-Ion 3,6–3,7 V."},
{t:"hvt",type:"f",q:"Erkläre, warum ein Ohmmeter (2-Leiter) nicht geeignet ist, um eine Potenzialausgleichsleitung zu messen, und wie man es richtig macht.",k:["Widerstand der Messleitungen liegt im mΩ-Bereich und verfälscht das Ergebnis","Prüfstrom eines Ohmmeters zu klein (ECE R100: mind. 0,2 A)","Milliohmmeter mit 4-Leiter-Messung verwenden","Zwei Leitungen Prüfstrom, zwei Leitungen messen Spannungsfall direkt","R = U / I, Grenzwert max. 0,1 Ω"]},
{t:"hvt",type:"f",q:"Beschreibe die Reihenfolge der Wiederinbetriebnahme nach einer Reparatur am HV-System.",k:["Sichtprüfung der HV-Komponenten und Leitungen","Potenzialausgleich messen","Isolationsprüfung","Wartungsstecker stecken und verriegeln","Funktionsprüfung","Dokumentation mit Name und Unterschrift"]},
{t:"hvt",type:"f",q:"Erkläre, wie das HV-System beim Einschalten zugeschaltet wird (Vorladung).",k:["Minus-Schütz und Vorladeschütz schließen","Strom fließt über Vorladewiderstand","Zwischenkreiskondensator wird langsam geladen","System prüft sich","Plus-Schütz schließt, Vorladeschütz öffnet"]},
// ---------- Hybrid & E-Antrieb ----------
{t:"hyb",q:"Was bedeutet BEV?",a:["Battery Electric Vehicle – reines Batterie-Elektrofahrzeug","Brennstoffzellenfahrzeug","Plug-in-Hybrid","Fahrzeug mit Range Extender"],e:"BEV = rein elektrisch. FCEV = Brennstoffzelle, PHEV = Plug-in, REEV = Range Extender."},
{t:"hyb",q:"Was ist nach Definition ein Hybridfahrzeug?",a:["Ein Fahrzeug mit mindestens zwei Energiewandlern und zwei Energiespeichern","Jedes Auto mit Start-Stopp","Ein Auto mit zwei Batterien","Ein Auto, das Benzin und Diesel tanken kann"],e:"Zum Beispiel Verbrenner + E-Motor und Tank + Batterie."},
{t:"hyb",q:"Was kann ein Mild-Hybrid, ein Micro-Hybrid aber nicht?",a:["Boosten (Drehmomentunterstützung durch den E-Motor)","Start-Stopp","Automatisch abschalten im Stand","Nichts, beide können dasselbe"],e:"Micro: Start-Stopp. Mild (48 V): zusätzlich Rekuperation und Boost. Voll: zusätzlich elektrisch fahren."},
{t:"hyb",q:"Was kann nur ein Vollhybrid?",a:["Rein elektrisch fahren","Rekuperieren","Boosten","Start-Stopp"],e:"Nur der Vollhybrid hat ein HV-System, das genug Leistung zum elektrischen Fahren bringt."},
{t:"hyb",q:"Was versteht man unter Rekuperation?",a:["Bewegungsenergie wird beim Bremsen in elektrische Energie umgewandelt","Der Verbrenner lädt im Stand die Batterie","Die Batterie wird an der Steckdose geladen","Der E-Motor unterstützt beim Beschleunigen"],e:"Die E-Maschine arbeitet als Generator und lädt die Batterie."},
{t:"hyb",q:"Wodurch ist ein serieller Hybrid gekennzeichnet?",a:["Der Verbrenner treibt nur einen Generator, angetrieben wird nur elektrisch","Verbrenner und E-Motor treiben gemeinsam mechanisch an","Ein Planetengetriebe verteilt die Leistung","Der E-Motor sitzt im Rad"],e:"Seriell = keine mechanische Verbindung vom Verbrenner zu den Rädern (wie ein Range Extender)."},
{t:"hyb",q:"Welches Bauteil verteilt beim leistungsverzweigten Hybrid (Toyota) die Leistung?",a:["Ein Planetengetriebe","Eine Doppelkupplung","Ein Drehmomentwandler","Ein Verteilergetriebe mit Visco"],e:"Der Planetensatz verteilt die Verbrennerleistung auf mechanischen Weg und Generator MG1. Das wirkt wie ein stufenloses Getriebe."},
{t:"hyb",q:"Was unterscheidet die Synchronmaschine von der Asynchronmaschine?",a:["Beim Synchronmotor dreht der Rotor genauso schnell wie das Drehfeld","Der Synchronmotor hat Schlupf","Der Asynchronmotor hat Permanentmagnete","Der Synchronmotor läuft mit Gleichstrom"],e:"Asynchron: Rotor ist langsamer als das Drehfeld (Schlupf), Strom wird im Käfigläufer induziert."},
{t:"hyb",q:"Wozu braucht ein permanenterregter Synchronmotor einen Resolver?",a:["Um die genaue Rotorlage zu erfassen, damit der Inverter richtig ansteuert","Um die Temperatur zu messen","Um den Isolationswiderstand zu überwachen","Um die Batterie zu laden"],e:"Der Resolver liefert Winkel, Drehzahl und Drehrichtung. Nach Tausch muss er angelernt werden."},
{t:"hyb",q:"Welcher Vorteil gehört zur Asynchronmaschine?",a:["Einfacher, robuster Aufbau und geringe Kosten","Höchster Wirkungsgrad","Keine Verluste durch Schlupf","Braucht seltene Erden"],e:"Nachteil: schlechterer Wirkungsgrad und großer Anlaufstrom."},
{t:"hyb",q:"Warum sind die drei Phasen U, V, W um 120° versetzt?",a:["So entsteht im Stator ein umlaufendes Drehfeld","Damit die Batterie gleichmäßig entladen wird","Damit der Rotor stillsteht","Um Kabel zu sparen"],e:"Drei räumlich und zeitlich versetzte Spulenströme erzeugen ein Drehfeld, dem der Rotor folgt."},
{t:"hyb",q:"Wie darf man einem Hybridfahrzeug Starthilfe geben?",a:["Nur an der 12-V-Batterie bzw. den vorgesehenen Starthilfepunkten","An der HV-Batterie","Über das Ladekabel","Gar nicht"],e:"Nie an HV-Teilen. Nur 12-V-Stützpunkte laut Hersteller."},
{t:"hyb",q:"Warum haben die HV-Phasenleitungen farbige Markierungen und Codiernasen?",a:["Damit die Phasen beim Anschließen nicht vertauscht werden","Damit sie besser aussehen","Wegen der Kühlung","Für den Potenzialausgleich"],e:"Vertauschte Phasen = falsche Drehrichtung oder Schaden."},
{t:"hyb",q:"Warum muss die Rotorposition nach dem Getriebetausch kalibriert werden?",a:["Der Inverter braucht die genaue Rotorlage zur Ansteuerung","Weil sich die Batteriespannung ändert","Weil das Öl gewechselt wurde","Für die Klimaanlage"],e:"Ohne richtige Rotorlage bestromt der Inverter die Phasen zum falschen Zeitpunkt."},
{t:"hyb",q:"Was versteht man unter Boosten?",a:["Der E-Motor unterstützt den Verbrenner beim Beschleunigen mit zusätzlichem Drehmoment","Starkes Rekuperieren","Schnellladen an DC","Abschalten des Motors im Stand"],e:"Beim Überholen oder Anfahren gibt der E-Motor Drehmoment dazu. Das erlaubt kleinere Motoren (Downsizing)."},
{t:"hyb",type:"f",q:"Nenne Vorteile und Nachteile der Asynchron- und der Synchronmaschine.",k:["Asynchron: einfach, robust, günstig","Asynchron: schlechterer Wirkungsgrad (Schlupf), großer Anlaufstrom","Synchron: hoher Wirkungsgrad, hohes Drehmoment, genaue Regelung","Synchron: teuer (Permanentmagnete, seltene Erden), braucht Resolver"]},
{t:"hyb",type:"f",q:"Erkläre den Unterschied zwischen seriellem, parallelem und leistungsverzweigtem Hybrid.",k:["Seriell: Verbrenner treibt nur Generator, Antrieb nur elektrisch","Parallel: Verbrenner und E-Motor treiben beide mechanisch an","Leistungsverzweigt: Planetengetriebe kombiniert beide Wege"]},
// ---------- Motormanagement Otto ----------
{t:"otto",q:"Was bedeutet λ = 1?",a:["Die zugeführte Luft entspricht genau der theoretisch nötigen Luft (14,7 : 1)","Das Gemisch ist fett","Das Gemisch ist mager","Der Motor läuft im Schichtbetrieb"],e:"14,7 kg Luft auf 1 kg Benzin = stöchiometrisch."},
{t:"otto",q:"Ein Gemisch mit λ = 0,9 ist …",a:["fett (Luftmangel)","mager (Luftüberschuss)","stöchiometrisch","nicht zündfähig"],e:"λ < 1 = zu wenig Luft = fett. λ > 1 = mager."},
{t:"otto",q:"Aus welchen drei Hauptsteuergrößen berechnet die Motronic die Grundeinspritzmenge?",a:["Fahrerwunsch, angesaugte Luftmasse, Motordrehzahl","Kühlmitteltemperatur, Öldruck, Drehzahl","Lambdawert, Klopfsignal, Geschwindigkeit","Batteriespannung, Ansauglufttemperatur, Gang"],e:"Fahrpedalmodul, Heißfilm-Luftmassenmesser, Drehzahlgeber an der Kurbelwelle."},
{t:"otto",q:"Welcher Sensor erfasst die angesaugte Luftmasse direkt?",a:["Heißfilm-Luftmassenmesser","Saugrohrdrucksensor","Stauklappe","Drosselklappenpotentiometer"],e:"Der Heißfilmsensor misst die Masse direkt. Saugrohrdruck rechnet sie nur indirekt aus."},
{t:"otto",q:"Was ist das Merkmal der sequentiellen Einspritzung (MPI)?",a:["Jedes Ventil spritzt einzeln in Zündfolge, kurz vor dem Ansaugtakt","Alle Ventile spritzen gleichzeitig","Es gibt nur ein zentrales Einspritzventil","Es wird direkt in den Brennraum gespritzt"],e:"Sequentiell = nacheinander, passend zum Ansaugtakt jedes Zylinders."},
{t:"otto",q:"Wie erfolgt die Kaltstartanreicherung?",a:["Durch längere Einspritzzeit abhängig von der Kühlmitteltemperatur","Durch ein extra Kaltstartventil mit Luft","Durch Verstellen der Nockenwelle","Durch Abschalten der Lambdaregelung auf mager"],e:"Kraftstoff kondensiert an kalten Wänden, darum wird mehr eingespritzt."},
{t:"otto",q:"Was versteht man unter Schubabschaltung?",a:["Im Schiebebetrieb wird die Einspritzung abgeschaltet","Der Motor geht an der Ampel aus","Die Zündung wird bei Vollgas abgeschaltet","Der Turbolader wird abgeschaltet"],e:"Gas weg, Drehzahl über Leerlauf → keine Einspritzung. Spart Kraftstoff, weniger Schadstoffe."},
{t:"otto",q:"Die Lambdasonde meldet unter 0,4 V. Wie reagiert das Steuergerät?",a:["Es verlängert die Einspritzzeit (Gemisch wird fetter)","Es verkürzt die Einspritzzeit","Es schaltet die Zündung ab","Es reagiert nicht"],e:"Unter 0,4 V = mager = zu viel Sauerstoff. Also mehr Kraftstoff."},
{t:"otto",q:"Wie wird das E-Gas-System überwacht?",a:["Durch doppelte Potentiometer oder Hallsensoren in Fahrpedal und Drosselklappe","Durch den Drehzahlgeber","Durch den Luftmassenmesser allein","Über den CAN-Bus"],e:"Zwei unabhängige Signale werden verglichen. Bei Abweichung Notlauf."},
{t:"otto",q:"Ein Potentiometer im Fahrpedalgeber fällt aus. Wie reagiert das System?",a:["Notlauf mit eingeschränkter Leistung und Fehlereintrag","Der Motor geht sofort aus","Gar nicht","Die Drosselklappe öffnet voll"],e:"Das zweite Signal hält den Betrieb im Notlauf aufrecht, EPC-Leuchte an."},
{t:"otto",q:"Gibt der Fahrer bei durchdrehenden Antriebsrädern mehr Gas, …",a:["schließt die Drosselklappe trotzdem (ASR-Eingriff)","öffnet die Drosselklappe weiter","geht der Motor aus","schaltet das Getriebe hoch"],e:"Beim E-Gas kann das Steuergerät gegen den Fahrerwunsch das Moment reduzieren."},
{t:"otto",q:"Wie gelangt bei der Benzin-Direkteinspritzung der Kraftstoff zu den Injektoren?",a:["Er wird unter Druck im Rail gespeichert und an die Einspritzventile verteilt","Er wird im Fördermodul vorgewärmt","Er wird vor das Einlassventil gespritzt","Er wird von der Hochdruckpumpe direkt in den Zylinder gedrückt ohne Speicher"],e:"Elektrische Pumpe → Hochdruckpumpe → Rail → Hochdruckinjektoren."},
{t:"otto",q:"Welches Gemisch liegt im Schichtladebetrieb an der Zündkerze vor?",a:["Annähernd λ = 1 (zündfähig), außen herum sehr mager","Überall gleich mager","Überall λ = 1","Sehr fett im ganzen Brennraum"],e:"Geschichtet: um die Kerze zündfähig, im Rest Luft. Gesamt sehr mager."},
{t:"otto",q:"Warum braucht ein direkteinspritzender Ottomotor mit Schichtladung einen NOx-Speicherkat?",a:["Weil er zeitweise mit Luftüberschuss läuft und der 3-Wege-Kat NOx dann nicht reduziert","Weil er mehr CO erzeugt","Weil er keinen Turbo hat","Weil die Temperatur zu niedrig ist"],e:"Bei magerem Betrieb fehlt das CO zum Reduzieren von NOx. Der Speicherkat sammelt es und wird fett regeneriert."},
{t:"otto",q:"Wie ist beim Schichtladebetrieb die Drosselklappe gestellt?",a:["Völlig geöffnet, die Saugrohrklappen sind geschlossen","Völlig geschlossen","Teilweise geöffnet, Saugrohrklappen offen","Sie regelt die Last allein"],e:"Last wird über die Kraftstoffmenge geregelt (Qualitätsregelung), daher kaum Drosselverluste."},
{t:"otto",q:"Was ist beim strahlgeführten Direkteinspritzverfahren typisch?",a:["Piezo-Injektoren spritzen knapp an der Zündkerze vorbei","Die Kolbenmulde lenkt den Kraftstoff zur Kerze","Eingespritzt wird ins Saugrohr","Eine Tumble-Bewegung bläst den Kraftstoff zur Kerze"],e:"Wandgeführt = über Kolbenmulde und Luftführung. Strahlgeführt = Einspritzstrahl direkt an die Kerze."},
{t:"otto",q:"Wie wird das Einspritzventil einer ME-Motronic betätigt?",a:["Elektromagnetisch geöffnet und durch Federdruck geschlossen","Hydraulisch geöffnet","Durch Federdruck offen gehalten","Mechanisch über die Nockenwelle"],e:"Strom durch die Spule hebt die Nadel. Ohne Strom drückt die Feder zu."},
{t:"otto",q:"Welche Signalspannung liefert ein intakter Luftmassenmesser im Leerlauf ungefähr?",a:["1,3–1,9 V","0 V","11–14 V","4,5–5 V"],e:"Versorgung ca. 11–14 V, Masse 0 V, Signal im Leerlauf 1,3–1,9 V."},
{t:"otto",q:"Was zeigt das Strombild am Einspritzventil?",a:["Erst eine Anzugsphase mit hohem Strom, dann eine getaktete Haltephase","Einen gleichmäßigen Strom","Nur eine Spannungsspitze","Einen Sinus"],e:"Hoher Anzugsstrom öffnet schnell, danach reicht ein kleinerer Haltestrom."},
{t:"otto",q:"Was ist die Motronic?",a:["Ein rechnergesteuertes Einspritz- und Zündsystem mit gemeinsamem Steuergerät","Nur ein Einspritzsystem","Ein mechanisches Einspritzsystem","Ein Getriebesteuergerät"],e:"Einspritzung und Zündung in einem Steuergerät, Kennfelder gespeichert."},
{t:"otto",type:"f",q:"Nenne je ein Bauteil, das ein Benzin-Direkteinspritzer im Vergleich zum Saugrohreinspritzer zusätzlich hat: Luftführung, Kraftstoff, Abgas.",k:["Luftführung: Saugrohr- bzw. Ladungsbewegungsklappen","Kraftstoff: Hochdruckpumpe, Rail, Hochdruckinjektoren, Raildrucksensor","Abgas: NOx-Speicherkat mit NOx-Sensor"]},
{t:"otto",type:"f",q:"Wie prüfst du einen Luftmassenmesser mit dem Y-Kabel? Nenne Messungen und erwartete Werte.",k:["Spannungsversorgung gegen Masse: ca. 11–14 V","Masse: 0 V","Signalspannung im Leerlauf: ca. 1,3–1,9 V","Messen bei laufendem Motor, Stecker bleibt angeschlossen"]},
// ---------- Abgas Otto ----------
{t:"abg",q:"Welche drei Schadstoffe wandelt der Drei-Wege-Kat um?",a:["CO, HC und NOx","CO2, H2O und N2","CO, CO2 und O2","Ruß, NOx und SO2"],e:"Es wird zu CO2, H2O und N2 umgewandelt."},
{t:"abg",q:"In welche Stoffe wandelt der Drei-Wege-Kat die Schadstoffe um?",a:["CO2, H2O und N2","HC, NO2 und CO","H2, N2 und CO2","N2, O2 und H2O"],e:"Kohlendioxid, Wasser und Stickstoff."},
{t:"abg",q:"Welcher Abgasbestandteil nimmt durch den geregelten Kat zu?",a:["Kohlendioxid (CO2)","Kohlenmonoxid","Stickoxide","Kohlenwasserstoffe"],e:"CO und HC werden zu CO2 oxidiert."},
{t:"abg",q:"In welchem Bereich arbeitet der Drei-Wege-Kat optimal?",a:["λ = 0,995 bis 1,005 (Lambdafenster)","λ = 0,7 bis 1,3","λ = 1,2 bis 1,5","λ = 0,8 bis 0,9"],e:"Nur in diesem schmalen Fenster werden alle drei Schadstoffe gleichzeitig umgewandelt."},
{t:"abg",q:"Wie hoch ist die maximale Konvertierungsrate eines guten Kats bei Betriebstemperatur?",a:["Ca. 98 %","Ca. 50 %","Ca. 75 %","100 %"],e:"Bis etwa 98–99 %, aber nie 100 %."},
{t:"abg",q:"Welcher Schadstoff hat bei λ = 1 seinen höchsten Rohemissionswert?",a:["NOx","HC","CO","N2"],e:"NOx entsteht bei hohen Verbrennungstemperaturen, die um λ = 1 bis 1,1 am höchsten sind."},
{t:"abg",q:"Woraus besteht das Abgas bei vollkommener Verbrennung unter anderem?",a:["Wasserdampf und Kohlendioxid","Kohlenmonoxid und Kohlendioxid","Kohlenstoff und Stickoxiden","Kohlenwasserstoffen und Kohlendioxid"],e:"Vollkommen verbrannt bleibt H2O und CO2 (plus N2)."},
{t:"abg",q:"Was misst die Lambdasonde?",a:["Den Restsauerstoffgehalt im Abgas","Den CO-Anteil","Die unverbrannten Kohlenwasserstoffe","Den Stickoxidanteil"],e:"Aus dem Restsauerstoff schließt das Steuergerät auf das Gemisch."},
{t:"abg",q:"Wo misst die Vorkat-Lambdasonde?",a:["Im Abgaskrümmer vor dem Katalysator","Im Ansaugkrümmer","Im Endschalldämpfer","Im Brennraum"],e:"Sie misst die Rohemission für die Regelung."},
{t:"abg",q:"Zwischen welchen Spannungen pendelt eine intakte Sprungsonde?",a:["Ca. 100 und 900 mV","Ca. 0 und 5 V","Ca. 2,5 und 3,5 V","Ca. 400 und 600 mV"],e:"Mager ca. 100 mV, fett ca. 800–900 mV, Sollwert ca. 450 mV, ungefähr 1 Hz."},
{t:"abg",q:"Warum arbeitet die Lambdasonde direkt nach dem Kaltstart noch nicht?",a:["Die Keramik wird erst ab ca. 300 °C leitfähig","Weil der Motor noch kein Abgas erzeugt","Weil das Steuergerät sie abschaltet","Weil Kondenswasser sie kurzschließt"],e:"Deshalb haben moderne Sonden eine Heizung. Bis dahin läuft die Steuerung ohne Regelung."},
{t:"abg",q:"Die Nachkatsonde schwingt genauso wie die Vorkatsonde. Was bedeutet das?",a:["Der Kat speichert keinen Sauerstoff mehr – Wirkungsgrad zu gering","Alles in Ordnung","Die Vorkatsonde ist defekt","Das Gemisch ist zu fett"],e:"Ein intakter Kat glättet das Signal. Hinter ihm liegt die Spannung ruhig bei ca. 0,6 V."},
{t:"abg",q:"Eine gealterte Lambdasonde erkennt man an …",a:["zu kleiner Amplitude und zu langsamer Schwingung","zu hoher Spannung","einer konstanten 5-V-Spannung","einer zu schnellen Schwingung"],e:"Ursachen: Ölasche, Silikon, Blei, defekte Heizung."},
{t:"abg",q:"Was zeichnet eine Breitband-Lambdasonde aus?",a:["Sie misst λ stetig über einen großen Bereich (Nernst- und Pumpzelle)","Sie springt nur bei λ = 1","Sie braucht keine Heizung","Sie sitzt nur hinter dem Kat"],e:"Damit kann auch mager oder fett genau geregelt werden."},
{t:"abg",q:"Welche Aufgabe hat das Sekundärluftsystem?",a:["Frischluft hinter die Auslassventile blasen – HC und CO nachverbrennen, Kat schneller warm","NOx senken","Den Kat vor Überhitzung schützen","Den Ladedruck erhöhen"],e:"Nur in der Kaltlaufphase aktiv."},
{t:"abg",q:"Was bewirkt die Abgasrückführung (AGR)?",a:["Sie senkt die Verbrennungsspitzentemperatur und damit NOx","Sie erhöht die Motorleistung","Sie erhöht den NOx-Anteil","Sie senkt den CO2-Ausstoß auf null"],e:"Inertes Abgas bremst die Verbrennung, es wird kühler, weniger Stickoxide."},
{t:"abg",q:"Unter welcher Bedingung blinkt die MI-Lampe?",a:["Bei Verbrennungsaussetzern, die den Katalysator schädigen können","Bei jedem Fehler im Steuergerät","Wenn der Tank fast leer ist","Bei Inspektionsfälligkeit"],e:"Leuchtet = abgasrelevanter Fehler. Blinkt = sofort Gas weg, Kat in Gefahr."},
{t:"abg",q:"Welche Betriebstemperatur hat ein Drei-Wege-Kat ungefähr?",a:["400–800 °C","100–200 °C","1000–1400 °C","Unter 100 °C"],e:"Anspringen ab ca. 300 °C, über ca. 1000 °C thermische Schäden."},
{t:"abg",q:"Welcher Pin des OBD-Steckers ist Batterieplus?",a:["Pin 16","Pin 4","Pin 5","Pin 7"],e:"16 = Plus Kl. 30, 4 = Fahrzeugmasse, 5 = Signalmasse, 6/14 = CAN, 7/15 = K-/L-Leitung."},
{t:"abg",q:"Was ist bei der AU mit OBD KEINE Voraussetzung?",a:["Eine bestandene Hauptuntersuchung","Kein abgasrelevanter Fehler im Speicher","Korrekte Leerlaufdrehzahl","MIL-Status in Ordnung"],e:"Die HU ist eine eigene Prüfung."},
{t:"abg",type:"f",q:"Beschreibe die Aufgaben von Vorkatsonde, Katalysator und Nachkatsonde.",k:["Vorkatsonde: misst Restsauerstoff vor Kat, regelt das Gemisch","Kat: wandelt CO, HC, NOx in CO2, H2O, N2 und speichert Sauerstoff","Nachkatsonde: überwacht den Kat-Wirkungsgrad (OBD)"]},
{t:"abg",type:"f",q:"Beschreibe den Lambda-Regelkreis.",k:["Wenig O2 im Abgas → Sonde ca. 0,8 V (fett)","Steuergerät verkürzt Einspritzzeit → Gemisch magerer","Mehr O2 → Sonde ca. 0,2 V (mager)","Steuergerät verlängert Einspritzzeit → fetter","Ständiges Pendeln um λ = 1"]},
// ---------- Diesel ----------
{t:"dsl",q:"Was macht der Oxidationskatalysator beim Diesel?",a:["Er oxidiert CO und HC zu CO2 und H2O und bildet NO2","Er filtert Rußpartikel","Er reduziert NOx mit Ammoniak","Er speichert Asche"],e:"Das NO2 hilft danach bei der passiven Regeneration des DPF."},
{t:"dsl",q:"Bei welcher Temperatur läuft die passive DPF-Regeneration?",a:["Ca. 350–500 °C","Ca. 100 °C","Ca. 900 °C","Unter 0 °C"],e:"NO2 verbrennt den Ruß laufend, z. B. auf der Autobahn."},
{t:"dsl",q:"Wie erreicht die Motorsteuerung bei der aktiven Regeneration ca. 600 °C?",a:["Durch Nacheinspritzung, AGR aus und angepassten Ladedruck","Durch eine elektrische Heizung im Auspuff","Durch Abschalten der Einspritzung","Durch Kühlen des Abgases"],e:"Der zusätzliche Kraftstoff verbrennt im Oxi-Kat und heizt den Filter."},
{t:"dsl",q:"Mit welchen Sensoren wird die Rußbeladung des DPF ermittelt?",a:["Differenzdrucksensor, Abgastemperatursensor, Luftmassenmesser","Lambdasonde und Klopfsensor","Nur der NOx-Sensor","Kühlmitteltemperatursensor"],e:"Je voller der Filter, desto größer der Druckunterschied vor und nach dem DPF."},
{t:"dsl",q:"Welcher Rückstand im DPF lässt sich nicht verbrennen?",a:["Asche aus Motoröl-Additiven","Ruß","Wasser","Kohlenwasserstoffe"],e:"Deshalb Low-SAPS-Öl und irgendwann DPF tauschen oder reinigen."},
{t:"dsl",q:"Was ist AdBlue?",a:["Eine 32,5-prozentige wässrige Harnstofflösung","Ein Kraftstoffzusatz für mehr Leistung","Destilliertes Wasser","Ein Kühlmittel"],e:"Daraus entsteht im Abgas Ammoniak (NH3) für den SCR-Kat."},
{t:"dsl",q:"Was macht der SCR-Katalysator?",a:["Er reduziert NOx mit Ammoniak zu Stickstoff und Wasser","Er verbrennt Ruß","Er oxidiert CO","Er speichert Schwefel"],e:"SCR = selektive katalytische Reduktion."},
{t:"dsl",q:"Bei welcher Temperatur gefriert AdBlue?",a:["Bei −11 °C","Bei 0 °C","Bei −30 °C","Bei −2 °C"],e:"Darum haben Tank, Pumpe und Leitung Heizungen und das System wird nach dem Abstellen leer gesaugt."},
{t:"dsl",q:"Welche Eigenschaft hat AdBlue?",a:["Es greift Metalle wie Kupfer und Alu an und kristallisiert","Es ist hochentzündlich","Es ist ein Gefahrstoff der Klasse 1","Es ist rot gefärbt"],e:"Verschüttetes AdBlue mit Wasser abwaschen. Schutzbrille tragen."},
{t:"dsl",q:"Was tut der Kunde, wenn die DPF-Leuchte angeht?",a:["Ca. 15 Minuten mit mind. 60 km/h im 4. oder 5. Gang fahren","Sofort den Motor abstellen","AdBlue nachfüllen","Nur noch Kurzstrecke fahren"],e:"Bleibt die Leuchte an: Werkstatt, Service-Regeneration mit Tester."},
{t:"dsl",q:"Warum ist eine Service-Regeneration in der Werkstatt nur im Freien zulässig?",a:["Wegen hoher Abgastemperatur und Abgasen – Brandgefahr","Damit der Motor genug Luft bekommt","Wegen der Lautstärke","Wegen der GPS-Verbindung"],e:"Außerdem: Batterie stützen, Tank mehr als 10 l, Motorabdeckung ab, Feuerlöscher bereit, nicht weggehen."},
{t:"dsl",q:"Wo entstehen Rußpartikel im Dieselmotor?",a:["In Bereichen des Brennraums mit zu wenig Sauerstoff","Nur im Abgaskrümmer","Im Kraftstofffilter","Im Ladeluftkühler"],e:"Innere Gemischbildung: an der Strahlmitte ist es lokal sehr fett."},
{t:"dsl",type:"f",q:"Erkläre den Unterschied zwischen passiver und aktiver DPF-Regeneration.",k:["Passiv: ohne Eingriff, Ruß verbrennt laufend mit NO2","Passiv: bei ca. 350–500 °C, z. B. Autobahn","Aktiv: Motorsteuerung greift ein (Nacheinspritzung, AGR aus)","Aktiv: Abgas wird auf ca. 600 °C erhitzt"]},
{t:"dsl",type:"f",q:"Nenne Voraussetzungen und Sicherheitsmaßnahmen für eine Service-Regeneration.",k:["Im Freien (Abgase, Hitze)","Batterie mit Ladegerät stützen","Tank mehr als 10 l","Motorabdeckung entfernen, Abstand zu Brennbarem","Feuerlöscher bereit, Fahrzeug nicht unbeaufsichtigt","Motor betriebswarm, Start über Diagnosetester"]},

{t:"get",q:"Wie berechnet man das Getriebeausgangsdrehmoment mit Verlusten?",a:["M_G = M_M · η_K · i_G · η_G","M_G = M_M / (i_G · η_G)","M_G = M_M · i_G / η_K","M_G = M_M + i_G · η_G"],e:"Motordrehmoment mal Übersetzung, dann mal Kupplungs- und Getriebewirkungsgrad. Ohne Verluste ist η = 1."},
{t:"get",q:"Wie berechnet man die Getriebeausgangsdrehzahl?",a:["n_G = n_M / i_G","n_G = n_M · i_G","n_G = i_G / n_M","n_G = n_M · i_G · η_G"],e:"i_G = n_M / n_G, also n_G = n_M / i_G."},
{t:"get",q:"Was gilt bei i_G < 1?",a:["M_G < M_M und n_G > n_M: Übersetzung ins Schnelle","M_G > M_M und n_G < n_M: Drehmomentverstärkung","M_G = M_M und n_G = n_M","M_G > M_M und n_G > n_M"],e:"i > 1: mehr Moment, weniger Drehzahl. i = 1: keine Änderung. i < 1: weniger Moment, mehr Drehzahl."},
{t:"get",q:"Warum hat das größere Zahnrad einer Paarung das größere Drehmoment?",a:["Die Zahnflankenkraft F ist an beiden Rädern gleich, der Hebel (Radius) ist größer","Weil es mehr Zähne hat und deshalb schneller dreht","Weil es immer das treibende Rad ist","Weil dort weniger Reibung entsteht"],e:"M = F · r. Gleiche Kraft, größerer Radius → größeres Drehmoment."},
{t:"get",q:"Wie berechnet man die Übersetzung im 1. Gang eines gleichachsigen Getriebes (Konstante z1/z2, Gangpaar z3/z4)?",a:["i_G1 = (z2 · z4) / (z1 · z3)","i_G1 = z2 / z1","i_G1 = (z1 · z3) / (z2 · z4)","i_G1 = (z2 + z4) / (z1 + z3)"],e:"Zwei Zahnradpaarungen: i_G = i1 · i2 = z2/z1 · z4/z3. Nur der direkte Gang hat i = 1."},
{t:"get",q:"Ungleichachsiges Getriebe, 1. Gang: z1 = 11 treibt z2 = 42, n_M = 3000 1/min. Wie groß ist n_G ungefähr?",a:["Ca. 787 1/min","Ca. 11.450 1/min","Ca. 3000 1/min","Ca. 254 1/min"],e:"i = 42/11 ≈ 3,81. n_G = 3000 / 3,81 ≈ 787 1/min."},

{t:"get",q:"Ein Pkw-Motor hat 125 Nm, η_K = 0,99, η_G = 0,96, i im 3. Gang = 1,48. Wie groß ist das Getriebeausgangsdrehmoment?",a:["Ca. 175,8 Nm","Ca. 185 Nm","Ca. 123,75 Nm","Ca. 84,5 Nm"],e:"Eingang: 125 · 0,99 = 123,75 Nm. Ausgang: 123,75 · 1,48 · 0,96 ≈ 175,8 Nm."},

{t:"get",type:"f",q:"Getriebe: Eingang 150 Nm, η = 0,96, n_M = 2900 1/min, 2. Gang z3 = 17 treibt z4 = 36. Berechne i, M_G und n_G.",k:["i = 36 / 17 ≈ 2,12","M_G = 150 · 2,12 · 0,96 ≈ 305,3 Nm","n_G = 2900 / 2,12 ≈ 1368 1/min"]},

{t:"brm",q:"Womit wird die Diagonal-Aufteilung kombiniert, damit das Auto beim Ausfall nicht schief zieht?",a:["Negativer Lenkrollhalbmesser","Positiver Sturz","Große Vorspur","Hinterradantrieb"],e:"Der negative Lenkrollhalbmesser lenkt bei einseitiger Bremskraft gegen."},
