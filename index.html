{t:"brm",q:"Was versteht man unter Fading?",a:["Nachlassen der Bremswirkung durch Erwärmung","Blockieren der Räder","Quietschen der Bremse","Ziehen nach einer Seite"],e:"Belag und Scheibe werden zu heiß, die Reibungszahl sinkt."},
{t:"brm",q:"Welche drei Regelphasen hat das ABS?",a:["Druck aufbauen, Druck halten, Druck abbauen","Bremsen, Lösen, Beschleunigen","Messen, Rechnen, Anzeigen","Pumpen, Kühlen, Entlüften"],e:"Halten: Einlass und Auslass zu. Abbauen: Auslass auf, Rückförderpumpe pumpt zurück."},
{t:"brm",q:"Welche Ventilstellung gilt bei der ABS-Phase Druck halten?",a:["Einlassventil zu, Auslassventil zu","Einlass offen, Auslass zu","Einlass zu, Auslass offen","Beide offen"],e:"Der Druck im Radzylinder bleibt eingesperrt."},
{t:"brm",q:"In welchem Schlupfbereich regelt das ABS?",a:["Ca. 8 bis 35 %","0 bis 2 %","50 bis 80 %","100 %"],e:"Darunter wird zu wenig gebremst, darüber blockiert das Rad."},
{t:"brm",q:"Warum kann ein ABS-Bremsweg manchmal länger sein?",a:["ABS regelt auf Lenkbarkeit und nutzt nicht die volle Bremskraft","Weil ABS die Bremse abschaltet","Weil die Pumpe zu langsam ist","Das stimmt nie"],e:"Lenkoptimaler Schlupf ist kleiner als bremsoptimaler Schlupf."},
{t:"brm",q:"Was verhindert ASR?",a:["Das Durchdrehen der Antriebsräder","Das Blockieren beim Bremsen","Das Schleudern in der Kurve","Das Wegrollen am Berg"],e:"Über Bremseingriff und Motormoment-Reduzierung."},
{t:"brm",q:"Welches Rad bremst das ESP, wenn das Fahrzeug untersteuert?",a:["Das kurveninnere Hinterrad","Das kurvenäußere Vorderrad","Beide Vorderräder","Alle Räder gleich"],e:"Bei Übersteuern wird das kurvenäußere Vorderrad gebremst."},
{t:"brm",q:"Welcher Sensor ist typisch für das ESP, aber nicht für das ABS?",a:["Drehratensensor (Gierrate)","Raddrehzahlsensor","Bremslichtschalter","Bremsflüssigkeitsstand"],e:"ESP braucht zusätzlich Lenkwinkel, Gierrate und Querbeschleunigung."},
{t:"brm",q:"Welchen Vorteil hat ein aktiver Raddrehzahlsensor gegenüber einem induktiven?",a:["Er misst schon ab ca. 0,1 km/h und erkennt die Drehrichtung","Er braucht keine Spannungsversorgung","Er liefert ein Sinussignal","Er ist größer und robuster"],e:"Aktiv (Hall/magnetoresistiv) = Rechtecksignal, Amplitude unabhängig von der Drehzahl."},
{t:"brm",q:"Welche Signalform liefert ein intakter aktiver Raddrehzahlsensor?",a:["Rechtecksignal","Sinus mit Lücke","Verrauschtes Signal","Gleichspannung 12 V"],e:"Sinus mit Lücke ist ein induktiver Kurbelwellensensor."},
{t:"brm",q:"Ein Raddrehzahlsensor fällt aus. Warum stehen auch Fehler in EPB-, Getriebe- und Motorsteuergerät?",a:["Das Raddrehzahlsignal wird über CAN an andere Steuergeräte verteilt","Weil alle denselben Stecker haben","Weil die Batterie leer ist","Das ist ein Zufall"],e:"Folgefehler: Mehrere Systeme nutzen dasselbe Signal."},
{t:"brm",q:"Pedalkraft 400 N, Hebel r1 = 260 mm, r2 = 50 mm. Wie groß ist die Kolbenstangenkraft?",a:["2080 N","400 N","77 N","5200 N"],e:"i = 260 / 50 = 5,2. F = 400 N · 5,2 = 2080 N."},
{t:"brm",q:"Welche Bauteile hat eine hydraulische Bremsanlage?",a:["Bremspedal, Tandem-Hauptzylinder, Leitungen, Radbremszylinder","Kompressor, Luftbehälter, Membranzylinder","Seilzug und Hebel","Pumpe und Turbine"],e:"Das andere ist eine Druckluftbremse bzw. Feststellbremse."},
{t:"brm",type:"f",q:"Beschreibe die drei Phasen des ABS-Regelkreises.",k:["Druckaufbau: Einlass offen, Auslass zu, Druck vom Hauptzylinder zum Rad","Druck halten: Einlass zu, Auslass zu (Rad droht zu blockieren)","Druckabbau: Einlass zu, Auslass offen, Rückförderpumpe pumpt zurück"]},
{t:"brm",type:"f",q:"Nenne die Aufgaben von ABS, ASR und ESP.",k:["ABS: Blockieren verhindern, lenkbar und stabil bleiben","ASR: Durchdrehen der Antriebsräder verhindern","ESP: Schleudern verhindern durch Abbremsen einzelner Räder und Motoreingriff"]},
// ---------- Fahrwerk ----------
{t:"fw",q:"Was ist der Sturz?",a:["Neigung des Rades zur Senkrechten, von vorne gesehen","Neigung der Lenkachse in Längsrichtung","Differenz der Radabstände vorn und hinten","Abstand zwischen Lenkachse und Radmitte"],e:"Oben nach außen = positiver Sturz, oben nach innen = negativer Sturz."},
{t:"fw",q:"Was ist ein positiver Nachlauf?",a:["Der Durchstoßpunkt der Lenkachse liegt vor dem Radaufstandspunkt","Das Rad ist oben nach außen geneigt","Die Räder stehen vorn enger","Die Lenkachse ist quer geneigt"],e:"Das Rad wird gezogen wie beim Einkaufswagen, das gibt Geradeauslauf."},
{t:"fw",q:"Wodurch entstehen die Rückstellkräfte an der Lenkung?",a:["Durch Nachlauf und Spreizung","Durch Sturz und Vorspur","Durch Radstand und Spurweite","Durch die Servolenkung"],e:"Bei der Spreizung wird das Fahrzeug beim Einlenken leicht angehoben."},
{t:"fw",q:"Was bedeutet Vorspur?",a:["Die Räder stehen vorn enger als hinten (l2 − l1 > 0)","Die Räder stehen vorn weiter als hinten","Das Rad ist oben nach innen geneigt","Die Hinterachse läuft schräg"],e:"Gemessen am Felgenhorn in Höhe der Radmitte."},
{t:"fw",q:"Was ist der Spurdifferenzwinkel?",a:["Der Winkel, um den das kurveninnere Rad stärker eingeschlagen wird","Der Unterschied zwischen links und rechts beim Sturz","Der Winkel zwischen Vorder- und Hinterachse","Der Schräglaufwinkel"],e:"Durch das Lenktrapez. Gemessen bei 20° Einschlag."},
{t:"fw",q:"Welche Auswirkung hat ein negativer Lenkrollhalbmesser?",a:["Er stabilisiert bei einseitiger Bremskraft (Rad lenkt gegen)","Das Fahrzeug zieht zur stärker gebremsten Seite","Er erhöht die Lenkkraft im Stand stark","Er verursacht Flattern"],e:"Positiv: Auto zieht zur stärker gebremsten Seite."},
{t:"fw",q:"Was ändert sich, wenn man Felgen mit anderer Einpresstiefe (größere Spurweite) montiert?",a:["Der Lenkrollhalbmesser","Der Nachlauf","Der Radstand","Die Gierrate"],e:"Die Radmitte wandert nach außen, die Lenkachse bleibt."},
{t:"fw",q:"Was bestimmt bei der Vierrad-Vermessung die geometrische Fahrachse?",a:["Die Hinterachse","Die Vorderachse","Das Lenkrad","Die Karosserie"],e:"Die Vorderachse wird auf die Fahrachse ausgerichtet, damit das Lenkrad gerade steht."},
{t:"fw",q:"Was muss vor der Achsvermessung gemacht werden?",a:["Reifendruck korrigieren, Fahrzeug in Konstruktionslage bringen, Felgenschlag kompensieren","Öl wechseln","Bremsflüssigkeit tauschen","Die Batterie abklemmen"],e:"Auch Lenkradfeststeller und Bremspedalfeststeller setzen."},
{t:"fw",q:"Warum macht man eine Felgenschlagkompensation?",a:["Weil ein Schlag der Felge oder Halterung die Messwerte verfälschen würde","Damit der Reifen rund läuft","Um die Unwucht auszugleichen","Um den Reifendruck zu prüfen"],e:"Erst danach sind Spur und Sturz richtig messbar."},
{t:"fw",q:"Welche Lenkungsbauart ist im Pkw üblich?",a:["Achsschenkellenkung mit Zahnstangenlenkgetriebe","Drehschemellenkung","Knicklenkung","Kettenlenkung"],e:"Das Zahnstangengetriebe wandelt die Drehung in eine Schubbewegung."},
{t:"fw",q:"Was macht eine Servotronic?",a:["Die Lenkunterstützung nimmt mit steigender Geschwindigkeit ab","Sie lenkt das Fahrzeug selbst","Sie verringert den Wendekreis","Sie misst den Reifendruck"],e:"Im Stand leicht, bei hohem Tempo straffer."},
{t:"fw",q:"Welches Bauteil erfasst bei der elektrischen Servolenkung den Lenkwunsch?",a:["Drehmomentsensor am Torsionsstab","Lenkwinkelsensor am Rad","Raddrehzahlsensor","Gaspedalsensor"],e:"Daraus, aus Geschwindigkeit und Drehzahl berechnet das Steuergerät die Unterstützung."},
{t:"fw",q:"Was ist typisch für eine McPherson-Achse?",a:["Federbein mit nur einem unteren Querlenker","Starre Achse mit Blattfedern","Fünf Lenker","Querträger zwischen zwei Längslenkern"],e:"Das Federbein übernimmt die Radführung oben."},
{t:"fw",q:"Welche Achse wird oft als Hinterachse bei Fronttrieblern verbaut?",a:["Verbundlenkerachse","Starrachse mit Ausgleichsgetriebe","McPherson-Achse","De-Dion-Achse"],e:"Querträger und Längslenker, wirkt teils wie ein Stabilisator."},
{t:"fw",q:"Wozu dient der U-Stabilisator?",a:["Er verringert die Seitenneigung in Kurven","Er dämpft Schwingungen","Er stellt die Spur ein","Er trägt das Fahrzeuggewicht"],e:"Er verdreht sich bei einseitigem Einfedern."},
{t:"fw",q:"Welchen Vorteil hat ein Einrohr-Gasdruckdämpfer?",a:["Bessere Wärmeabfuhr und beliebige Einbaulage","Geringerer Gasdruck","Billiger","Er braucht kein Öl"],e:"Ein Trennkolben trennt Öl und Gas (ca. 25–30 bar)."},
{t:"fw",q:"Was ist Untersteuern?",a:["Das Fahrzeug schiebt über die Vorderräder und fährt eine größere Kurve","Das Heck bricht aus","Das Fahrzeug fährt genau die gelenkte Kurve","Das Fahrzeug nickt beim Bremsen"],e:"Übersteuern = Heck bricht aus, kleinere Kurve."},
{t:"fw",q:"Um welche Achse bewegt sich das Fahrzeug beim Nicken?",a:["Um die Querachse","Um die Hochachse","Um die Längsachse","Gar nicht"],e:"Hochachse = Gieren, Längsachse = Wanken."},
{t:"fw",q:"Sollwert Sturz −1°30' ±0°30'. Welcher Bereich ist zulässig?",a:["−2°00' bis −1°00'","−1°30' bis −1°00'","−2°30' bis −0°30'","−1°00' bis 0°00'"],e:"1° = 60'. −1°30' minus 30' = −2°00', plus 30' = −1°00'."},
{t:"fw",type:"f",q:"Nenne vier Anlässe für eine Achsvermessung.",k:["Nach Unfall oder Bordsteinkontakt","Nach Arbeiten an Lenkung/Achse (Spurstangen, Querlenker)","Ungleichmäßiger Reifenverschleiß","Fahrzeug zieht oder Lenkrad steht schief","Nach Tieferlegung / Fahrwerksumbau"]},
{t:"fw",type:"f",q:"Erkläre Sturz, Spreizung und Nachlauf.",k:["Sturz: Neigung des Rades zur Senkrechten von vorn","Spreizung: Neigung der Lenkachse quer zur Fahrzeuglängsachse","Nachlauf: Neigung der Lenkachse in Längsrichtung, Lenkpunkt vor Radaufstand","Spreizung und Nachlauf erzeugen Rückstellkräfte"]},
// ---------- CAN & LIN ----------
{t:"can",q:"Mit welcher Datenrate arbeitet der Antriebs-CAN meist?",a:["500 kBit/s","20 kBit/s","100 kBit/s","22,5 MBit/s"],e:"LIN bis 20 kBit/s, Komfort-CAN 100 kBit/s, MOST ca. 22,5 MBit/s."},
{t:"can",q:"Warum ist der Antriebs-CAN schneller als der Komfort-CAN?",a:["Motor, ABS und Getriebe brauchen sicherheitsrelevante Echtzeitdaten","Weil er weniger Steuergeräte hat","Weil er eindrahtfähig ist","Weil er Lichtwellenleiter nutzt"],e:"Komfortfunktionen sind zeitunkritisch, dafür eindrahtfähig."},
{t:"can",q:"Was passiert beim Komfort-CAN, wenn eine Leitung unterbrochen ist?",a:["Er arbeitet im Eindrahtbetrieb weiter und speichert einen Fehler","Der ganze Bus fällt aus","Das Fahrzeug springt nicht an","Nichts, es gibt keinen Fehlereintrag"],e:"Der Kunde merkt oft nichts. Trotzdem reparieren, denn beim zweiten Fehler fällt alles aus."},
{t:"can",q:"Welchen Widerstand misst man zwischen CAN-High und CAN-Low bei intakten Abschlusswiderständen?",a:["Ca. 60 Ω","Ca. 120 Ω","Ca. 240 Ω","0 Ω"],e:"Zwei 120-Ω-Widerstände parallel = 60 Ω."},
{t:"can",q:"Wozu dienen die Abschlusswiderstände am CAN-Bus?",a:["Sie verhindern Signalreflexionen am Leitungsende","Sie begrenzen den Strom der Steuergeräte","Sie wecken den Bus auf","Sie bestimmen die Priorität"],e:"Außerdem sorgen sie für einen definierten Ruhepegel."},
{t:"can",q:"Warum sind CAN-Leitungen verdrillt?",a:["Störungen wirken auf beide Leitungen gleich, das Differenzsignal bleibt erhalten","Damit sie flexibler sind","Damit sie kürzer sind","Wegen der Farbe"],e:"Auch die Abstrahlung (EMV) wird kleiner."},
{t:"can",q:"Wie lang darf eine CAN-Leitung bei der Reparatur höchstens unverdrillt sein?",a:["Ca. 50 mm","Ca. 5 mm","Ca. 500 mm","Beliebig"],e:"Schlaglänge der Verdrillung ca. 20 mm, max. 50 mm offen."},
{t:"can",q:"Welche Pegel hat der High-Speed-CAN (CAN-C) im rezessiven Zustand?",a:["CAN-High und CAN-Low je 2,5 V","High 3,5 V, Low 1,5 V","High 0 V, Low 5 V","Beide 12 V"],e:"Dominant (logisch 0): High 3,5 V, Low 1,5 V."},
{t:"can",q:"Welcher Zustand setzt sich auf dem Bus durch, wenn gleichzeitig dominant und rezessiv gesendet wird?",a:["Dominant (logisch 0)","Rezessiv (logisch 1)","Keiner, der Bus stürzt ab","Der lauteste"],e:"Darauf beruht die Arbitrierung."},
{t:"can",q:"Was regelt die Arbitrierung?",a:["Welches Steuergerät senden darf, wenn mehrere gleichzeitig senden wollen","Die Datenrate","Die Abschlusswiderstände","Den Sleep-Modus"],e:"Die Botschaft mit dem niedrigsten Identifier hat Vorrang."},
{t:"can",q:"Welche Aufgaben hat das Gateway?",a:["Es verbindet Bussysteme verschiedener Geschwindigkeit und ist die Diagnoseschnittstelle","Es lädt die Batterie","Es misst die Abschlusswiderstände","Es ist nur ein Stecker"],e:"Es übersetzt Botschaften und steuert Wake-up und Sleep."},
{t:"can",q:"Was bedeutet Transceiver?",a:["Sender und Empfänger in einem Baustein","Speicher für Fehlercodes","Ein Abschlusswiderstand","Ein Lichtwellenleiter"],e:"Transmitter + Receiver. Er wandelt die Controllersignale in Buspegel."},
{t:"can",q:"Welches Feld einer CAN-Botschaft legt die Priorität fest?",a:["Das Statusfeld (Identifier)","Das Datenfeld","Das Sicherungsfeld (CRC)","Das Endefeld"],e:"Der Identifier (11 Bit) nennt Inhalt und Priorität."},
{t:"can",q:"Wie hoch ist der rezessive Pegel beim LIN-Bus?",a:["Ca. Batteriespannung (12 V)","2,5 V","0 V","5 V"],e:"Dominant = 0 V."},
{t:"can",q:"Wie ist der LIN-Bus organisiert?",a:["Eindraht, ein Master und mehrere Slaves","Zweidraht, alle gleichberechtigt","Lichtwellenleiter im Ring","Funk"],e:"Der Master sendet den Header, der Slave antwortet mit der Response."},
{t:"can",q:"Das LIN-Signal liegt dauerhaft auf 0 V. Was ist wahrscheinlich?",a:["Kurzschluss nach Masse","Alles in Ordnung","Kurzschluss nach Plus","Der Slave antwortet zu schnell"],e:"Dauerhaft 12 V deutet auf Unterbrechung oder Kurzschluss nach Plus."},
{t:"can",q:"Was ist der Sleep-Modus beim CAN?",a:["Inaktiver Zustand des Busses, um Ruhestrom zu sparen","Eine Fehlerart","Der Eindrahtbetrieb","Der Diagnosebetrieb"],e:"Bei Bedarf weckt eine Botschaft die Teilnehmer."},
{t:"can",q:"Dezimal 3 ist im Dualsystem …",a:["011","110","101","003"],e:"0·4 + 1·2 + 1·1 = 3."},
{t:"can",q:"Was ist ein Vorteil der Vernetzung?",a:["Sensorsignale können mehrfach genutzt werden, weniger Leitungen","Mehr Steckverbindungen","Höheres Gewicht","Diagnose wird unmöglich"],e:"Weniger Kabel, weniger Gewicht, weniger Kosten, zentrale Diagnose."},
{t:"can",type:"f",q:"Nur das Türsteuergerät Fahrerseite meldet Eindrahtbetrieb, alle anderen sind i. O. Was ist die Ursache und wie gehst du vor?",k:["Unterbrechung oder Kontaktfehler einer CAN-Leitung zum Türsteuergerät","Oszilloskop am Stecker: CAN-High und CAN-Low prüfen","Leitung messen (Durchgang)","Reparieren: max. 50 mm unverdrillt, Herstellervorgabe","Fehlerspeicher löschen, Funktion prüfen"]},
{t:"can",type:"f",q:"Warum muss ein Komfort-CAN-Fehler repariert werden, obwohl der Kunde nichts merkt?",k:["Keine Redundanz mehr","Beim zweiten Fehler fällt der Bus aus","Störanfälliger (EMV)","Fehlerspeichereinträge bleiben"]},
// ---------- Airbag ----------
{t:"air",q:"Was brauchst du, um an pyrotechnischen Systemen arbeiten zu dürfen?",a:["Einen Sachkundenachweis (Lehrgang nach Sprengstoffrecht)","Nur den Gesellenbrief","Einen HV-Schein","Nichts Besonderes"],e:"Zusätzlich Herstellerschulung und Volljährigkeit."},
{t:"air",q:"Warum darfst du an einer Zündpille keinen Widerstand messen?",a:["Der Messstrom des Ohmmeters kann die Zündpille auslösen","Weil sie zu hochohmig ist","Weil das Messgerät kaputt geht","Weil sie keinen Widerstand hat"],e:"Gemessen wird nur mit Adapter am Kabelbaum bei abgezogenem Steuergerät und Airbag."},
{t:"air",q:"Welche Aufgabe hat die Kurzschlussbrücke im Airbagstecker?",a:["Sie verhindert ungewollte Auslösung durch statische Aufladung oder Fremdspannung","Sie verbindet den Airbag mit Plus","Sie misst den Widerstand","Sie ist nur eine Halterung"],e:"Beim Abziehen werden die Pole der Zündpille kurzgeschlossen."},
{t:"air",q:"Wie lagerst du eine ausgebaute Airbag-Einheit?",a:["Mit der Austrittsfläche (Polster) nach oben","Mit dem Polster nach unten","Im Kofferraum","Auf der Heizung"],e:"Löst sie aus, fliegt sie nicht weg."},
{t:"air",q:"Was gehört zur aktiven Sicherheit?",a:["Neutrales Fahrverhalten und große Bremsverzögerung","Airbag und Gurtstraffer","Knautschzone","Sicherheitslenksäule"],e:"Aktiv = Unfälle vermeiden. Passiv = Unfallfolgen mindern."},
{t:"air",q:"Was gehört zur passiven Sicherheit?",a:["Knautschzone und stabile Fahrgastzelle","ABS","Heizbare Scheiben","ESP"],e:"Airbag, Gurt, Gurtstraffer, Sicherheitslenkung, Knautschzone."},
{t:"air",q:"Wie soll die Fahrgastzelle bei einem Frontalaufprall sein?",a:["Möglichst steif","Möglichst weich","Leicht verformbar","Egal"],e:"Die Knautschzone davor nimmt Energie auf, die Zelle schützt den Überlebensraum."},
{t:"air",q:"Wozu dient eine Sicherheitslenkung?",a:["Sie verhindert, dass die Lenksäule bei einem Frontalaufprall in den Innenraum dringt","Sie lenkt selbst","Sie dämpft Lenkradvibrationen","Sie hält das Lenkrad warm"],e:"Teleskop- oder Knickelemente in der Lenksäule."},
{t:"air",q:"Welche Vorsichtsmaßnahme gilt beim Anklemmen der Batterie nach Airbagarbeiten?",a:["Zündung ein und niemand im Innenraum","Airbag vorher ausbauen","Motor laufen lassen","Gurt anlegen"],e:"Falls der Airbag fehlerhaft auslöst, ist niemand gefährdet."},
{t:"air",q:"Was messen Crashsensoren?",a:["Die Fahrzeugverzögerung bzw. die Druckänderung in der Tür","Die Geschwindigkeit","Den Reifendruck","Die Sitzheizung"],e:"Sie melden die Werte an das Airbagsteuergerät."},
{t:"air",q:"Was muss bei einem Pre-Crash-System nach einer Auslösung NICHT erneuert werden?",a:["Reversible Gurtstraffer","Pyrotechnische Gurtstraffer","Ausgelöste Airbags","Das ausgelöste Steuergerät"],e:"Reversibel = elektrisch, kann mehrfach straffen."},
{t:"air",type:"f",q:"Wie setzt du ein Airbagsystem vor Arbeiten außer Betrieb?",k:["Zündung aus","Batterie abklemmen und Pol isolieren","Wartezeit (Energiereserve im Steuergerät)","Sich elektrostatisch entladen (Masse berühren)"]},
{t:"air",type:"f",q:"Nenne mögliche Ursachen für eine dauerhaft leuchtende Airbagkontrollleuchte.",k:["Unterbrechung im Zündkreis / Kabelbruch","Steckverbindung (z. B. unter dem Sitz) locker oder korrodiert","Wickelfeder defekt","Crashsensor defekt","Unterspannung / Versorgung fehlerhaft","Steuergerät defekt"]},
// ---------- Elektrik & Diagnose ----------
{t:"ele",q:"Über einer intakten Plusleitung misst du den Spannungsfall. Was erwartest du?",a:["Ca. 0 V","Die volle Batteriespannung","5 V","Einen sehr hohen Widerstand"],e:"Liegt die volle Spannung über der Leitung an, ist sie unterbrochen."},
{t:"ele",q:"Spannungsversorgung am Steuergerät 5 V, am Sensor 0 V, Spannungsfall über der Plusleitung 5 V. Was liegt vor?",a:["Unterbrechung der Plusleitung","Kurzschluss nach Masse am Sensor","Defektes Steuergerät","Alles in Ordnung"],e:"Die ganze Spannung fällt über der Leitung ab, also ist sie offen."},
{t:"ele",q:"Das Multimeter zeigt bei der Widerstandsmessung einer Leitung O.L. an. Was bedeutet das?",a:["Die Leitung ist unterbrochen (offen)","Die Leitung ist in Ordnung","Kurzschluss","Das Messgerät ist kaputt"],e:"O.L. = Overload/Open Loop, unendlicher Widerstand. Eine gute Leitung hat unter 0,5 Ω."},
{t:"ele",q:"Unter welcher Bedingung misst du einen Widerstand?",a:["Stromlos, Bauteil abgeklemmt","Bei laufendem Motor","Unter Last","Mit eingeschalteter Zündung"],e:"Sonst verfälscht die Fremdspannung das Ergebnis oder das Messgerät nimmt Schaden."},
{t:"ele",q:"Warum stützt du die Batterie bei einer längeren Diagnose mit einem Ladegerät?",a:["Damit Unterspannung keine Fehler oder Abbrüche beim Codieren verursacht","Damit die Batterie neu wird","Damit der Motor schneller startet","Das ist nicht nötig"],e:"Gerade beim Flashen von Steuergeräten kann Unterspannung teuer werden."},
{t:"ele",q:"Wie kannst du einen Sensorfehler ohne Messgerät eingrenzen?",a:["Sensoren über Kreuz tauschen und schauen, ob der Fehler mitwandert","Fehlerspeicher löschen und hoffen","Sicherungen tauschen","Batterie abklemmen"],e:"Wandert der Fehler mit, ist der Sensor defekt."},
{t:"ele",q:"Was gehört zum Abschluss einer Reparatur?",a:["Fehlerspeicher löschen, Probefahrt, erneut auslesen, dokumentieren","Nur die Rechnung schreiben","Das Fahrzeug waschen","Die Batterie abklemmen"],e:"So stellst du sicher, dass der Fehler wirklich weg ist."},
{t:"ele",q:"Welche Spannung liegt als Referenz an vielen Sensoren an?",a:["5 V","12 V","24 V","1,5 V"],e:"Das Steuergerät versorgt Sensoren oft mit stabilisierten 5 V."},
{t:"ele",q:"Warum verwendet man im HV-Bereich hohe Spannungen?",a:["Bei gleicher Leistung fließt weniger Strom – dünnere Kabel, weniger Verluste","Weil es sicherer ist","Weil die Batterie dann kleiner ist","Wegen der Klimaanlage"],e:"P = U · I. Verlustleistung P = I² · R sinkt stark."},

{t:"w24",n:1,pts:2,type:"gap",q:"Mehrere {1} beschließen für ihre {2} bestimmte {3}, obwohl dies in der EU verboten ist, da es sich um eine {4} handelt.",gaps:[["Unternehmen","Arbeitnehmer","Auszubildende"],["Erzeugnisse","Kollegen"],["Mindestpreise","Gehälter","Höchstpreise","Maßnahmen"],["Kartellabsprache","Fusion","Interessengemeinschaft","Monopol","Oligopol"]],e:"Preisabsprachen zwischen Unternehmen sind ein verbotenes Kartell. Das Bundeskartellamt geht dagegen vor."},

{t:"hv",q:"Welche Messkategorie muss der Spannungsprüfer für HV-Fahrzeuge mindestens haben?",a:["CAT III","CAT I","CAT 0","Keine, jede ist gut"],e:"Zweipoliger Spannungsprüfer (z. B. DUSPOL) mit mindestens CAT III und Prüfzeichen."},
{t:"hv",q:"Wozu gehört ein Rettungsstab zur HV-Ausrüstung?",a:["Um einen Kollegen gefahrlos von spannungsführenden Teilen wegzuziehen","Um den Service-Stecker zu ziehen","Zum Messen der Spannung","Zum Abschleppen"],e:"Nie einen Verunglückten mit bloßen Händen anfassen, solange er unter Spannung steht."},
{t:"hv",q:"Was steht auf dem Schild nach Feststellen der Spannungsfreiheit?",a:["Warnung vor gefährlicher Spannung, Verbot Wiedereinschalten und die verantwortliche Person","Nur das Datum","Der Kilometerstand","Die Batteriespannung"],e:"Das Schild nennt, wer verantwortlich ist. Nur diese Person darf das Fahrzeug wieder in Betrieb nehmen."},
{t:"hv",q:"Wann dürfen die Sicherheitsregeln 4 (Erden) und 5 (Abdecken) entfallen?",a:["Wenn Regeln 1–3 vollständig erfüllt sind und die Spannung unter 1000 V liegt","Immer bei Benzinern","Wenn es schnell gehen muss","Nie"],e:"Bei HV-Fahrzeugen unter 1000 V ohne benachbarte aktive Teile entfallen 4 und 5 meist."},
{t:"hv",q:"Was ist eine diagnostische Freischaltung?",a:["Das Diagnosegerät öffnet die Schütze und prüft die Zwischenkreisspannung automatisch","Freischalten durch Ziehen aller Sicherungen","Abklemmen der 12-V-Batterie","Messung des Isolationswiderstands"],e:"Manuell messen muss man, wenn der Hersteller es verlangt oder die Diagnose nicht geht (z. B. Unfallauto)."},
{t:"hv",q:"Welche Arbeit darf ein Azubi im 1. Lehrjahr nach HV-Unterweisung machen?",a:["Räder wechseln und Inspektion","Spannung an der HV-Batterie messen","HV-System freischalten","Service-Stecker ziehen"],e:"Allgemeine Arbeiten ohne HV-Bezug ja. Alles am HV-System ist 2S."},
{t:"hv",q:"Was ist bei der Inbetriebnahme nach dem Freischalten der richtige letzte Schritt?",a:["Zündung ein, HV-Status prüfen, Fehlerspeicher auslesen, ggf. Probefahrt","Weißes Schild aufhängen","Service-Stecker ziehen","Handschuhe ausziehen und gehen"],e:"Vorher: Messpunkt schließen, Wartungsstecker stecken, rotes Schild statt weißem, 12-V-Batterie an."},
{t:"hv",q:"Welches Schild hängt nach dem Einstecken des Wartungssteckers wieder an der Scheibe?",a:["Das rote (nicht spannungsfrei)","Das weiße (spannungsfrei)","Beide","Keins"],e:"Sobald der Wartungsstecker steckt, ist das System nicht mehr spannungsfrei."},
{t:"hv",q:"Was versteht man unter One-Pedal-Driving?",a:["Beim Gaswegnehmen verzögert das Auto durch starke Rekuperation bis zum Stillstand","Fahren nur mit dem Bremspedal","Ein Pedal für Kupplung und Bremse","Automatisches Einparken"],e:"Das Bremspedal braucht man dann fast nur noch für Notbremsungen."},
{t:"hv",q:"Wofür steht ASS bei Start-Stopp?",a:["Automatische Start-Stopp-Funktion: Motor stoppt im Stand automatisch","Antriebsschlupfsteuerung","Aktive Sitzsteuerung","Abgas-Sekundär-System"],e:"Das ist die Grundfunktion schon beim Micro-Hybrid."},
{t:"hv",type:"f",q:"Nenne die Arbeitsmittel, die du zum Freischalten eines HV-Fahrzeugs brauchst.",k:["HV-Handschuhe Klasse 0 (geprüft)","Zweipoliger Spannungsprüfer mind. CAT III","Schutzbrille, ggf. Helm mit Visier","Rotes und weißes Schild, Absperrung","Schlossbox für Wartungsstecker und Schlüssel","Isoliertes Werkzeug, Rettungsstab"]},
{t:"hv",type:"f",q:"Beschreibe die Wiederinbetriebnahme nach dem Freischalten (Schritte).",k:["Messpunkt schließen","Handschuhe prüfen und anziehen, Schutzbrille","Wartungsstecker einstecken","Rotes Schild statt weißem","12-V-Batterie anschließen","Zündung ein, HV-Status prüfen, Fehlerspeicher lesen, ggf. Probefahrt"]},
// ================= Hochvolt-Technik & Laden (0104, 0120, 0126–0135, 0253–0270) =================
{t:"hvt",q:"Eine 21-W-Lampe hängt an 24 V statt 12 V. Wie ändert sich der Strom?",a:["Er halbiert sich von 1,75 A auf 0,875 A","Er verdoppelt sich auf 3,5 A","Er bleibt bei 1,75 A","Er sinkt auf 0,44 A"],e:"I = P / U: 21 / 12 = 1,75 A, 21 / 24 = 0,875 A."},
{t:"hvt",q:"Wie hoch ist die Ladeschlussspannung einer Li-Ionen-Zelle ungefähr?",a:["Ca. 4,1–4,2 V","Ca. 2,4 V","Ca. 3,0 V","Ca. 12 V"],e:"Nennspannung 3,6–3,7 V, voll geladen ca. 4,2 V."},
{t:"hvt",q:"Welche Zellchemie hat die höchste Energiedichte?",a:["Lithium-Ionen (ca. 90–250 Wh/kg)","Blei (ca. 30 Wh/kg)","NiMH (ca. 80 Wh/kg)","Alle gleich"],e:"Li-Ion: hohe Energiedichte, kein Memory-Effekt. NiMH nutzte z. B. der ältere Prius."},
{t:"hvt",q:"Was bedeuten SoC und SoH?",a:["SoC = Ladezustand, SoH = Alterungszustand der Batterie","SoC = Spannung, SoH = Strom","SoC = Sicherheitslinie, SoH = Hochvolt","SoC = Steuergerät, SoH = Heizung"],e:"State of Charge und State of Health. Beides rechnet das BMS aus und zeigt der Tester an."},
{t:"hvt",q:"Welchen Vorteil hat ein Schütz (Relais) gegenüber einem Transistor als Schalter?",a:["Vollständige galvanische Trennung und hoch überlastbar","Es schaltet schneller","Es verschleißt nicht","Es ist geräuschlos"],e:"Darum trennen Schütze die HV-Batterie. Nachteil: Kontaktverschleiß, träge, Geräusch."},
{t:"hvt",q:"Welchen Nachteil hat ein Transistor als Schalter?",a:["Keine galvanische Trennung, empfindlich gegen Überspannung und Hitze","Er verschleißt mechanisch","Er ist sehr laut","Er schaltet sehr langsam"],e:"Vorteile: schnell, verschleißfrei, geräuschlos, regelbar."},
{t:"hvt",q:"Wie viele IGBTs hat eine B6-Brücke im Inverter?",a:["6","3","2","12"],e:"Je Phase U, V, W zwei IGBTs (oben und unten)."},
{t:"hvt",q:"Wie misst der Resolver die Rotorlage?",a:["Berührungslos induktiv","Mit einem Schleifkontakt","Optisch mit Kamera","Über die Batteriespannung"],e:"Er liefert Winkel, Drehzahl und Drehrichtung an den Inverter."},
{t:"hvt",q:"Wie entlädt sich der Zwischenkreiskondensator beim Abschalten?",a:["Über Entladewiderstände: aktiv schnell über Entladeschütz, passiv dauerhaft parallel","Gar nicht, er bleibt geladen","Über die 12-V-Batterie","Über die Potenzialausgleichsleitung"],e:"Trotzdem Wartezeit nach Herstellervorgabe einhalten."},
{t:"hvt",q:"Wozu dient der aktive Kurzschluss (Kurzschlussschütz) an der E-Maschine?",a:["Er verhindert, dass die drehende Permanentmagnet-Maschine gefährliche Spannung induziert","Er lädt die Batterie schneller","Er misst die Isolation","Er schaltet die Klimaanlage ab"],e:"Eine drehende PM-Maschine ist ein Generator. Beim Abschleppen deshalb Antriebsachse anheben."},
{t:"hvt",q:"Wie ist der DC/DC-Wandler aufgebaut?",a:["Inverter (DC → AC), Transformator, Gleichrichter (AC → DC), Glättung","Nur ein Vorwiderstand","Ein Schütz und eine Sicherung","Eine Diode"],e:"Der Transformator trennt HV- und 12-V-Netz galvanisch. Ergebnis z. B. 400 V → 14,4 V."},
{t:"hvt",q:"Welche Spannung misst du bei Ready an der 12-V-Batterie eines Hybrids?",a:["Ca. 14,2 V (Ladung über DC/DC-Wandler)","Ca. 12,0 V","Ca. 48 V","Ca. 400 V"],e:"Der DC/DC-Wandler ersetzt die Lichtmaschine und lädt das Bordnetz."},
{t:"hvt",q:"Mit welcher Spannung arbeitet die Pilotlinie (Interlock)?",a:["Mit 5 oder 12 V als Ringleitung","Mit Hochvolt","Mit 230 V","Gar keiner, sie ist nur mechanisch"],e:"Die Schleife läuft durch alle HV-Stecker und Deckel. Unterbrechung → Schütze öffnen."},
{t:"hvt",q:"Welche HV-Leitung hat den größten Querschnitt?",a:["Die Phasenleitungen U/V/W zur E-Maschine (z. B. 35 mm²)","Die Leitung zum Klimakompressor (z. B. 4 mm²)","Die Pilotlinie","Die CAN-Leitung"],e:"Beispiel: Klimakompressor 4 mm², Batterie 25 mm², E-Maschine 35 mm²."},
{t:"hvt",q:"Wo im HV-System sitzen Kondensatoren, wo Schütze?",a:["Kondensatoren im Inverter, Schütze in der HV-Batterie","Beide in der E-Maschine","Kondensatoren in der Batterie, Schütze im Inverter","Beide im Ladekabel"],e:"Der Lehrer will genau das wissen: Zwischenkreiskondensator im Inverter, Haupt- und Vorladeschütz in der Batterie."},
{t:"hvt",q:"Welche Spannung liegt an CP, wenn das Fahrzeug erkannt ist, aber noch nicht lädt?",a:["+9 V (2,7-kΩ-Widerstand im Fahrzeug)","+12 V","+6 V","−12 V"],e:"Schließt das Fahrzeug den Schalter (zusätzlich 1,3 kΩ), sinkt CP auf +6 V und es lädt."},
{t:"hvt",q:"CP-Signal: Einschaltdauer 0,25 ms bei 1 ms Periode. Welcher Ladestrom ergibt sich mit der Formel aus dem Unterricht (I = t_e / T · 63 A)?",a:["15,75 A","25 A","63 A","4 A"],e:"0,25 / 1 = 25 %. 0,25 · 63 A = 15,75 A. Achtung: Die Norm rechnet mit Tastverhältnis in % · 0,6 A, das ergibt 15 A. In der Prüfung die Formel aus dem Unterricht nehmen."},
{t:"hvt",q:"Wodurch wird der Ladestrom beim AC-Laden begrenzt?",a:["Durch Ladestation, Ladekabel (PP-Codierung) und On-Board-Lader","Nur durch die Steckdose","Nur durch die Batterietemperatur","Gar nicht"],e:"Das schwächste Glied bestimmt den Strom."},
{t:"hvt",q:"80-kWh-Batterie soll von 30 % auf 80 %. Wie lange dauert das an 11 kW AC ungefähr?",a:["Ca. 3,6 Stunden","Ca. 1 Stunde","Ca. 7 Stunden","Ca. 30 Minuten"],e:"50 % von 80 kWh = 40 kWh. 40 / 11 ≈ 3,6 h. Mit 40 kW DC nur ca. 1 h."},
{t:"hvt",q:"Welche Kontakte hat ein Typ-2-Stecker?",a:["L1, L2, L3, N, PE, CP, PP","Nur L und N","DC+, DC− und PE","CAN-High und CAN-Low"],e:"CCS ergänzt den Typ 2 um DC+ und DC−."},
{t:"hvt",q:"Ein Prius startet nach einem Heckschaden nicht. Was ist eine typische Ursache?",a:["Die Sicherheitslinie (Interlock) ist unterbrochen","Zu viel Motoröl","Die Scheibenwischer sind defekt","Der Tank ist zu voll"],e:"Auch möglich: Wartungsstecker nicht richtig gesteckt, 12-V-Batterie leer, Isolationsfehler."},
{t:"hvt",q:"Wie kann man eine Unterbrechung in der Pilotlinie eingrenzen (VW e-up)?",a:["Über Widerstandsmessung: eingebaute 75-Ω-Widerstände zeigen, bis wohin die Linie in Ordnung ist","Durch Abhören","Durch Ziehen aller Sicherungen","Gar nicht, man tauscht alles"],e:"Reparatur nur mit Reparaturleitung nach Herstellervorgabe, Crimpverbinder und Schrumpfschlauch."},
{t:"hvt",q:"Welche Ursachen hat ein zu hoher Widerstand am Potenzialausgleich?",a:["Korrosion, verschmutzte Kontaktfläche, lose Schraube, Kabelbruch","Zu viel Kühlmittel","Neue Schrauben","Eine volle HV-Batterie"],e:"Bei der Sichtprüfung auf Beschädigung, Korrosion und Anzugsdrehmoment achten."},
{t:"hvt",q:"Welche Qualifikation brauchst du mindestens, um den Potenzialausgleich zu prüfen?",a:["Stufe 2S","Stufe S","Stufe 1S","Keine"],e:"Messungen am HV-System im spannungsfreien Zustand sind 2S-Arbeit."},
{t:"hvt",q:"Wie prüfst du, ob das Milliohmmeter richtig misst?",a:["Messspitzen kurzschließen, Anzeige muss ca. 0 mΩ zeigen","An die 12-V-Batterie halten","Gegen die HV-Batterie messen","Gar nicht, es misst immer richtig"],e:"Funktionstest vor jeder Messung."},
{t:"hvt",q:"Warum beeinflussen die Messleitungen bei der 4-Leiter-Messung das Ergebnis nicht?",a:["Die Spannung wird über eigene Leitungen direkt am Prüfling gemessen, dort fließt kaum Strom","Weil die Leitungen vergoldet sind","Weil der Prüfstrom null ist","Weil sie besonders kurz sind"],e:"Das Voltmeter ist hochohmig, an S+ und S− entsteht kein Spannungsfall."},
{t:"hvt",q:"Ein Hybrid meldet Isolationsfehler in der HV-Batterie. Was kann die Ursache sein?",a:["Feuchtigkeit, beschädigte Isolation oder ein Kühlmittelleck in der Batterie","Zu geringer Reifendruck","Leerer Kraftstofftank","Zu helle Scheinwerfer"],e:"Beispiel Audi Q5 Hybrid, Fehler P0AA600."},
{t:"hvt",q:"Im IT-Netz haben zwei Gehäuse je einen Isolationsfehler (Plus und Minus). Was passiert bei intaktem Potenzialausgleich?",a:["Es fließt Kurzschlussstrom über die PA-Leitung und die Sicherung löst aus","Nichts, das ist normal","Das Auto fährt schneller","Die 12-V-Batterie wird geladen"],e:"Lebensgefährlich wird es, wenn zusätzlich die PA-Leitung defekt ist und jemand beide Gehäuse berührt."},
{t:"hvt",q:"Isolationswerte: Klimakompressor 250 kΩ, U- und V-Leitung 250 kΩ, W-Leitung 49 kΩ. Wo liegt der Fehler?",a:["In der W-Leitung oder der W-Wicklung der E-Maschine","Im Klimakompressor","In der U-Leitung","In der 12-V-Batterie"],e:"Der niedrigste Wert zeigt das defekte Teil."},
{t:"hvt",q:"Die PA-Leitung am Getriebe wurde nicht befestigt. Welche Folge hat das?",a:["Isolationsfehler werden nicht erkannt, das Gehäuse kann Spannung führen – Lebensgefahr","Keine, sie ist nur Zierde","Das Getriebe wird lauter","Die Ladezeit steigt"],e:"Ohne Potenzialausgleich funktioniert die Isolationsüberwachung nicht."},
{t:"hvt",q:"Was musst du nach dem Tausch der E-Maschine vor der Übergabe tun?",a:["Isolationsprüfung, PA-Messung, Resolver anlernen, Fehlerspeicher, Probefahrt, Dokumentation","Nur waschen","Nur den Ölstand prüfen","Nichts"],e:"Ohne angelernten Resolver steuert der Inverter die Phasen falsch an."},
{t:"hvt",q:"Wie heißt das Bauteil, das beim Rekuperieren aus Wechselstrom Gleichstrom für die Batterie macht?",a:["Gleichrichter (im Inverter)","DC/DC-Wandler","Vorladewiderstand","Resolver"],e:"Fahren: Batterie → Wechselrichter → E-Maschine. Generator: E-Maschine → Gleichrichter → Batterie."},
{t:"hvt",type:"f",q:"Zwei Messleitungen haben je 10 mΩ, die PA-Leitung 3 mΩ, Prüfstrom 1 mA. Welche Spannung misst die 2-Leiter- und welche die 4-Leiter-Methode?",k:["4-Leiter: U = 1 mA · 3 mΩ = 3 µV","2-Leiter: U = 1 mA · (10 + 3 + 10) mΩ = 23 µV","2-Leiter zeigt fast das 8-Fache → falsch","Darum 4-Leiter-Messung (Kelvin) verwenden"]},
{t:"hvt",type:"f",q:"Wozu dient die Potenzialausgleichsleitung? Nenne drei Aufgaben.",k:["Alle HV-Gehäuse auf gleiches Potenzial wie die Karosserie","Schutz vor Berührungsspannung zwischen Gehäusen","Ermöglicht die Isolationsüberwachung","Bei Doppelfehler fließt Kurzschlussstrom → Sicherung löst aus"]},
{t:"hvt",type:"f",q:"Beschreibe die Isolationsfehlersuche nach dem Ausschlussprinzip.",k:["HV-Leitung an gut zugänglicher Stelle abstecken","Isolationswert mit 500 V gegen Masse messen","Komponenten nacheinander abtrennen","Springt der Wert hoch, liegt der Fehler im abgetrennten Teil","Bauteil oder Leitung einzeln messen und ersetzen"]},
// ================= Hybrid & E-Antrieb (0117–0119, 0122, 0136–0139, 0269–0270) =================
{t:"hyb",q:"Was bewirkt beim Prius der B-Modus?",a:["Verstärkte Rekuperation als Motorbremse, z. B. bergab","Rein elektrisches Fahren","Sportliches Schalten","Batterie laden im Stand"],e:"EV-Modus = rein elektrisch. B-Modus = mehr Bremswirkung über den Generator."},
{t:"hyb",q:"Wo sitzt beim Toyota Prius der Service-Stecker?",a:["Im Kofferraum an der HV-Batterie","Im Motorraum am Sicherungskasten","Unter dem Fahrersitz","Am Tankdeckel"],e:"Immer Herstellerinfo nutzen (z. B. ESI[tronic]), Einbauorte sind je Modell anders."},
{t:"hyb",q:"Warum darf man ein Hybrid- oder E-Auto meist nicht mit allen vier Rädern auf der Straße abschleppen?",a:["Die drehende E-Maschine induziert Spannung und das Getriebe kann Schaden nehmen","Weil die Reifen zu weich sind","Weil das Lenkrad blockiert","Weil die Bremse dann nicht geht"],e:"Meist nur auf dem Abschleppwagen oder mit angehobener Antriebsachse."},
{t:"hyb",q:"Was tut der Kunde, wenn die HV-Batterie unterwegs leer ist?",a:["Nicht weiterfahren, Pannendienst rufen und zum Laden abschleppen","Mit 12-V-Starthilfe weiterfahren","Wasser nachfüllen","Die Batterie überbrücken"],e:"HV-Teile nie überbrücken oder anschließen."},
{t:"hyb",q:"Welche Fahrzeuge können ein E-Kennzeichen bekommen?",a:["BEV, Brennstoffzellenautos und Plug-in-Hybride mit genug E-Reichweite oder wenig CO2","Alle Hybride","Alle Diesel mit Euro 6","Nur Taxis"],e:"Plug-in: 80 km elektrische Reichweite (seit 2025) oder höchstens 50 g CO2/km. Vorteile z. B. Parken, Busspur – regional."},
{t:"hyb",q:"Was ist ein REEV (Range Extender)?",a:["E-Auto mit kleinem Verbrenner, der nur als Generator Strom erzeugt","Ein Hybrid ohne Batterie","Ein Diesel mit Turbolader","Ein Brennstoffzellenauto"],e:"Funktioniert wie ein serieller Hybrid: Antrieb nur elektrisch."},
{t:"hyb",q:"Was unterscheidet einen PHEV von einem HEV?",a:["Der PHEV kann zusätzlich extern geladen werden und hat eine größere Batterie","Der PHEV hat keinen Verbrenner","Der HEV kann extern laden","Es gibt keinen Unterschied"],e:"HEV lädt nur intern (Rekuperation, Verbrenner)."},
{t:"hyb",q:"Mit welcher Spannung arbeitet ein Micro-Hybrid?",a:["12 V","48 V","Über 60 V","400 V"],e:"Micro: 12 V, Mild: 48 V (RSG/BSG), Voll: HV über 60 V."},
{t:"hyb",q:"Wofür steht RSG bzw. BSG beim Mild-Hybrid?",a:["Riemen-Starter-Generator: ersetzt Anlasser und Lichtmaschine","Rückwärts-Schalt-Getriebe","Reifen-Sensor-Gerät","Batterie-Sicherungs-Gehäuse"],e:"Er startet den Motor, rekuperiert und kann boosten."},
{t:"hyb",q:"Wie wirken beim parallelen Hybrid Verbrenner und E-Motor?",a:["Beide treiben mechanisch an, die Drehmomente addieren sich","Nur der E-Motor treibt an","Nur der Verbrenner treibt an, der E-Motor lädt nur","Sie wechseln sich sekündlich ab"],e:"Der E-Motor sitzt zwischen Motor und Getriebe und kann antreiben oder laden."},
{t:"hyb",q:"Welche Aufgaben haben MG1 und MG2 beim Toyota-Hybrid?",a:["MG1 arbeitet vor allem als Generator, MG2 treibt an und rekuperiert","Beide sind nur Anlasser","MG1 ist die Lichtmaschine fürs 12-V-Netz","MG2 treibt die Klimaanlage"],e:"Zusammen mit dem Planetensatz entsteht ein stufenloses Getriebe (eCVT)."},
{t:"hyb",q:"Woran erkennst du an der E-Maschine, dass sie mit Drehstrom läuft?",a:["An den drei Anschlüssen U, V und W","An der roten Farbe","An zwei Anschlüssen Plus und Minus","Am Typenschild mit 12 V"],e:"Drei um 120° versetzte Phasen erzeugen das Drehfeld."},
{t:"hyb",q:"Welcher Nachteil gehört zur Synchronmaschine mit Permanentmagneten?",a:["Hohe Herstellkosten durch seltene Erden","Schlechter Wirkungsgrad","Kleines Drehmoment","Großer Schlupf"],e:"Vorteile: hoher Wirkungsgrad, hohes Drehmoment, exakte Drehzahlregelung."},
{t:"hyb",q:"Welchen Antrieb hat ein VW e-Golf?",a:["BEV – rein elektrisch mit regenerativem Bremsen","Vollhybrid","Mild-Hybrid","Brennstoffzelle"],e:"Kein Verbrenner, nur HV-Batterie und E-Maschine."},
{t:"hyb",type:"f",q:"Ordne zu, was Micro-, Mild- und Vollhybrid können (Start-Stopp, Rekuperation, Boost, elektrisch fahren).",k:["Micro (12 V): Start-Stopp, Rekuperation nur eingeschränkt","Mild (48 V): Start-Stopp, Rekuperation, Boost","Voll (HV): alles, zusätzlich elektrisch fahren"]},
{t:"hyb",type:"f",q:"Ein Kunde fragt: Darf ich meinem Hybrid Starthilfe geben, und darf ich ihn abschleppen? Was antwortest du?",k:["Starthilfe ja, nur an der 12-V-Batterie bzw. den Starthilfepunkten","HV-Teile nie anschließen oder überbrücken","Abschleppen nur nach Herstellervorgabe","Meist auf dem Abschleppwagen oder mit angehobener Antriebsachse"]},
// ================= WiSo (Prüfungen 10.1, 10.3, 10.4, 10.5 – Fotos 0366–0402) =================
{t:"wiso",q:"Was bedeutet das Mitbestimmungsrecht des Betriebsrats?",a:["Der Arbeitgeber kann bestimmte Entscheidungen nur mit Zustimmung des Betriebsrats umsetzen","Der Betriebsrat darf nur informiert werden","Der Betriebsrat entscheidet allein über Löhne","Der Betriebsrat stellt Mitarbeiter ein"],e:"Mitbestimmung (z. B. Arbeitszeit, Pausen) ist stärker als Anhörung oder Information."},
{t:"wiso",q:"Was muss der Arbeitgeber vor jeder Kündigung tun, wenn es einen Betriebsrat gibt?",a:["Den Betriebsrat anhören","Die Gewerkschaft fragen","Das Arbeitsgericht informieren","Die Krankenkasse anrufen"],e:"Eine Kündigung ohne Anhörung des Betriebsrats ist unwirksam."},
{t:"wiso",q:"Wer darf bei einer Urabstimmung über einen Streik abstimmen?",a:["Nur die Gewerkschaftsmitglieder im Tarifgebiet","Alle Arbeitnehmer Deutschlands","Nur der Betriebsrat","Die Arbeitgeber"],e:"Für den Streik müssen in der Regel mindestens 75 % der Mitglieder zustimmen."},
{t:"wiso",q:"Wer zahlt das Streikgeld?",a:["Die Gewerkschaft aus der Streikkasse – nur an ihre Mitglieder","Der Arbeitgeber","Die Agentur für Arbeit","Der Staat"],e:"Wer nicht in der Gewerkschaft ist, bekommt beim Streik keinen Lohn und kein Streikgeld."},
{t:"wiso",q:"Was gilt für die Krankenversicherung eines Arbeitslosen?",a:["Er bleibt Mitglied seiner Kasse, die Bundesagentur für Arbeit zahlt die Beiträge","Er ist nicht mehr versichert","Er muss sich privat versichern","Er zahlt doppelte Beiträge"],e:"Wer Arbeitslosengeld bekommt, bleibt gesetzlich krankenversichert."},
{t:"wiso",q:"Wer ist rentenversicherungspflichtig?",a:["Alle Azubis, Arbeiter und Angestellten, unabhängig von der Höhe des Entgelts","Nur Arbeitnehmer über 25 Jahre","Nur Angestellte über der Beitragsbemessungsgrenze","Nur Selbstständige"],e:"Anders als bei der Krankenversicherung gibt es hier keine Grenze, ab der man austreten kann."},
{t:"wiso",q:"Wie verwalten sich die Sozialversicherungsträger?",a:["Selbst, über Vertreterversammlung und Vorstand","Über den Bundestag","Über die Gewerkschaften allein","Über die Banken"],e:"Selbstverwaltung: Vertreter von Arbeitnehmern und Arbeitgebern."},
{t:"wiso",q:"Wie wird die gesetzliche Unfallversicherung finanziert?",a:["Im Umlageverfahren, der Arbeitgeber zahlt allein nach Gefahrklasse und Lohnsumme","Arbeitnehmer und Arbeitgeber je zur Hälfte","Nur über Steuern","Der Arbeitnehmer allein"],e:"Träger sind die Berufsgenossenschaften."},
{t:"wiso",q:"Du hast auf dem Weg zur Berufsschule einen Unfall. Wer ist zuständig?",a:["Die gesetzliche Unfallversicherung (Berufsgenossenschaft)","Die Krankenkasse allein","Die Rentenversicherung","Die Haftpflichtversicherung"],e:"Wegeunfälle zur Arbeit und zur Berufsschule sind Arbeitsunfälle."},
{t:"wiso",q:"Was ist eine Ersatzkasse?",a:["Eine gesetzlich anerkannte Krankenkasse anstelle der Pflichtkasse (z. B. AOK)","Eine private Zusatzversicherung","Eine Rentenkasse","Die Kasse des Betriebsrats"],e:"Beispiele: TK, Barmer, DAK."},
{t:"wiso",q:"Wer legt den allgemeinen Beitragssatz der gesetzlichen Krankenversicherung fest?",a:["Die Bundesregierung, einheitlich für alle Kassen","Jede Kasse frei","Der Arbeitgeber","Der Betriebsrat"],e:"Allgemeiner Satz 14,6 %. Dazu kommt ein Zusatzbeitrag, den jede Kasse selbst festlegt."},
{t:"wiso",q:"Für welche Ausbildung gilt das Berufsbildungsgesetz (BBiG)?",a:["Für die duale Ausbildung, z. B. zum Kfz-Mechatroniker","Für das Studium","Für die Ausbildung von Beamten","Für die Technikerschule"],e:"Im Handwerk gilt zusätzlich die Handwerksordnung."},
{t:"wiso",q:"Ein 21-jähriger Azubi kauft auf Kredit ein Auto. Wer haftet für die Raten?",a:["Er selbst, weil er volljährig und voll geschäftsfähig ist","Seine Eltern","Der Ausbildungsbetrieb","Niemand"],e:"Ab 18 ist man voll geschäftsfähig."},
{t:"wiso",q:"Der Kunde holt sein repariertes Auto ab, zahlt aber nicht. Was darf die Werkstatt?",a:["Das Auto als Pfand zurückbehalten, bis bezahlt ist","Das Auto verkaufen","Die Reparatur rückgängig machen","Gar nichts"],e:"Werkunternehmerpfandrecht beim Werkvertrag."},
{t:"wiso",q:"Was bedeutet das Günstigkeitsprinzip im Arbeitsvertrag?",a:["Vom Gesetz darf nur zum Vorteil des Arbeitnehmers abgewichen werden","Der Arbeitgeber darf den Lohn frei kürzen","Der günstigste Bewerber wird genommen","Verträge müssen immer billig sein"],e:"Ein Arbeitsvertrag braucht übrigens keine Schriftform, schriftlich ist aber besser."},
{t:"wiso",q:"Welche Pflichten hat der Käufer aus dem Kaufvertrag?",a:["Die Ware annehmen und bezahlen","Die Ware liefern","Die Ware reparieren","Eine Rechnung schreiben"],e:"Der Verkäufer muss mangelfrei liefern und das Eigentum übertragen."},
{t:"wiso",q:"Es wird ab Lager geliefert. Wer trägt die Versandkosten?",a:["Der Käufer","Der Verkäufer","Beide je zur Hälfte","Die Post"],e:"Ab Lager = der Käufer zahlt den Transport."},
{t:"wiso",q:"Was passiert nach Ablauf der Verjährungsfrist?",a:["Der Schuldner darf die Leistung verweigern","Die Schuld verdoppelt sich","Die Schuld wird automatisch bezahlt","Der Gläubiger muss Zinsen zahlen"],e:"Die Schuld besteht weiter, aber der Schuldner kann sich auf die Verjährung berufen (Einrede)."},
{t:"wiso",q:"Was bedeutet eine negative Rentabilität?",a:["Der Betrieb macht Verlust","Der Betrieb macht hohen Gewinn","Der Betrieb hat keine Schulden","Die Mitarbeiter verdienen mehr"],e:"Rentabilität = Gewinn im Verhältnis zum eingesetzten Kapital."},
{t:"wiso",q:"Wann kann eine Weihnachtsgratifikation zurückgefordert werden?",a:["Nur wenn eine Rückzahlungsvereinbarung besteht","Immer, wenn man kündigt","Nie","Wenn man krank war"],e:"Ohne Vereinbarung bleibt das Geld beim Arbeitnehmer."},
{t:"wiso",q:"Welche Steuerklasse gilt, wenn die ELStAM-Daten schuldhaft nicht vorliegen?",a:["Steuerklasse VI","Steuerklasse I","Steuerklasse III","Gar keine"],e:"Klasse VI hat die höchsten Abzüge. Freibeträge trägt das Finanzamt ein."},
{t:"wiso",q:"Der Lebenshaltungsindex steigt um 2 Prozentpunkte. Was bedeutet das?",a:["Die Kosten für die Lebensführung sind um 2 % gestiegen","Die Löhne sind um 2 % gestiegen","Die Arbeitslosigkeit ist um 2 % gesunken","Die Zinsen sind um 2 % gestiegen"],e:"Das ist die Inflationsrate."},
{t:"wiso",q:"Was kann der Staat gegen Inflation tun?",a:["Im Staatshaushalt sparen, also weniger nachfragen","Mehr Geld ausgeben","Die Mehrwertsteuer erhöhen","Mehr Subventionen zahlen"],e:"Weniger Nachfrage bremst die Preise."},
{t:"wiso",q:"Was gehört zu den indirekten Steuern?",a:["Mineralöl-, Tabak- und Umsatzsteuer","Lohnsteuer","Einkommensteuer","Kfz-Steuer"],e:"Indirekt = über den Preis auf den Verbraucher abgewälzt. Direkt = Steuerpflichtiger ist auch Steuerträger."},
{t:"wiso",q:"Welche Steuern bringen dem Staat am meisten ein?",a:["Umsatzsteuer und Lohnsteuer","Hundesteuer und Tabaksteuer","Kfz-Steuer","Grundsteuer"],e:"Haushalte mit wenig Einkommen trifft die Umsatzsteuer anteilig am stärksten."},
{t:"wiso",q:"Welche drei Ziele verfolgt der Staat mit Steuern?",a:["Einnahmen für Staatsaufgaben, Umverteilung, Lenkung","Nur Strafen","Nur Bankenrettung","Nur Rentenzahlung"],e:"Lenkung: z. B. Tabaksteuer gegen Rauchen, Ökosteuer."},
{t:"wiso",q:"Wer bestimmt in der freien Marktwirtschaft die obere Preisgrenze?",a:["Der Wettbewerb der Anbieter","Der Staat","Die Gewerkschaften","Die Banken"],e:"Wer zu teuer ist, verkauft nichts."},
{t:"wiso",q:"Was passiert auf einem Markt, wenn der Preis steigt?",a:["Anbieter bieten mehr an, Nachfrager fragen weniger nach","Alle kaufen mehr","Anbieter bieten weniger an","Nichts"],e:"Wo sich Angebots- und Nachfragekurve schneiden, liegt der Gleichgewichtspreis."},
{t:"wiso",q:"Wie zahlst du die Miete bargeldlos jeden Monat in gleicher Höhe am besten?",a:["Per Dauerauftrag","Per Scheck","Bar am Schalter","Per Lastschrift vom Vermieter jeden Tag"],e:"Dauerauftrag = gleicher Betrag, gleicher Empfänger, fester Termin."},
{t:"wiso",q:"Was ist ein Dispositionskredit?",a:["Ein Überziehungsrahmen auf dem Girokonto","Ein Kredit für den Hauskauf","Ein Sparvertrag","Eine Versicherung"],e:"Bequem, aber teuer: hohe Dispozinsen."},
{t:"wiso",q:"Wie lange kannst du einer falschen SEPA-Lastschrift widersprechen?",a:["8 Wochen","3 Tage","1 Jahr","Gar nicht"],e:"Die Bank bucht das Geld zurück. Darum Kontoauszüge regelmäßig prüfen."},
{t:"wiso",q:"Was unterscheidet das ELV vom POS-Verfahren an der Kasse?",a:["ELV mit Unterschrift ohne Zahlungsgarantie, POS mit PIN und Zahlungsgarantie für den Händler","ELV ist Barzahlung","POS ist eine Überweisung","Es gibt keinen Unterschied"],e:"POS = electronic cash, ELV = Elektronisches Lastschriftverfahren."},
{t:"wiso",q:"Was versteht man unter einer Investition?",a:["Die Anlage von Kapital in Produktionsmittel, z. B. eine neue Hebebühne","Die Auszahlung von Löhnen","Ein Urlaub","Das Bezahlen von Steuern"],e:"Investieren = Geld in Maschinen, Gebäude oder Anlagen stecken."},
{t:"wiso",q:"Was bedeutet der Grüne Punkt auf einer Verpackung?",a:["Der Hersteller hat für ein Entsorgungssystem (Duales System) bezahlt","Das Produkt ist bio","Das Produkt ist gefährlich","Die Verpackung ist kompostierbar"],e:"Recycling = Reststoffe zurück in die Produktion."},
{t:"wiso",q:"Der Tariflohn steigt um 2,2 %, die Inflation liegt bei 1 %. Was passiert mit dem Reallohn?",a:["Er steigt um ca. 1,2 %","Er steigt um 3,2 %","Er sinkt um 1,2 %","Er bleibt gleich"],e:"Reallohn ≈ Lohnplus minus Inflation."},
{t:"wiso",q:"Was ist der Tariflohn?",a:["Der im Tarifvertrag festgelegte Lohn, den der Arbeitgeber mindestens zahlen muss","Der höchste erlaubte Lohn","Ein unverbindlicher Richtwert","Der gesetzliche Mindestlohn"],e:"Mehr zahlen darf der Arbeitgeber immer."},
{t:"wiso",q:"Ab welchem Einkommen kann man in die private Krankenversicherung wechseln?",a:["Erst über der Versicherungspflichtgrenze (Jahresarbeitsentgeltgrenze)","Ab 2500 € brutto im Monat","Ab dem 18. Geburtstag","Jederzeit"],e:"Mit 2500 € brutto bist du pflichtversichert. Die Grenze liegt deutlich höher und steigt jedes Jahr."},
{t:"wiso",q:"Wofür wurde der Solidaritätszuschlag ursprünglich eingeführt?",a:["Für den Aufbau der neuen Bundesländer nach der Wiedervereinigung","Für die Rente","Für die Bundeswehr","Für den Straßenbau im Westen"],e:"Heute zahlen ihn nur noch hohe Einkommen."},
{t:"wiso",q:"In welcher Reihenfolge laufen die Konjunkturphasen ab?",a:["Aufschwung – Hochkonjunktur – Abschwung – Tiefstand","Tiefstand – Hochkonjunktur – Aufschwung – Abschwung","Abschwung – Aufschwung – Tiefstand – Boom","Es gibt keine feste Reihenfolge"],e:"Fachbegriffe: Expansion, Boom, Rezession, Depression."},
{t:"wiso",q:"Was kennzeichnet einen Aufschwung?",a:["Steigende Produktion und Investitionen, sinkende Arbeitslosigkeit","Sinkende Gewinne, steigende Arbeitslosigkeit","Fallende Preise und Pessimismus","Kurzarbeit überall"],e:"Die Preise steigen dabei leicht, die Stimmung ist optimistisch."},
{t:"wiso",q:"Was kann der Staat in einer Rezession tun?",a:["Die Einkommensteuer senken, damit mehr Kaufkraft entsteht","Die Steuern stark erhöhen","Alle Subventionen streichen","Die Löhne einfrieren"],e:"Antizyklische Fiskalpolitik: in schlechten Zeiten Nachfrage stärken."},
{t:"wiso",q:"Was bedeutet ein Handelsbilanzüberschuss?",a:["Die Exporte sind größer als die Importe","Die Importe sind größer als die Exporte","Der Staat hat keine Schulden","Die Arbeitslosigkeit ist null"],e:"Gehört zum Ziel außenwirtschaftliches Gleichgewicht."},
{t:"wiso",q:"Welche zwei Ziele ergänzen das magische Viereck zum Sechseck?",a:["Gerechte Einkommens- und Vermögensverteilung sowie Umweltschutz","Hohe Zinsen und hohe Steuern","Niedrige Löhne und Export","Mehr Autos und mehr Straßen"],e:"Viereck aus dem Stabilitätsgesetz 1967."},
{t:"wiso",q:"Was versteht man unter Globalisierung?",a:["Märkte und Produktion in verschiedenen Ländern werden immer stärker voneinander abhängig","Alle Firmen ziehen nach Deutschland","Der Handel wird verboten","Nur noch Online-Handel"],e:"Beispiel: Teile für ein Auto kommen aus vielen Ländern."},
{t:"wiso",q:"Wer überwacht Fusionen und Wettbewerbsverzerrungen?",a:["Das Bundeskartellamt","Die EZB","Die Handwerkskammer","Das Finanzamt"],e:"Es soll Monopole und Preisabsprachen verhindern."},
{t:"wiso",q:"Du wirst nach der Ausbildung nicht übernommen. Was bekommst du?",a:["Arbeitslosengeld von der Agentur für Arbeit","Weiter Ausbildungsvergütung","Krankengeld","Nichts"],e:"Danach, bei Bedürftigkeit, Bürgergeld."},
{t:"wiso",q:"Wie viele Gesellschafter braucht man mindestens für eine GmbH?",a:["Einen","Zwei","Fünf","Sieben"],e:"Stammkapital mindestens 25.000 €. Nachteile: Notar, Gründungskosten, Buchführungspflicht."},
{t:"wiso",q:"Wie haften die Gesellschafter einer OHG?",a:["Unbeschränkt, auch mit dem Privatvermögen","Nur mit ihrer Einlage","Gar nicht","Nur der Jüngste"],e:"Bei der KG haftet nur der Komplementär unbeschränkt."},
{t:"wiso",q:"Wann bekommst du Lohn, obwohl du nicht arbeitest?",a:["Wenn du nachweislich dein plötzlich erkranktes Kleinkind betreuen musst","Wenn du keine Lust hast","Wenn deine Lebensgefährtin entbindet","Wenn es regnet"],e:"Vorübergehende Verhinderung aus persönlichem Grund. Bei Kinderkrankheit zahlt oft die Krankenkasse Kinderkrankengeld."},
{t:"wiso",q:"Bis wann musst du eine ärztliche Krankschreibung spätestens vorlegen?",a:["Ab dem 4. Krankheitstag","Am ersten Tag","Nach 2 Wochen","Gar nicht"],e:"Der Arbeitgeber darf sie auch früher verlangen. Heute meist elektronisch (eAU)."},
{t:"wiso",q:"Welche Leistung zahlt die Rentenversicherung?",a:["Erwerbsminderungsrente","Arbeitslosengeld","Behandlung nach Arbeitsunfall","Krankengeld"],e:"Für Arbeitsunfälle ist die Berufsgenossenschaft zuständig."},
{t:"wiso",q:"Was bekommt man nach dem Ende des Arbeitslosengelds I bei Bedürftigkeit?",a:["Bürgergeld (früher Arbeitslosengeld II)","Rente","Kindergeld","Nichts mehr"],e:"Dafür ist das Jobcenter zuständig."},
{t:"wiso",q:"Welches Grundrecht garantiert die freie Berufswahl?",a:["Artikel 12 Grundgesetz (Berufsfreiheit)","Artikel 1 GG (Menschenwürde)","Artikel 5 GG (Meinungsfreiheit)","Artikel 20 GG"],e:"Jeder darf den Beruf ergreifen, für den er sich geeignet fühlt."},
{t:"wiso",q:"Ab welchem Alter darfst du den Betriebsrat mitwählen?",a:["Ab 16 Jahren","Ab 18 Jahren","Ab 21 Jahren","Ab 14 Jahren"],e:"Gewählt werden kann man ab 18 und nach 6 Monaten im Betrieb. Ausländische Kollegen dürfen auch wählen."},
{t:"wiso",q:"Welches Problem zeigt die Alterspyramide für die Rente?",a:["Immer weniger Erwerbstätige finanzieren immer mehr Rentner","Es gibt zu viele junge Leute","Die Rente steigt automatisch","Die Beiträge sinken"],e:"Folgen: höhere Beiträge, niedrigere Renten, später in Rente. Darum private Vorsorge (Riester, Betriebsrente)."},
{t:"wiso",q:"Welche Versicherungen sind für einen Berufsanfänger ohne Familie besonders wichtig?",a:["Privathaftpflicht und Berufsunfähigkeitsversicherung","Insassen- und Risikolebensversicherung","Reisegepäck- und Handyversicherung","Gar keine"],e:"Risikoleben braucht nur, wer Angehörige absichern muss."},
{t:"wiso",q:"Wonach richtet sich der Beitrag in der gesetzlichen Sozialversicherung?",a:["Nach dem Einkommen (Solidarprinzip)","Nach dem persönlichen Risiko","Nach dem Alter","Nach dem Geschlecht"],e:"Bei der Privatversicherung richtet sich der Beitrag nach Risiko und Leistung (Äquivalenzprinzip)."},
{t:"wiso",q:"Welche Unterlagen gibst du beim Arbeitsantritt ab?",a:["Steuer-ID, Sozialversicherungsnummer, Krankenkassen-Bescheinigung, Bankverbindung","Zeugnis der Grundschule","Führerschein und Reisepass","Gar keine"],e:"Jugendliche zusätzlich die ärztliche Erstuntersuchung nach JArbSchG."},
{t:"wiso",q:"Du kündigst nach 3 Monaten in der Probezeit. Wie viel Urlaub steht dir zu?",a:["3/12 des Jahresurlaubs","Der volle Jahresurlaub","Gar keiner","Die Hälfte"],e:"Den vollen Anspruch gibt es erst nach 6 Monaten (Wartezeit)."},
{t:"wiso",q:"Dein Arbeitsverhältnis endet am 30.6. Ab dem 16.6. bist du 4 Wochen krank. Wie lange zahlt der Arbeitgeber?",a:["Nur bis zum 30.6., also 2 Wochen","Volle 6 Wochen","4 Wochen","Gar nicht"],e:"Danach zahlt die Krankenkasse Krankengeld."},
{t:"wiso",q:"Wann darf der Arbeitnehmer fristlos kündigen?",a:["Wenn der Arbeitgeber keinen Lohn zahlt","Wenn ihm die Arbeit keinen Spaß macht","Wenn das Wetter schlecht ist","Nie"],e:"Fristlos nur aus wichtigem Grund. Der Arbeitgeber darf z. B. bei beharrlicher Arbeitsverweigerung fristlos kündigen."},
{t:"wiso",q:"Darfst du im Urlaub für eine andere Firma arbeiten?",a:["Nein, wenn es dem Erholungszweck widerspricht","Ja, immer","Nur am Wochenende","Nur mit Erlaubnis der Krankenkasse"],e:"§ 8 Bundesurlaubsgesetz."},
{t:"wiso",q:"Der Arbeitgeber führt deine Krankenkassenbeiträge nicht ab. Was gilt?",a:["Du bleibst trotzdem versichert","Du bist sofort nicht mehr versichert","Du musst alles nachzahlen","Du musst kündigen"],e:"Für die Abführung ist der Arbeitgeber verantwortlich."},
{t:"wiso",q:"Was zahlt die Pflegeversicherung?",a:["Einen Anteil an stationärer Pflege und die ambulante Pflege","Den Zahnarzt","Das Arbeitslosengeld","Die Rente"],e:"Sie deckt nicht alle Kosten, ein Eigenanteil bleibt."},
{t:"wiso",q:"Wer erlässt die Unfallverhütungsvorschriften?",a:["Die Berufsgenossenschaften","Der Bundestag","Der Betriebsrat","Die Krankenkassen"],e:"Die BG zahlt auch die Kosten eines Arbeitsunfalls."},
{t:"wiso",q:"Was versteht man unter saisonaler Arbeitslosigkeit?",a:["Arbeitskräfte werden nur zu bestimmten Jahreszeiten gebraucht, z. B. Bau oder Tourismus","Arbeitslosigkeit durch Maschinen","Arbeitslosigkeit durch Wirtschaftskrise","Arbeitslosigkeit wegen Umzug"],e:"Besonders betroffen von Arbeitslosigkeit sind Geringqualifizierte, Ältere und Jugendliche ohne Abschluss."},
{t:"wiso",q:"Was ist der Leitzins?",a:["Der Zinssatz, zu dem sich Geschäftsbanken Geld bei der Zentralbank leihen","Der Zins fürs Sparbuch","Der Dispozins","Der Kreditzins für Häuser"],e:"Die EZB macht die Geldpolitik im Euroraum und soll die Preise stabil halten."},
{t:"wiso",q:"Was passiert typischerweise in einer Wirtschaftskrise?",a:["Die Preise bleiben fast gleich oder sinken, die Arbeitslosigkeit steigt stark","Die Preise steigen stark, alle haben Arbeit","Die Löhne steigen stark","Die Exporte verdoppeln sich"],e:"Subventionen können helfen, die Konjunktur zu stützen."},
{t:"wiso",q:"Was führt direkt zu einer Preissteigerung?",a:["Eine Erhöhung der Mehrwertsteuer","Eine Senkung der Lohnsteuer","Mehr Wettbewerb","Sinkende Ölpreise"],e:"Die Mehrwertsteuer steckt im Endpreis."},
{t:"wiso",type:"f",q:"Erkläre den Unterschied zwischen Sozialversicherung und Privatversicherung (Mitgliedschaft, Beitrag, Leistung).",k:["Sozialversicherung: Pflicht, Privat: freiwillig","Sozial: Beitrag nach Einkommen (Solidarprinzip)","Privat: Beitrag nach Risiko und Leistung (Äquivalenzprinzip)","Sozial: Leistungen gesetzlich festgelegt, Privat: nach Vertrag"]},
{t:"wiso",type:"f",q:"Dein neuer MP3-Player ist nach 2 Monaten defekt. Welche Rechte hast du und in welcher Reihenfolge?",k:["Zuerst Nacherfüllung: Reparatur oder neues Gerät","Wenn das scheitert: Rücktritt oder Minderung, ggf. Schadensersatz","Gewährleistung 2 Jahre bei Neuware","Im ersten Jahr muss der Händler beweisen, dass der Mangel nicht schon da war (Beweislastumkehr)"]},
{t:"wiso",type:"f",q:"Kontostand 58,63 €. Eingang 678,95 €, Abbuchungen 25,00 €, 63,27 €, 150,00 € und 35,87 €, Gutschrift 19,50 €. Wie hoch ist der neue Kontostand?",k:["58,63 + 678,95 + 19,50 = 757,08 €","Abzüge: 25,00 + 63,27 + 150,00 + 35,87 = 274,14 €","Neuer Stand: 757,08 − 274,14 = 482,94 €"]},
{t:"wiso",type:"f",q:"Nenne Vor- und Nachteile, wenn du deinen Betrieb als GmbH gründest.",k:["Vorteil: beschränkte Haftung, Privatvermögen geschützt","Vorteil: Ansehen und Kreditwürdigkeit","Nachteil: mind. 25.000 € Stammkapital","Nachteil: Notar- und Gründungskosten, Buchführungs- und Veröffentlichungspflicht"]},
// ================= Fahrwerk & Lenkung (Prüfung 4.2, Arbeitsheft Kap. 7 – Fotos 0065–0071, 0202–0238) =================
{t:"fw",q:"Welche Fragen stellst du dem Kunden, wenn er über ein schief stehendes Lenkrad klagt?",a:["Seit wann, wann tritt es auf, Bordsteinkontakt oder Unfall, kürzlich Reifen oder Reparatur?","Welche Farbe hat das Auto?","Wie oft tankt er?","Welches Radio hat er?"],e:"Kundengespräch eingrenzen: Geschwindigkeit, Bremsen, Kurven, Ziehen zu einer Seite."},
{t:"fw",q:"Was prüfst du bei der Sichtprüfung vor der Achsvermessung?",a:["Reifen, Felgen, Spurstangenköpfe, Traggelenke, Lenkerlager, Dämpfer, Radlagerspiel","Nur den Ölstand","Nur die Beleuchtung","Nur den Innenraum"],e:"Ausgeschlagene Teile machen jede Vermessung sinnlos. Erst reparieren, dann vermessen."},
{t:"fw",q:"In welchem Zustand muss das Fahrzeug bei der Achsvermessung stehen?",a:["Konstruktionslage nach Herstellervorgabe (z. B. Tank voll), eingefedert, Reifendruck korrigiert","Leer und angehoben","Mit voller Zuladung im Kofferraum","Auf der Hebebühne in der Luft"],e:"Dazu Lenkung geradeaus, Lenkrad- und Bremspedalfeststeller, Drehteller entriegeln, Messbühne waagerecht."},
{t:"fw",q:"Wozu dient der Bremspedalfeststeller bei der Achsvermessung?",a:["Er verhindert, dass die Räder wegrollen oder sich drehen, z. B. beim Nachlauf-Messen mit Lenkeinschlag","Er entlüftet die Bremse","Er prüft die Bremskraft","Er stellt die Spur ein"],e:"Ohne ihn verfälschen rollende Räder die Messwerte."},
{t:"fw",q:"Was ist der Lenkrollhalbmesser (R0)?",a:["Der Abstand auf der Fahrbahn zwischen Durchstoßpunkt der Lenkachse und Radaufstandsmitte","Der Durchmesser des Lenkrads","Der Wendekreis","Der Abstand der beiden Vorderräder"],e:"Positiv: Lenkachse trifft innen von der Radmitte auf die Fahrbahn. Negativ: außen."},
{t:"fw",q:"Ein Vorderrad bremst stärker. Wie reagiert ein Fahrzeug mit positivem Lenkrollhalbmesser?",a:["Es zieht zur stärker gebremsten Seite","Es fährt geradeaus","Es zieht zur schwächer gebremsten Seite","Es hebt vorne ab"],e:"Negativer Lenkrollhalbmesser lenkt dagegen und stabilisiert."},
{t:"fw",q:"Was ist Nachspur?",a:["Die Räder stehen vorne weiter auseinander als hinten (l2 − l1 < 0)","Die Räder stehen vorne enger als hinten","Beide Räder stehen parallel","Das Hinterrad läuft nach"],e:"Vorspur: l2 − l1 > 0, vorne enger."},
{t:"fw",q:"Sturz-Sollwert −48' bis +12'. Gemessen links −1°41'. Um wie viel liegt der Wert außerhalb?",a:["Um 53' (0°53')","Um 41'","Um 1°29'","Er ist in Ordnung"],e:"−1°41' = −101'. Grenze −48'. Differenz 101 − 48 = 53'. Merke: 1° = 60'."},
{t:"fw",q:"Was passiert, wenn die geometrische Fahrachse von der Symmetrieachse abweicht?",a:["Hundegang und schief stehendes Lenkrad","Mehr Leistung","Kürzerer Bremsweg","Leiseres Fahren"],e:"Darum zuerst die Hinterachse einstellen, dann die Vorderachse danach ausrichten."},
{t:"fw",q:"Was gehört zum Abschluss einer Achsvermessung?",a:["Lenkrad mittig, Endvermessung mit Protokoll, Probefahrt","Nur das Auto waschen","Reifen tauschen","Ölwechsel"],e:"Vorher beschädigte Teile ersetzen und Spur/Sturz einstellen."},
{t:"fw",q:"Um welche Achse bewegt sich das Fahrzeug beim Gieren?",a:["Um die Hochachse","Um die Querachse","Um die Längsachse","Um die Radachse"],e:"Gieren = Hochachse (Drehen um die Senkrechte). Wanken = Längsachse. Nicken = Querachse."},
{t:"fw",q:"Was ist Übersteuern?",a:["Das Heck bricht aus, das Auto fährt eine kleinere Kurve als gelenkt","Das Auto schiebt über die Vorderräder geradeaus","Das Auto fährt genau die gelenkte Kurve","Das Auto bremst automatisch"],e:"ESP bremst dann das kurvenäußere Vorderrad."},
{t:"fw",q:"Welchen Vorteil hat negativer Sturz?",a:["Bessere Seitenführung in der Kurve","Weniger Reifenverschleiß innen","Leichteres Lenken im Stand","Mehr Bodenfreiheit"],e:"Das kurvenäußere Rad steht beim Wanken aufrechter. Positiver Sturz: schlechtere Seitenführung, mehr Untersteuern."},
{t:"fw",q:"Was ist der Schräglaufwinkel?",a:["Der Winkel zwischen Radebene und der tatsächlichen Bewegungsrichtung des Rades","Der Sturzwinkel","Der Lenkradwinkel","Der Winkel der Lenkachse"],e:"Er entsteht in der Kurve, weil sich der Reifen verformt."},
{t:"fw",q:"Welche Aufgaben hat die Lenkung?",a:["Richtung ändern, Lenkkräfte übersetzen, Fahrbahn zurückmelden, in Geradeaus zurückstellen","Nur das Auto bremsen","Den Motor kühlen","Die Federung einstellen"],e:"Fahrsicherheit hängt wesentlich von der Lenkung ab – darum sorgfältig prüfen."},
{t:"fw",q:"Warum schlägt beim Lenktrapez das kurveninnere Rad stärker ein?",a:["Damit beide Räder auf Kreisbahnen um denselben Mittelpunkt rollen und Reifen weniger verschleißen","Damit das Auto schneller wird","Damit die Lenkung leichter geht","Damit der Wendekreis größer wird"],e:"Lenktrapez = Spurstange und beide Spurstangenhebel."},
{t:"fw",q:"Welche Aufgaben hat das Lenkgetriebe?",a:["Drehbewegung in Schubbewegung wandeln, Lenkkraft und Lenkwinkel übersetzen","Nur die Räder bremsen","Das Lenkrad beheizen","Den Reifendruck messen"],e:"Zahnstangenlenkung: Ritzel, Zahnstange, Druckstück, Spurstangen, Gummibalg."},
{t:"fw",q:"Was bewirkt eine größere Übersetzung im Lenkgetriebe?",a:["Kleinerer Kraftaufwand, aber indirektere Lenkung","Direktere Lenkung, mehr Kraft","Kleinerer Wendekreis","Nichts"],e:"Mehr Lenkradumdrehungen für den gleichen Radeinschlag."},
{t:"fw",q:"Wie erzeugt eine Zahnstangen-Hydrolenkung die Unterstützung?",a:["Ölpumpe erzeugt Druck, Drehschieber mit Torsionsstab steuert Öl in den Arbeitszylinder","Ein Elektromotor an der Lenksäule","Eine Feder im Lenkrad","Druckluft"],e:"Bei der elektrischen Servolenkung (EPS) übernimmt das ein E-Motor."},
{t:"fw",q:"In welcher Reihenfolge arbeitet eine elektrische Servolenkung?",a:["Lenkmoment verdreht Torsionsstab → Sensor meldet an Steuergerät → E-Motor unterstützt","E-Motor dreht zuerst, dann der Fahrer","Steuergerät lenkt ohne Fahrer","Die Pumpe erzeugt Öldruck"],e:"Das Steuergerät berücksichtigt Lenkmoment, Geschwindigkeit und Motordrehzahl."},
{t:"fw",q:"Was macht eine Überlagerungslenkung (Aktivlenkung) beim Rangieren?",a:["Der Stellmotor dreht gleichsinnig mit, der Radeinschlag wird größer","Sie blockiert die Lenkung","Sie lenkt gegensinnig, der Einschlag wird kleiner","Sie schaltet die Servo ab"],e:"Bei hoher Geschwindigkeit dreht sie gegensinnig → kleinerer Einschlag, ruhigere Lenkung."},
{t:"fw",q:"Was ist die Spreizung?",a:["Die Schrägstellung der Lenkachse quer zur Fahrzeuglängsachse","Die Neigung des Rades","Der Abstand der Räder","Die Neigung der Lenkachse in Längsrichtung"],e:"Beim Einschlagen wird das Fahrzeug angehoben → Rückstellkraft."},
{t:"fw",q:"Was ist der Radaufstandspunkt?",a:["Der Schnittpunkt der Radmittelebene mit der Fahrbahn","Die Mitte der Radnabe","Der höchste Punkt des Reifens","Der Befestigungspunkt der Feder"],e:"Radstand = Abstand der Aufstandspunkte vorne–hinten. Spurweite = Abstand der Aufstandspunkte einer Achse."},
{t:"fw",q:"Welche Vorteile bringt eine richtig eingestellte Spur?",a:["Geringer Reifenverschleiß, stabiler Geradeauslauf, wenig Rollwiderstand","Mehr Motorleistung","Kürzere Ladezeit","Lautere Reifen"],e:"Falsche Spur radiert die Reifen ab."},
{t:"fw",q:"Was gehört zu einer 3D-Achsvermessung?",a:["Reflektoren (Targets) an den Rädern, Kameraeinheit, Vermessungscomputer","Ein Lineal und eine Wasserwaage","Ein Bremsenprüfstand","Ein Abgastester"],e:"Dazu Drehteller, Schiebeplatten, Achsmessbühne."},
{t:"fw",q:"Wie bringst du die Lenkung beim Einstellen in Mittelstellung?",a:["Lenkgetriebe mittig drehen (Lenkradwaage), fixieren, Markierung kontrollieren","Lenkrad ganz nach links drehen","Spurstange abbauen","Reifen abnehmen"],e:"Erst dann Spur einstellen, damit das Lenkrad gerade steht."},
{t:"fw",q:"Welche Teile gehören zur ungefederten Masse?",a:["Räder, Bremsen, Radträger","Karosserie, Motor, Insassen","Sitze und Lenkrad","Tank und Kofferraum"],e:"Kleine ungefederte Masse = besserer Bodenkontakt."},
{t:"fw",q:"Wie schwingt die gefederte Masse (Aufbau) im Vergleich zum Rad?",a:["Mit niedriger Frequenz und großer Amplitude","Mit hoher Frequenz und kleiner Amplitude","Gar nicht","Genau wie das Rad"],e:"Aufbau ca. 1–1,5 Hz, Rad ca. 10–15 Hz mit kleiner Amplitude."},
{t:"fw",q:"Welche Aufgaben haben Federung und Dämpfung?",a:["Stöße in Schwingungen wandeln, Schwingungen abbauen, ständigen Bodenkontakt sichern","Nur das Auto tiefer legen","Den Motor kühlen","Die Bremse unterstützen"],e:"Feder speichert die Energie, der Dämpfer baut die Schwingung ab."},
{t:"fw",q:"Wie erreicht man bei einer Schraubenfeder eine progressive Kennlinie?",a:["Unterschiedlicher Windungsabstand, Drahtdurchmesser oder Windungsdurchmesser","Durch dickeres Öl","Durch eine längere Feder","Durch Lackieren"],e:"Progressiv = je mehr eingefedert, desto härter."},
{t:"fw",q:"Welchen Vorteil hat eine Luftfederung?",a:["Niveauregulierung: gleiche Fahrzeughöhe unabhängig von der Beladung","Sie ist billiger als Stahlfedern","Sie braucht keine Wartung","Sie ersetzt die Bremse"],e:"Dazu progressive Kennlinie und verstellbare Höhe. Typisch: Oberklasse, Busse, Lkw."},
{t:"fw",q:"Welcher Gasdruck herrscht ungefähr in einem Einrohr-Gasdruckdämpfer?",a:["Ca. 25–30 bar","Ca. 1 bar","Ca. 3–8 bar","Ca. 200 bar"],e:"Zweirohrdämpfer: ca. 3–8 bar, mit Ausgleichsraum und Bodenventil."},
{t:"fw",q:"Wie prüft ein Stoßdämpfer-Schocktester?",a:["Er regt die Federung zum Schwingen an und zeichnet die Schwingung bis zum Stillstand als Kurve auf","Er misst den Öldruck direkt","Er wiegt das Auto","Er misst die Spur"],e:"Ausgewertet werden Resonanzamplitude bzw. Haftwert."},
{t:"fw",q:"Was macht ein aktives Fahrwerk?",a:["Es hält den Aufbau in allen Fahrzuständen auf gleichem Niveau (Nick- und Wankausgleich)","Es bremst automatisch","Es lenkt selbstständig","Es pumpt die Reifen auf"],e:"Über Hydraulikzylinder oder aktive Stabilisatoren."},
{t:"fw",q:"Bei welcher Achse ändert sich der Sturz beim Einfedern nicht?",a:["Längslenkerachse","McPherson-Achse","Doppelquerlenkerachse","Schräglenkerachse"],e:"Der Längslenker schwingt nur in Fahrtrichtung."},
{t:"fw",q:"Wie wirkt die Verbundlenkerachse beim einseitigen Einfedern?",a:["Der Querträger verdreht sich und wirkt wie ein Stabilisator","Sie wirkt wie eine Starrachse","Sie blockiert","Gar nicht"],e:"Beidseitig gleich eingefedert wirkt sie wie eine Starrachse, einseitig wie eine Einzelradaufhängung."},
{t:"fw",q:"Was zeichnet eine Raumlenker- bzw. Mehrlenkerachse aus?",a:["Mehrere Lenker (z. B. fünf), einer davon für die Spurführung","Nur ein Querlenker","Eine starre Achse mit Blattfeder","Keine Lenker"],e:"Sehr gute Radführung, aber aufwendig und teuer."},
{t:"fw",q:"Woran erkennst du eine Starrachse?",a:["Achsrohr mit Ausgleichsgetriebe, oft mit Blattfedern","Federbein mit Domlager","Querträger mit Längslenkern","Fünf einzelne Lenker"],e:"Typisch für Nutzfahrzeuge und Geländewagen."},
{t:"fw",type:"f",q:"Nenne die Vorteile eines Einrohr-Gasdruckdämpfers gegenüber dem Zweirohrdämpfer.",k:["Bessere Wärmeabfuhr","Geringeres Gewicht","Einbaulage beliebig, auch kopfüber","Kein Aufschäumen, gleichbleibende Dämpfung"]},
{t:"fw",type:"f",q:"Beschreibe, wie eine elektrische Servolenkung (Servoelectric) arbeitet.",k:["Fahrer dreht am Lenkrad, Torsionsstab wird verdreht","Lenkmomentsensor meldet an Steuergerät","Steuergerät steuert E-Motor nach Lenkmoment, Geschwindigkeit, Drehzahl","E-Motor unterstützt über Kugelspindel oder Schneckengetriebe","Lenkkraft = Fahrer + Motorunterstützung"]},
// ================= Schaltgetriebe (Prüfung 3.2 VW Sharan, Übungsblätter – Fotos 0007–0012, 0073–0081, 0357–0365) =================
{t:"get",q:"Wie wird beim Schaltmuffengetriebe ein Gang eingelegt?",a:["Die Schaltgabel schiebt die Schaltmuffe, sie verbindet das Losrad drehfest mit der Welle","Zahnräder werden aus- und eingerückt","Ein Planetensatz wird gebremst","Eine Lamellenkupplung schließt"],e:"Alle Zahnradpaare sind ständig im Eingriff, je Paar ist ein Rad ein Losrad."},
{t:"get",q:"Welche Wellen hat ein gleichachsiges Dreiwellengetriebe?",a:["Antriebswelle, Vorgelegewelle und Hauptwelle","Nur eine Welle","Antriebswelle und Kardanwelle","Vollwelle und Hohlwelle"],e:"An- und Abtrieb fluchten. Für den Rückwärtsgang gibt es ein Rücklaufrad."},
{t:"get",q:"Wie läuft der Kraftfluss im 1. Gang eines Dreiwellengetriebes?",a:["z1 → z2 (Konstante) → Vorgelegewelle → z3 → z4 → Hauptwelle","Direkt von der Antriebs- auf die Hauptwelle","Nur über z1","Über den Planetensatz"],e:"Nur im direkten Gang (meist 4.) geht der Kraftfluss nicht über die Vorgelegewelle."},
{t:"get",q:"Welchen Vorteil hat ein 6-Gang- gegenüber einem 5-Gang-Getriebe?",a:["Feinere Abstufung und niedrigere Drehzahl bei hoher Geschwindigkeit – weniger Verbrauch und Geräusch","Es ist leichter","Es braucht keine Kupplung","Es hat keinen Rückwärtsgang"],e:"Auch bessere Beschleunigung durch kleinere Gangsprünge."},
{t:"get",q:"Welchen Vorteil hat ein 6-Gang-Schaltgetriebe gegenüber einer Automatik?",a:["Geringeres Gewicht, geringere Kosten, besserer Wirkungsgrad","Bequemeres Fahren","Schalten ohne Zugkraftunterbrechung","Kein Verschleiß der Kupplung"],e:"Moderne Automatiken holen beim Verbrauch aber auf."},
{t:"get",q:"Welche Bauteile hat eine Sperrsynchronisierung (Borg-Warner)?",a:["Synchronkörper, Schaltmuffe, Druckstücke, Synchronring, Schaltverzahnung, Schaltrad","Pumpenrad, Turbinenrad, Leitrad","Sonnenrad, Hohlrad, Planetenträger","Ritzel und Tellerrad"],e:"Der Synchronring hat Sperrzähne und einen Reibkonus."},
{t:"get",q:"Spaltmaß Synchronring: Einbaumaß 1,1–1,7 mm, Verschleißgrenze 0,5 mm, gemessen 0,3 mm. Was tust du?",a:["Synchronring erneuern, er ist verschlissen","Nichts, alles in Ordnung","Mehr Getriebeöl einfüllen","Die Kupplung tauschen"],e:"0,3 mm liegt unter der Verschleißgrenze von 0,5 mm."},
{t:"get",q:"Warum braucht man mehr Kraft beim Schalten, wenn der Reibkonus verschlissen ist?",a:["Der Gleichlauf wird schlecht hergestellt, der Synchronring sperrt länger","Weil das Öl zu dünn ist","Weil die Kupplung rutscht","Weil der Motor zu wenig Leistung hat"],e:"Folge: Kratzen und schweres Schalten."},
{t:"get",q:"Ein Kegelrollenlager im Getriebe zeigt Pittings. Was tust du?",a:["Lager erneuern, Innen- und Außenring immer zusammen","Nur den Außenring tauschen","Mit Fett nachschmieren","Nichts"],e:"Pittings = Grübchen durch Materialermüdung."},
{t:"get",q:"Welchen Sicherungsring setzt du ein, um das Axialspiel zu beseitigen?",a:["Den dicksten Ring, der gerade noch eingesetzt werden kann","Den dünnsten Ring","Irgendeinen","Gar keinen"],e:"So sitzt das Lager spielfrei. Ringe gibt es in verschiedenen Stärken."},
{t:"get",q:"Was ist die Zugkraftreserve?",a:["Zugkraft im Gang minus Fahrwiderstand","Die maximale Motorleistung","Der Tankinhalt","Die Bremskraft"],e:"Mit der Reserve kann das Fahrzeug beschleunigen oder steiler fahren."},
{t:"get",q:"Wie berechnet man den Luftwiderstand?",a:["F_L = 0,5 · ρ · c_w · A · v²","F_L = m · g · µ","F_L = m · g · sin α","F_L = c_w · v"],e:"Die Geschwindigkeit geht im Quadrat ein: doppelt so schnell = vierfacher Luftwiderstand."},
{t:"get",q:"Wie berechnet man den Rollwiderstand?",a:["F_R = µ_R · m · g","F_R = 0,5 · ρ · c_w · A · v²","F_R = m · a","F_R = P / v"],e:"µ_R ist die Rollwiderstandszahl, beim Pkw auf Asphalt ca. 0,015."},
{t:"get",q:"Ein Fahrzeug mit 2400 kg fährt 2 % Steigung hoch. Wie groß ist der Steigungswiderstand ungefähr?",a:["Ca. 471 N","Ca. 4710 N","Ca. 47 N","Ca. 2400 N"],e:"F_St ≈ m · g · p/100 = 2400 · 9,81 · 0,02 ≈ 471 N."},
{t:"get",q:"Wo liegt im Diagramm die Höchstgeschwindigkeit?",a:["Wo die Radleistungskurve die Fahrwiderstandskurve schneidet","Am Anfang der Kurve","Bei der höchsten Motordrehzahl im 1. Gang","Wo das Drehmoment am größten ist"],e:"Dort reicht die Leistung gerade noch für die Fahrwiderstände."},
{t:"get",q:"In welchem Gang kann ein Fahrzeug die größte Steigung bewältigen?",a:["Im 1. Gang","Im höchsten Gang","Im direkten Gang","Im Schongang"],e:"Größte Übersetzung = größte Zugkraft. Beispiel: 1. Gang ca. 42 %, 4. Gang ca. 6 %."},
{t:"get",q:"Wie prüfst du den Verschleiß eines Synchronrings?",a:["Synchronring auf den Reibkonus drücken und Spaltmaß mit Fühlerlehre messen","Mit dem Multimeter","Durch Wiegen","Durch Abhören"],e:"Mit der Verschleißgrenze aus der Reparaturanleitung vergleichen."},
{t:"get",q:"Was bedeuten Übersetzungen von 3,45 und 0,91 im Getriebe?",a:["3,45 verstärkt das Drehmoment, 0,91 übersetzt ins Schnelle","Beide übersetzen ins Schnelle","Beide verstärken das Drehmoment","3,45 ist der direkte Gang"],e:"i > 1 ins Langsame (mehr Moment), i < 1 ins Schnelle."},
{t:"get",type:"f",q:"Ein Fahrzeug: c_w = 0,34, A = 2,5 m², ρ = 1,2 kg/m³, v = 90 km/h. Berechne den Luftwiderstand.",k:["v = 90 / 3,6 = 25 m/s","F_L = 0,5 · 1,2 · 0,34 · 2,5 · 25²","F_L = 0,5 · 1,2 · 0,34 · 2,5 · 625 ≈ 319 N"]},
// ================= Automatik, DSG & Wandler (Fotos 0013–0018, 0020–0022, 0103) =================
{t:"aut",q:"Welche Getriebe zählen zu den Vollautomaten?",a:["Doppelkupplungsgetriebe, Wandlerautomatik und CVT","Nur Schaltgetriebe mit Kupplungspedal","Nur das automatische Kupplungssystem","Das Verteilergetriebe"],e:"Teilautomatik = z. B. automatisches Kupplungssystem (AKS), geschaltet wird noch von Hand."},
{t:"aut",q:"Wovon hängen Schalten und Kuppeln beim DSG ab?",a:["Drehzahl, Geschwindigkeit, Fahrprogramm, Wählhebel- und Pedalstellung","Nur von der Uhrzeit","Nur vom Tankinhalt","Nur von der Außentemperatur"],e:"Das Mechatronikmodul steuert elektrohydraulisch."},
{t:"aut",q:"Wie lange dauert ein Kupplungswechsel beim DSG ungefähr?",a:["Unter 0,4 Sekunden","Ca. 2 Sekunden","Ca. 5 Sekunden","Ca. 1 Minute"],e:"Der nächste Gang ist schon vorgewählt, nur die Kupplungen wechseln."},
{t:"aut",q:"Wie sind beim DSG die Kupplungen bei Motorstillstand?",a:["Beide offen","Beide geschlossen","K1 geschlossen, K2 offen","K2 geschlossen, K1 offen"],e:"Gegen Wegrollen gibt es die mechanische Parksperre mit Sperrklinke."},
{t:"aut",q:"Planetensatz: Antrieb Hohlrad, Sonnenrad fest, Abtrieb Planetenträger. Was entsteht?",a:["Eine kleinere Untersetzung (2. Stufe)","Der Rückwärtsgang","Die größte Untersetzung","i = 1"],e:"1.: An Sonne, Hohlrad fest. 2.: An Hohlrad, Sonne fest. 3.: verblockt, i = 1. R: Planetenträger fest."},
{t:"aut",q:"Sonnenrad 92 Zähne, Hohlrad 230 Zähne. An Sonne, Hohlrad fest, Ab Planetenträger. Wie groß ist i?",a:["3,5","2,5","1,4","1"],e:"i = 1 + z_Hohlrad / z_Sonne = 1 + 230/92 = 3,5."},
{t:"aut",q:"Sonne 92, Hohlrad 230 Zähne. An Sonne, Planetenträger fest, Ab Hohlrad. Wie groß ist i?",a:["−2,5 (Rückwärtsgang)","3,5","1,4","1"],e:"i = −z_Hohlrad / z_Sonne = −230/92 = −2,5. Minus = andere Drehrichtung."},
{t:"aut",q:"Warum reicht ein einzelner Planetensatz für ein Pkw-Automatikgetriebe nicht?",a:["Zu wenige Gänge und zu große Gangsprünge","Er ist zu schwer","Er hat keinen Rückwärtsgang","Er kann kein Drehmoment übertragen"],e:"Darum kombiniert man mehrere Sätze, z. B. vier beim ZF 8HP."},
{t:"aut",q:"Was machen die Antriebskupplungen im Automatgetriebe?",a:["Sie verbinden Teile des Planetensatzes kraftschlüssig mit der Antriebswelle","Sie bremsen Teile gegen das Gehäuse","Sie kühlen das Öl","Sie verriegeln die Parksperre"],e:"Bremskupplungen halten Teile gegen das Gehäuse fest."},
{t:"aut",q:"Welche Ölpumpe hat das ZF 8HP?",a:["Eine Flügelzellenpumpe","Eine Zahnradpumpe am Rad","Eine Membranpumpe","Gar keine"],e:"Dazu Wandler mit Überbrückungskupplung, Mechatronikmodul und Parksperre."},
{t:"aut",q:"Ab wann arbeitet der Wandler als reine Kupplung (Kupplungspunkt)?",a:["Ab ca. 85–90 % Drehzahlgleichheit von Pumpe und Turbine","Sofort beim Anfahren","Nie","Nur im Rückwärtsgang"],e:"Dann löst sich das Leitrad über den Freilauf und dreht frei mit."},
{t:"aut",q:"Welche Vorteile hat ein Drehmomentwandler?",a:["Stufenlos, weiches Anfahren, kein mechanischer Verschleiß, dämpft Schwingungen","Kein Schlupf","Sehr leicht und billig","Besonders hoher Wirkungsgrad beim Anfahren"],e:"Nachteil ist der Schlupf – dagegen hilft die Überbrückungskupplung."},
// ================= Kupplung (Arbeitsheft Antriebsstrang – Fotos 0019, 0022, 0347–0364) =================
{t:"kup",q:"Welche Kupplungsarten gibt es im Kfz?",a:["Reibungs-, hydrodynamische, elektromagnetische und Doppelkupplung","Nur Klauenkupplungen","Nur Visco-Kupplungen","Nur Fliehkraftkupplungen"],e:"Im Pkw am häufigsten: Einscheiben-Trockenkupplung mit Membranfeder."},
{t:"kup",q:"Wann muss der Kraftfluss durch die Kupplung unterbrochen werden?",a:["Beim Anfahren, beim Schalten und beim Anhalten mit laufendem Motor","Nur beim Tanken","Nur beim Rückwärtsfahren","Nie"],e:"Schalten nur lastfrei."},
